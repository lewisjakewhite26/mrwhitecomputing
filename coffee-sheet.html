<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Your Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  @page{size:A4 portrait;margin:10mm}
  *{box-sizing:border-box}
  html,body{margin:0;background:#E9E2D4;color:#1E1B18;font-family:'Atkinson Hyperlegible',Arial,sans-serif}
  .bar{max-width:210mm;margin:16px auto 0;display:flex;justify-content:space-between;padding:0 4px}
  .bar a,.bar button{font:inherit;font-weight:700;font-size:16px;color:#1E1B18;background:#fff;border:2px solid #1E1B18;border-radius:999px;padding:8px 18px;text-decoration:none;cursor:pointer}
  .bar button{background:#1E1B18;color:#fff}
  .page{width:210mm;height:297mm;margin:12px auto 30px;background:#fff;padding:12mm;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:5mm;break-after:page}
  @media print{ html,body{background:#fff} .bar{display:none} .page{margin:0;box-shadow:none;width:auto;height:277mm;padding:0} }
  .top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1E1B18;padding-bottom:3mm}
  h1{font-family:'Archivo Black',Arial Black,sans-serif;font-weight:400;font-size:26pt;margin:0;line-height:1}
  .k{font-size:10pt;font-weight:700;letter-spacing:.16em;color:#B5501F}
  .name{font-size:13pt;font-weight:700;display:flex;gap:3mm;align-items:flex-end;width:80mm}
  .name span{flex:1;border-bottom:1.5px solid #1E1B18;height:7mm}
  .task{font-size:13pt;line-height:1.4}
  .key{display:flex;gap:10mm;align-items:center;font-size:12pt;font-weight:700;border:2px solid #1E1B18;border-radius:4mm;padding:3mm 5mm}
  .key div{display:flex;gap:3mm;align-items:center}
  svg.map{flex:1;width:100%}
  .lab{font-size:11pt;font-weight:700}
</style>
</head>
<body>
<div class="bar"><a href="coffee.html">Back to the lesson</a><button type="button" onclick="window.print()">Print (two-sided)</button></div>
<div id="pages"></div>
<script>
(function(){
  var dev = [[0,-1],[.95,-.5],[.95,.5],[0,1],[-.95,.5],[-.95,-.5]];
  function map(centre){
    return '<svg class="map" viewBox="-330 -330 660 660" preserveAspectRatio="xMidYMid meet">' +
      dev.map(function(d){ var x = d[0] * 245, y = d[1] * 245;
        return '<line x1="0" y1="0" x2="' + (x * .62).toFixed(0) + '" y2="' + (y * .62).toFixed(0) + '" stroke="#bbb" stroke-width="2" stroke-dasharray="3 6"/>' +
          '<rect x="' + (x - 75) + '" y="' + (y - 62) + '" width="150" height="124" rx="12" fill="#fff" stroke="#1E1B18" stroke-width="3"/>' +
          '<line x1="' + (x - 60) + '" y1="' + (y + 44) + '" x2="' + (x + 60) + '" y2="' + (y + 44) + '" stroke="#999" stroke-width="1.5"/>'; }).join('') +
      '<rect x="-95" y="-50" width="190" height="100" rx="14" fill="#fff" stroke="#1E1B18" stroke-width="5"/>' +
      '<text y="-12" text-anchor="middle" font-family="Archivo Black,Arial Black" font-size="20">' + centre + '</text>' +
      '<line x1="-70" y1="26" x2="70" y2="26" stroke="#999" stroke-width="1.5"/></svg>';
  }
  var key = '<div class="key"><span>Join each device to the middle:</span>' +
    '<div><svg width="70" height="14"><line x1="2" y1="7" x2="68" y2="7" stroke="#1E1B18" stroke-width="4"/></svg> cable</div>' +
    '<div><svg width="70" height="16"><path d="M2 8 q8 -8 16 0 t16 0 t16 0 t16 0" stroke="#1E1B18" stroke-width="4" fill="none"/></svg> wireless</div></div>';
  document.getElementById('pages').innerHTML =
    '<div class="page"><div class="top"><div><div class="k">SEND ME A COFFEE</div><h1>Map your network</h1></div><div class="name">Name <span></span></div></div>' +
      '<div class="task">Write your <b>class</b> in the middle. In each box, <b>draw and label</b> a device in school that is connected. Then join it to the middle.</div>' + key + map('Class') + '</div>' +
    '<div class="page"><div class="top"><div><div class="k">FINISHED? TRY THIS</div><h1>Pick a place</h1></div><div class="name">Name <span></span></div></div>' +
      '<div class="task">Choose a place: <b>home</b>, a <b>café</b>, a <b>hospital</b>, a <b>football stadium</b>, a <b>spaceship</b>… Write it in the middle. What devices would be connected there?</div>' + key + map('My place:') + '</div>';
})();
</script>
</body>
</html>
