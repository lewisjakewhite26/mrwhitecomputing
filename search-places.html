<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Search from anywhere</title>
<style>
  :root{
    --ground-1:#EDEFF7; --ground-2:#F5F5FA; --paper:#FCFCFE; --paper-edge:#E7E9F2;
    --ink:#1C2431; --muted:#4A5261; --soft:#6B7280;
    --in:#2F6BE0; --proc:#6C4CE0; --out:#0E9C6A;
    --neon:#39FF88; --neon-dim:rgba(57,255,136,.45); --night:#030D07;
    --shadow-md:0 14px 32px -14px rgba(24,28,45,0.2); --shadow-sm:0 6px 16px -8px rgba(24,28,45,0.18);
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);color:var(--ink);
    background:radial-gradient(50vw 50vw at 8% -10%, rgba(108,76,224,0.08), transparent 60%),linear-gradient(165deg,var(--ground-1),var(--ground-2))}
  .app{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:20px;padding:20px 24px}
  header{grid-column:1/-1;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
  header h1{margin:0;font-size:clamp(1.8rem,3.2vw,2.6rem);font-weight:800;letter-spacing:-.02em}
  header p{margin:0;color:var(--muted);font-size:clamp(1rem,1.5vw,1.2rem)}
  .left{display:flex;flex-direction:column;gap:14px;min-height:0}
  .bar{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid #DADCE0;border-radius:999px;padding:14px 26px;box-shadow:var(--shadow-sm);font-size:clamp(1.5rem,2.8vw,2.2rem)}
  .bar svg{flex:none}
  .bar .from{margin-left:auto;font-size:clamp(.9rem,1.4vw,1.1rem);color:var(--soft);text-align:right}
  .caret{display:inline-block;width:3px;height:1em;background:var(--in);vertical-align:-.1em;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .terms{display:flex;gap:10px;flex-wrap:wrap}
  .terms button{font:inherit;font-weight:700;font-size:clamp(1.05rem,1.8vw,1.35rem);padding:10px 22px;border-radius:999px;border:2px solid var(--paper-edge);background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .15s var(--ease)}
  .terms button:hover{transform:translateY(-2px)}
  .terms button[aria-pressed="true"]{background:var(--proc);border-color:var(--proc);color:#fff}
  .map{position:relative;flex:1;min-height:320px;border-radius:22px;overflow:hidden;background:radial-gradient(80% 90% at 50% 45%, #07261A, var(--night));box-shadow:var(--shadow-md), inset 0 0 80px rgba(0,0,0,.7)}
  .map svg{position:absolute;inset:0;width:100%;height:100%}
  .land{fill:#06190D;stroke:var(--neon-dim);stroke-width:1.1;filter:url(#glow)}
  .country{fill:#0A2A16;stroke:var(--neon);stroke-width:1.3;cursor:pointer;transition:fill .3s}
  .country:hover{fill:#114226}
  .country.on{fill:rgba(57,255,136,.28)}
  .pin{cursor:pointer}
  .pin .core{fill:var(--neon)}
  .pin .halo{fill:var(--neon);opacity:.25;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s var(--ease) infinite}
  .pin.on .halo{opacity:.5}
  .pin text{fill:var(--neon);font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .pin:focus{outline:none}.pin:focus-visible .core{stroke:#fff;stroke-width:3}
  @keyframes pulse{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.4);opacity:0}}
  .cross line{stroke:var(--neon);stroke-width:1;opacity:.35;transition:all .6s var(--ease)}
  .maphint{position:absolute;left:18px;bottom:14px;color:var(--neon);font-family:var(--mono);font-size:clamp(.85rem,1.3vw,1rem);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
  .right{background:var(--paper);border:1px solid var(--paper-edge);border-radius:22px;box-shadow:var(--shadow-md);padding:22px 26px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
  .rhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .rfor{font-size:clamp(1rem,1.6vw,1.2rem);color:var(--muted)}
  .rfor b{color:var(--ink)}
  .toggle{font:inherit;font-weight:700;font-size:1rem;padding:8px 16px;border-radius:999px;border:2px solid var(--paper-edge);background:#fff;cursor:pointer}
  .toggle[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .results{display:flex;flex-direction:column;gap:16px}
  .res{animation:rise .45s var(--ease) both}
  .res .src{font-size:clamp(.85rem,1.3vw,1rem);color:var(--soft)}
  .res .t{font-size:clamp(1.2rem,2vw,1.55rem);font-weight:700;color:var(--in);line-height:1.25}
  .res .s{font-size:clamp(1rem,1.5vw,1.15rem);color:var(--muted);line-height:1.4}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .empty{margin:auto;text-align:center;color:var(--muted);font-size:clamp(1.2rem,2vw,1.5rem);max-width:22ch;line-height:1.4}
  pre.data{margin:0;background:#0F1720;color:#D6DEEB;border-radius:14px;padding:18px 20px;font-family:var(--mono);font-size:clamp(.85rem,1.3vw,1.05rem);line-height:1.5;white-space:pre-wrap;word-break:break-word;animation:rise .45s var(--ease) both}
  pre.data .k{color:#7FDBCA}pre.data .v{color:#ECC48D}pre.data .n{color:#F78C6C}
  @media (max-width:900px){.app{grid-template-columns:1fr}.map{min-height:260px}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

  var term = TERMS[0], place = null, showData = false, typer = [];

  var $ = function(id){ return document.getElementById(id); };

  var termsEl = $('terms');
  TERMS.forEach(function(t){
    var b = document.createElement('button'); b.textContent = t; b.setAttribute('aria-pressed', t === term);
    b.addEventListener('click', function(){ setTerm(t); });
    termsEl.appendChild(b);
  });

  function type(word){
    typer.forEach(clearTimeout); typer = [];
    var q = $('q'); q.textContent = '';
    if(RM){ q.textContent = word; return; }
    word.split('').forEach(function(ch, i){ typer.push(setTimeout(function(){ q.textContent += ch; }, 90 * i)); });
  }
  function setTerm(t){
    term = t;
    [].forEach.call(termsEl.children, function(b){ b.setAttribute('aria-pressed', b.textContent === t); });
    type(t); render();
  }
  function setPlace(k){
    place = k;
    [].forEach.call(document.querySelectorAll('.country,.pin'), function(el){ el.classList.toggle('on', el.getAttribute('data-k') === k); });
    var p = PINS[k];
    $('cx').setAttribute('x1', p[0]); $('cx').setAttribute('x2', p[0]); $('cx').setAttribute('opacity', 1);

    $('hint').textContent = 'Searching from ' + PLACES[k].name;
    render();
  }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function j(k, v, last){ return '  <span class="k">"' + k + '"</span>: ' + v + (last ? '' : ',') + '\n'; }
  function str(s){ return '<span class="v">"' + esc(s) + '"</span>'; }
  function render(){
    $('from').textContent = place ? 'from ' + PLACES[place].name : '';

    if(showData){
      var s = '{\n' + j('search_term', str(term)) + j('location_used', str(p.name + ', ' + p.country)) +

          return '    { <span class="k">"position"</span>: <span class="n">' + (i + 1) + '</span>, <span class="k">"title"</span>: ' + str(r[1]) + ', <span class="k">"source"</span>: ' + str(r[0]) + ' }' + (i < list.length - 1 ? ',' : '');
