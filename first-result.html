<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Case of the First Result</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap">
<style>
  :root{
    --desk:#2E2219; --man:#E6D19C; --man2:#D8C185; --paper:#FFFDF6; --ink:#2B2118; --mu:#5E4E3C;
    --red:#A3221B; --blue:#1F3E8C; --cork:#B98A5A;
    --se:'Special Elite','Courier New',monospace; --cp:'Courier Prime','Courier New',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--desk);color:var(--ink);font-family:var(--cp)}
  body{background:repeating-linear-gradient(97deg,rgba(255,255,255,.018) 0 3px,transparent 3px 11px),var(--desk)}
  button{font:inherit}

  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#0b0d12;z-index:5}
  #frame.on{display:block}
  #fnav{position:fixed;bottom:16px;right:16px;z-index:10;display:none;gap:8px}
  #fnav.on{display:flex}
  #fnav button{font-family:var(--cp);font-size:16px;font-weight:700;padding:10px 20px;border-radius:999px;border:2px solid var(--man);background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
  #fnav button.primary{background:var(--red);border-color:var(--red);color:#fff}

  #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #fit.off{display:none}
  #stage{position:relative;width:1600px;height:900px;flex:none;transform-origin:center center;outline:none}

  /* the folder every slide sits in */
  .tab{position:absolute;left:40px;top:14px;height:40px;min-width:240px;padding:0 28px;background:var(--man);border-radius:12px 12px 0 0;font-family:var(--se);font-size:22px;letter-spacing:.14em;display:flex;align-items:center;color:var(--ink);text-transform:uppercase}
  .folder{position:absolute;left:40px;top:52px;width:1520px;height:744px;background:var(--man);border-radius:2px 12px 12px 12px;box-shadow:0 22px 50px -20px rgba(0,0,0,.7)}
  .folder.shake{animation:shake .28s ease}
  @keyframes shake{25%{transform:translate(2px,3px)}50%{transform:translate(-2px,-1px)}75%{transform:translate(1px,2px)}}
  .scene{position:absolute;inset:0}
  .scene.enter{animation:slidein .55s cubic-bezier(.16,1,.3,1)}
  @keyframes slidein{from{opacity:0;transform:translateY(34px) rotate(-.6deg)}to{opacity:1;transform:none}}

  .home{position:absolute;right:40px;top:12px;font-size:18px;font-weight:700;color:var(--man);text-decoration:none;border:2px solid rgba(230,209,156,.4);border-radius:999px;padding:7px 18px}
  .home:hover{border-color:var(--man)}
  .nav{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;gap:20px}
  .btn{font-family:var(--cp);font-size:26px;font-weight:700;min-height:62px;padding:0 34px;border-radius:999px;border:3px solid var(--man);background:transparent;color:var(--man);cursor:pointer}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff}
  .btn:disabled{opacity:.3;cursor:default}
  .mid{display:flex;align-items:center;gap:22px}
  .parts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px;justify-content:center}
  .part{width:14px;height:14px;border-radius:50%;border:2px solid #8C7A5E;background:transparent;padding:0;cursor:pointer}
  .part.done{background:#8C7A5E}
  .part.on{background:var(--man);border-color:var(--man)}
  .tool{font-family:var(--cp);font-size:16px;font-weight:700;color:var(--man);background:transparent;border:2px solid rgba(230,209,156,.35);border-radius:999px;padding:7px 14px;cursor:pointer}
  .tool[aria-pressed="true"]{border-color:var(--man)}

  #notes{position:absolute;left:40px;right:40px;bottom:104px;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:16px 22px;font-size:21px;line-height:1.4;display:none;z-index:4;box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
  #notes.on{display:block}
  #notes b{font-family:var(--se);font-weight:400;letter-spacing:.06em;margin-right:10px}

  /* reveal steps */
  .pp{transition:opacity .45s ease,transform .45s cubic-bezier(.16,1,.3,1)}
  .pp.hide{opacity:0;transform:translateY(14px);pointer-events:none}
  .abs{position:absolute}

  /* type */
  .kick{font-family:var(--cp);font-weight:700;font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:var(--mu)}
  .h1{font-family:var(--se);font-weight:400;font-size:96px;line-height:1.02;margin:0}
  .h2{font-family:var(--se);font-weight:400;font-size:60px;line-height:1.08;margin:0}
  .big{font-family:var(--cp);font-size:36px;line-height:1.35;font-weight:400}
  .body{font-family:var(--cp);font-size:30px;line-height:1.38}
  .small{font-family:var(--cp);font-size:22px;line-height:1.35}
  .se{font-family:var(--se);font-weight:400}
  .red{color:var(--red)}
  .tw .cur{display:inline-block;width:.5em;border-bottom:4px solid currentColor;margin-left:2px;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* paper things */
  .paper{background:var(--paper);box-shadow:0 8px 18px -8px rgba(46,34,25,.45)}
  .index{background:var(--paper);box-shadow:0 8px 18px -8px rgba(46,34,25,.45);background-image:linear-gradient(transparent 62px,#D96B63 62px,#D96B63 64px,transparent 64px),repeating-linear-gradient(transparent 0 46px,#C9D6EA 46px 48px);background-position:0 0,0 18px}
  .clip{position:absolute;top:-24px;width:30px;height:64px}
  .pin{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E2574C,#8E1C16);box-shadow:0 3px 4px rgba(0,0,0,.4)}

  /* stamps */
  .stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:5px solid var(--red);color:var(--red);font-family:var(--se);text-transform:uppercase;letter-spacing:.06em;padding:8px 20px;border-radius:10px;transform:rotate(var(--r,-6deg));mix-blend-mode:multiply;opacity:.92;line-height:1}
  .stamp.round{border-radius:50%;padding:0}
  .stamp.ink{border-color:var(--ink);color:var(--ink)}
  .stamp.thump{animation:thump .4s cubic-bezier(.3,1.4,.5,1)}
  @keyframes thump{0%{opacity:0;transform:scale(2.4) rotate(var(--r,-6deg));filter:blur(3px)}55%{opacity:1;transform:scale(.93) rotate(var(--r,-6deg));filter:blur(0)}100%{transform:scale(1) rotate(var(--r,-6deg))}}

  /* timer tape */
  .tape{display:inline-flex;flex-direction:column;align-items:flex-start;gap:6px;background:#F3EEDF;padding:16px 30px 14px;text-align:left;transform:rotate(1.5deg);box-shadow:0 4px 10px -4px rgba(46,34,25,.4);cursor:pointer;border:0;color:var(--ink);font-family:var(--cp)}
  .tape .lab{font-size:20px;font-weight:700;letter-spacing:.14em}
  .tape .t{font-family:var(--se);font-size:72px;line-height:1;min-width:4.2ch}
  .tape .hint{font-size:16px;font-weight:700;color:var(--mu)}
  .tape.low{animation:flash 1s steps(1) infinite}
  .tape.low .t,.tape.done .t{color:var(--red)}
  @keyframes flash{50%{background:#F6D9D3}}

  /* buttons inside slides */
  .tbtn{font-family:var(--cp);font-size:22px;font-weight:700;padding:10px 22px;border-radius:999px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
  .tbtn.solid{background:var(--ink);color:var(--paper)}

  /* pretend search page */
  .sp{position:absolute;padding:28px 36px;background:#fff;box-shadow:0 10px 22px -10px rgba(46,34,25,.5)}
  .sbar{display:flex;align-items:center;gap:14px;border:2.5px solid #C9C2B4;border-radius:999px;padding:12px 24px;font-family:var(--cp);font-size:30px;font-weight:700;color:var(--ink)}
  .res{margin-top:22px;position:relative}
  .res .r{padding:12px 0 14px;border-bottom:1.5px dashed #DDD5C6}
  .res .r .u{font-size:18px;color:#5C6B57}
  .res .r .ti{font-size:28px;font-weight:700;color:var(--blue);text-decoration:underline;text-underline-offset:4px}
  .res .r .d{font-size:20px;color:#4A4038}
  .spon{display:inline-block;font-size:16px;font-weight:700;letter-spacing:.08em;background:var(--ink);color:#fff;padding:2px 8px;margin-right:8px;vertical-align:2px}

  /* flip card */
  .flip{perspective:1600px}
  .flip .in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d}
  .flip.over .in{transform:rotateY(180deg)}
  .flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .flip .b{transform:rotateY(180deg)}

  /* photo slot */
  .photo{position:absolute;background:#fff;padding:16px 16px 54px;box-shadow:0 12px 26px -10px rgba(46,34,25,.6)}
  .photo .img{width:100%;height:100%;background:#E9E3D3;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:contain;background:#111;display:block}
  .photo .cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:var(--se);font-size:26px}
  .photo label{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:30px;font-size:24px;font-weight:700;cursor:pointer;color:var(--mu)}
  .photo input{display:none}

  /* rows that move */
  .mv{position:absolute;transition:left .8s cubic-bezier(.5,0,.2,1),top .8s cubic-bezier(.5,0,.2,1),transform .8s cubic-bezier(.5,0,.2,1),opacity .5s}

  /* sliders */
  .sl{display:flex;flex-direction:column;gap:6px}
  .sl span{font-size:20px;font-weight:700}
  .sl input{width:100%;accent-color:var(--red);height:34px}

  /* cork board */
  .cork{position:absolute;inset:26px;background-color:var(--cork);background-image:radial-gradient(rgba(60,35,15,.25) 1.4px,transparent 1.6px),radial-gradient(rgba(255,240,210,.18) 1.2px,transparent 1.4px);background-size:22px 22px,17px 17px;background-position:0 0,8px 11px;border:14px solid #6B4A2B;border-radius:6px}
  .ecard{position:absolute;width:420px;min-height:120px;background:var(--paper);padding:20px 22px 18px;box-shadow:0 8px 14px -6px rgba(0,0,0,.45);cursor:pointer}
  .ecard .lab{font-size:16px;font-weight:700;letter-spacing:.14em;color:var(--mu)}
  .ecard .ed{font-family:var(--se);font-size:30px;min-height:38px;outline:none;border-bottom:2px dashed #CDBFA6;margin-top:6px}
  .ecard.sel{outline:5px solid var(--red);outline-offset:4px}
  .rcard{position:absolute;width:400px;background:var(--paper);padding:18px 22px;box-shadow:0 8px 14px -6px rgba(0,0,0,.45);font-size:27px;font-weight:700;cursor:pointer}
  .LU.out > :not(.CAUGHT){opacity:.35}
  .rcard small{display:block;font-size:19px;font-weight:400;color:var(--mu);margin-top:4px}

  /* video */
  .screen{position:absolute;background:#0E0B08;border:12px solid #1B140E;border-radius:8px;box-shadow:0 18px 30px -12px rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .screen iframe{width:100%;height:100%;border:0}
  .playbtn{display:flex;flex-direction:column;align-items:center;gap:18px;background:none;border:0;color:var(--man);cursor:pointer;font-family:var(--se);font-size:34px}
  .playbtn i{width:120px;height:120px;border-radius:50%;border:5px solid var(--man);display:flex;align-items:center;justify-content:center}
  .links{display:flex;gap:16px;justify-content:center}
  .links a{font-family:var(--cp);font-size:21px;font-weight:700;color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:8px 18px;text-decoration:none;background:var(--paper)}

  /* orbit */
  .orbit svg{cursor:crosshair;touch-action:none}

  @media (prefers-reduced-motion: reduce){
    .pp,.mv,.flip .in{transition:none}
    .scene.enter,.stamp.thump,.folder.shake,.tape.low{animation:none}
  }
</style>
</head>
<body>
<iframe id="frame" title="Embedded page"></iframe>
<div id="fnav"><button type="button" id="fback">Back</button><button type="button" class="primary" id="fnext">Next</button></div>
<div id="fit">
  <div id="stage" tabindex="-1">
    <div class="tab" id="tab">Case file 02</div>
    <a class="home" id="home" href="index.html#/g/y56">All lessons</a>
    <div class="folder" id="folder"><div id="host"></div></div>
    <div id="notes"></div>
    <div class="nav">
      <button class="btn" id="back" type="button">Back</button>
      <div class="mid">
        <button class="tool" id="snd" type="button" aria-pressed="true">Sound on</button>
        <div class="parts" id="parts"></div>
        <button class="tool" id="nbtn" type="button" aria-pressed="false">Notes</button>
      </div>
      <button class="btn primary" id="next" type="button">Next</button>
    </div>
  </div>
</div>

<script>
(function(){
  var stage = document.getElementById('stage'), host = document.getElementById('host'), folder = document.getElementById('folder');
  var frame = document.getElementById('frame'), fit = document.getElementById('fit'), fnav = document.getElementById('fnav');
  function size(){ stage.style.transform = 'scale(' + Math.min(innerWidth / 1600, innerHeight / 900) + ')'; }
  addEventListener('resize', size); size();
  var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

  /* ---------------- sound: a rubber stamp thud, made on the spot ---------------- */
  var soundOn = store('fr_sound') !== 'off', AC = null, lastThud = 0;
  function thud(){
    if(!soundOn || Date.now() - lastThud < 90) return;
    lastThud = Date.now();
    try{
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(48, t + .14);
      g.gain.setValueAtTime(.55, t); g.gain.exponentialRampToValueAtTime(.001, t + .2);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .22);
      var n = AC.createBuffer(1, AC.sampleRate * .06, AC.sampleRate), d = n.getChannelData(0);
      for(var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      var s = AC.createBufferSource(), g2 = AC.createGain(); s.buffer = n; g2.gain.value = .25;
      s.connect(g2); g2.connect(AC.destination); s.start(t);
    }catch(e){}
  }
  var sndBtn = document.getElementById('snd');
  function sndPaint(){ sndBtn.textContent = soundOn ? 'Sound on' : 'Sound off'; sndBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false'); }
  sndBtn.addEventListener('click', function(e){ e.stopPropagation(); soundOn = !soundOn; store('fr_sound', soundOn ? 'on' : 'off'); sndPaint(); stage.focus({ preventScroll:true }); });
  sndPaint();

  /* ---------------- small effects ---------------- */
  var timers = [];
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

  function stampIn(el, delay){
    later(function(){
      el.classList.remove('thump'); void el.offsetWidth; el.classList.add('thump');
      later(function(){ thud(); folder.classList.remove('shake'); void folder.offsetWidth; folder.classList.add('shake'); }, 150);
    }, delay || 0);
  }
  function typeOut(el){
    var text = el.getAttribute('data-text');
    if(text === null){ text = el.textContent; el.setAttribute('data-text', text); }
    if(RM){ el.textContent = text; return; }
    el.innerHTML = '<span class="cur"></span>';
    for(var i = 0; i < text.length; i++){
      (function(k){ later(function(){ el.innerHTML = esc(text.slice(0, k + 1)) + (k < text.length - 1 ? '<span class="cur"></span>' : ''); }, 40 * k + 120); })(i);
    }
  }
  function drawIn(path, delay){
    var len = path.getTotalLength();
    path.style.transition = 'none'; path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
    path.getBoundingClientRect();
    later(function(){ path.style.transition = 'stroke-dashoffset .9s ease'; path.style.strokeDashoffset = 0; }, delay || 0);
  }
  function settle(el){
    // show something in its finished state, with no animation (used going backwards)
    [].forEach.call(el.querySelectorAll('[data-text]'), function(t){ t.textContent = t.getAttribute('data-text'); });
    if(el.hasAttribute && el.hasAttribute('data-text')) el.textContent = el.getAttribute('data-text');
  }
  function effects(el){
    if(el.classList.contains('stamp')) stampIn(el);
    [].forEach.call(el.querySelectorAll('.stamp'), function(s, i){ stampIn(s, i * 260); });
    if(el.classList.contains('tw')) typeOut(el);
    [].forEach.call(el.querySelectorAll('.tw'), typeOut);
    [].forEach.call(el.querySelectorAll('.draw'), function(p, i){ drawIn(p, i * 200); });
  }

  /* ---------------- the countdown tape ---------------- */
  var tick = null;
  function stopTape(){ clearInterval(tick); tick = null; }
  function tape(mins){
    return '<button type="button" class="tape" data-secs="' + mins * 60 + '"><span class="lab">TIME LEFT</span><span class="t">' + fmt(mins * 60) + '</span><span class="hint">tap to start</span></button>';
  }
  function fmt(s){ return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function wireTape(r){
    var b = r.querySelector('.tape'); if(!b) return;
    var left = +b.getAttribute('data-secs'), t = b.querySelector('.t'), h = b.querySelector('.hint');
    b.addEventListener('click', function(e){
      e.stopPropagation();
      if(left <= 0){ left = +b.getAttribute('data-secs'); t.textContent = fmt(left); b.classList.remove('done', 'low'); h.textContent = 'tap to start'; return; }
      if(tick){ stopTape(); h.textContent = 'paused'; return; }
      h.textContent = 'tap to pause';
      tick = setInterval(function(){
        left--; t.textContent = fmt(Math.max(0, left));
        b.classList.toggle('low', left > 0 && left <= 10);
        if(left <= 0){ stopTape(); b.classList.remove('low'); b.classList.add('done'); h.textContent = 'time is up'; stampIn(b); }
      }, 1000);
    });
  }

  /* ---------------- pictures ---------------- */
  var CLIP = '<svg class="clip" viewBox="0 0 30 64" fill="none" stroke="#6E7378" stroke-width="3" stroke-linecap="round"><path d="M9 20V48a6 6 0 0 0 12 0V12a9 9 0 0 0-18 0v40a12 12 0 0 0 24 0V22"/></svg>';
  var MAG = '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#5E4E3C" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>';
  var CAMX = '<svg viewBox="0 0 48 48" width="64" height="64" fill="none" stroke="#2B2118" stroke-width="3" stroke-linejoin="round"><path d="M6 16h8l4-5h12l4 5h8v22H6z"/><circle cx="24" cy="26" r="7"/><path d="M4 44 44 4" stroke="#A3221B" stroke-width="5" stroke-linecap="round"/></svg>';
  var PAIR = '<svg viewBox="0 0 48 48" width="64" height="64" fill="none" stroke="#2B2118" stroke-width="3" stroke-linecap="round"><circle cx="16" cy="15" r="6"/><circle cx="32" cy="15" r="6"/><path d="M5 40c0-8 5-13 11-13s11 5 11 13M21 40c0-8 5-13 11-13s11 5 11 13"/></svg>';
  var PEN = '<svg viewBox="0 0 48 48" width="64" height="64" fill="none" stroke="#2B2118" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 40l3-10L32 9l7 7-21 21z"/><path d="M28 13l7 7"/></svg>';
  var HASH = '<svg viewBox="0 0 48 48" width="64" height="64" fill="none" stroke="#2B2118" stroke-width="3" stroke-linecap="round"><path d="M10 18h30M8 30h30M20 8l-4 32M32 8l-4 32"/></svg>';
  var GLOBE = '<svg viewBox="0 0 48 48" width="64" height="64" fill="none" stroke="#2B2118" stroke-width="3"><circle cx="24" cy="24" r="17"/><path d="M7 24h34M24 7c6 6 6 28 0 34M24 7c-6 6-6 28 0 34"/></svg>';
  var PENNY = '<svg viewBox="0 0 300 220" width="100%" height="100%"><g fill="none" stroke="#3C3127" stroke-width="5"><circle cx="110" cy="128" r="80"/><circle cx="246" cy="190" r="22"/><path d="M110 128 L246 190 M110 48 L140 30 M120 40 l14 -6 M110 128 L72 165 M110 128 L148 165 M110 128 L110 208 M110 128 L110 48 M110 128 L40 128 M110 128 L180 128 M110 128 L55 72 M110 128 L165 72 M110 128 L55 184 M110 128 L165 184"/></g><g fill="#3C3127"><circle cx="128" cy="22" r="12"/><path d="M118 34 q10 -4 22 2 l8 40 q-6 6 -16 4z"/><path d="M134 74 l-18 46 6 2 20 -40z"/></g></svg>';

  function photo(o){
    // a real photo if it loads; otherwise a box to load one from this computer
    var pick = '<label><svg viewBox="0 0 48 48" width="70" height="70" fill="none" stroke="#5E4E3C" stroke-width="3" stroke-linejoin="round"><rect x="5" y="9" width="38" height="30" rx="3"/><circle cx="17" cy="20" r="4"/><path d="M5 34l11-9 8 6 6-4 13 10"/></svg>' +

      build:function(r){

          '<div class="abs" style="left:590px;top:640px;width:340px;background:var(--paper);padding:10px 16px;transform:rotate(1deg)"><span class="small" style="font-size:20px">Tap a search, then the rule it used. Tap a search twice to unpin it.</span></div>' +
          [0, 1, 2].map(function(i){ return '<div class="ecard EC" data-k="e' + i + '" style="left:' + (90 + (i % 2) * 30) + 'px;top:' + (160 + i * 180) + 'px;transform:rotate(' + [-2, 1.5, -1][i] + 'deg)"><span class="pin" style="left:46%;top:-10px"></span><div class="lab">BEST SEARCH ' + (i + 1) + '</div><div class="ed" contenteditable="true" spellcheck="false"></div></div>'; }).join('') +
          rules.map(function(t, i){ return '<div class="rcard RC pp" data-s="' + (i + 1) + '" data-k="r' + i + '" style="left:' + (1010 - (i % 2) * 40) + 'px;top:' + (130 + i * 145) + 'px;transform:rotate(' + [1.5, -2, 1, -1.5][i] + 'deg)"><span class="pin" style="left:46%;top:-10px"></span>' + t[0] + '<small>' + t[1] + '</small></div>'; }).join('') +

        var sel = null, links = [], svg = r.querySelector('.STR');

        function drawLinks(anim){

      build:function(r){

          LINEUP.map(function(s, i){

              '<div class="se" style="width:58px;height:58px;border:4px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;flex:none">' + s.id + '</div>' + PIZ(s.pic, 76) +
              '<div style="width:330px;flex:none"><div class="small" style="color:#5C6B57">' + esc(s.n) + '</div><div style="font-size:' + (s.cheat ? 17 : 23) + 'px;font-weight:700;color:var(--blue);line-height:1.15">' + esc(s.t) + '</div></div>' +
              '<div style="display:flex;gap:10px">' + s.s.map(function(v, k){ return '<div style="width:66px;text-align:center"><div style="font-size:13px;font-weight:700;color:var(--mu)">' + ['WORDS', 'LINKS', 'STAY', 'NEW'][k] + '</div><div class="se" style="font-size:32px' + (s.cheat && k === 0 ? ';color:var(--red)' : '') + '">' + v + '</div></div>'; }).join('') + '</div>' +
              '<div class="se red RK" style="font-size:46px;margin-left:auto;width:60px;text-align:right"></div>' +
              (s.cheat ? '<span class="stamp manual CAUGHT" style="--r:-8deg;position:absolute;left:280px;top:14px;font-size:48px;display:none;background:rgba(255,253,246,.85)">Caught</span>' : '') +
            '</div>';
          }).join('') +

            '<div class="se" style="font-size:30px">How much does each rule count?</div>' +

            '<div class="pp small" data-s="3" data-only="1" style="font-weight:700;color:var(--red)">Only matching words count now.</div>' +
          '</div>' +
          '<div class="abs pp" data-s="4" style="left:1120px;top:636px;width:340px" ><div class="small"><b>Keyword stuffing:</b> repeating words to cheat. Google punishes it.</div></div>';
        var self = this;
        [].forEach.call(r.querySelectorAll('.sl input'), function(inp){
          inp.addEventListener('input', function(){ self.order(r, self.now); });

          inp.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
          inp.addEventListener('keydown', function(e){ e.stopPropagation(); });
        });
      },
      order:function(r, n){
        var w = [].map.call(r.querySelectorAll('.sl input'), function(i){ return +i.value; });
        var live = LINEUP.map(function(s, i){ return i; }).filter(function(i){ return n >= 3 || !LINEUP[i].cheat; });
        var score = function(i){ var s = LINEUP[i]; if(s.cheat && n >= 4) return -1; return s.s.reduce(function(a, v, k){ return a + v * w[k]; }, 0) + (s.cheat ? .5 : 0); };

        var inps = r.querySelectorAll('.sl input'), self = this;
        (n === 3 || n === 4 ? [3, 0, 0, 0] : [1, 1, 1, 1]).forEach(function(v, k){ inps[k].value = v; });
        var c = r.querySelector('.CAUGHT');
        c.style.display = n >= 4 ? 'inline-flex' : 'none';
        if(n === 4 && fwd){ self.order(r, 3); later(function(){ stampIn(c); }, 100); later(function(){ self.order(r, 4); }, 900); }
        else self.order(r, n);
      } },

    /* 24 */ { name:'The bribe', tab:'Exhibit P', steps:3,
      note:'Sponsored results are adverts: a company has paid to be at the top for that search. Step 1: the envelope (payment). Step 2: it jumps to number 1 with a Sponsored label. Step 3, the Year 6 question: who gains when this is first? Pizza Giant sells more pizza; the search company gets paid. Does the searcher gain? Usually not: the best answer is now further down. Ask them to point to the word Sponsored.',
      build:function(r){
        var res = [['teesvalleyfoodguide', 'The 10 best pizzas in Stockton', 'We ate 40 pizzas so you don’t have to.', 'top10'],
          ['mamarosas', 'Stone-baked pizza in Stockton', 'Family pizzeria since 1987. Book a table.', 'marg'],
          ['mrwhitespizzas', 'Best pizza in Stockton (says Mr White)', 'Pineapple, fish fingers and beans. You’re welcome.', 'mr'],
          ['sliceslicebaby', 'Pizza by the slice in Middlesbrough', 'Not Stockton, but quite close.', 'slice'],
          ['pizzagiant', 'Pizza Giant: 2 for 1 pizzas tonight', 'Order now. Delivery in 30 minutes.', 'pep', true]];
        r.innerHTML =
          '<div class="abs" style="left:80px;top:34px"><div class="kick">Exhibit P</div><h2 class="h2 tw" style="margin-top:6px">Paid to be first</h2></div>' +
          '<div class="sp" style="left:80px;top:150px;width:900px;height:560px;padding:22px 32px"><div class="sbar" style="font-size:26px;padding:8px 22px">' + MAG + '<span>best pizza in stockton</span></div>' +
            '<div style="position:relative;height:440px;margin-top:14px">' +
            res.map(function(x, i){ return '<div class="mv BR" data-i="' + i + '" style="left:0;right:0;top:' + i * 88 + 'px;padding:8px 0 10px;border-bottom:1.5px dashed #DDD5C6;background:#fff;display:flex;gap:18px;align-items:center">' + PIZ(x[3], 62) + '<div><div style="font-size:16px;color:#5C6B57">' + (x[4] ? '<span class="spon SP" style="display:none">SPONSORED</span>' : '') + x[0] + '</div><div style="font-size:24px;font-weight:700;color:var(--blue);text-decoration:underline;text-underline-offset:4px">' + x[1] + '</div><div style="font-size:18px;color:#4A4038">' + x[2] + '</div></div></div>'; }).join('') +
            '</div></div>' +
          '<div class="mv ENV" style="z-index:5;left:1500px;top:480px;width:250px;height:160px;transform:rotate(-8deg)">' +
            '<svg viewBox="0 0 250 160" width="250" height="160"><rect x="4" y="4" width="242" height="152" fill="#F4ECD8" stroke="#8C7A5E" stroke-width="4"/><path d="M4 4 125 92 246 4" fill="none" stroke="#8C7A5E" stroke-width="4"/></svg>' +
            '<span class="stamp manual" style="--r:10deg;position:absolute;left:66px;top:84px;font-size:30px;padding:4px 12px;background:rgba(244,236,216,.85)">Paid</span></div>' +
          '<div class="abs pp" data-s="3" style="left:1040px;top:160px;width:420px">' +
            '<div class="index" style="padding:80px 28px 24px;transform:rotate(1.5deg)"><span class="pin" style="left:46%;top:-10px"></span><div class="se" style="font-size:40px;line-height:1.15">Who gains when this is first?</div></div>' +
            '<div class="body" style="margin-top:26px;font-size:26px">Pizza Giant? The search company? <b>You?</b></div></div>';
      }, step:function(r, n, fwd){
        var env = r.querySelector('.ENV'), sp = r.querySelector('.SP');
        var order = n >= 2 ? [4, 0, 1, 2, 3] : [0, 1, 2, 3, 4];
        [].forEach.call(r.querySelectorAll('.BR'), function(el){ var i = +el.getAttribute('data-i'); el.style.top = order.indexOf(i) * 88 + 'px'; el.style.zIndex = i === 4 ? 2 : 1; });
        sp.style.display = n >= 2 ? 'inline-block' : 'none';
        if(n === 0){ env.style.left = '1560px'; env.style.top = '480px'; env.style.opacity = 1; }
        if(n === 1){ env.style.left = '760px'; env.style.top = '470px'; env.style.opacity = 1; if(fwd) later(function(){ thud(); }, 800); }
        if(n >= 2){ env.style.left = '760px'; env.style.top = '120px'; env.style.opacity = 0; }
      } },

    /* 25 */ { name:'Who pulls the strings?', tab:'Suspects', steps:3,
      note:'Three people influence every search. The searcher: their words, where they are (remember the map), what they searched before. The search company: its secret rules, and who has paid. The website maker: good matching words and links, or cheating. Ask which of the three they trust most.',
      build:function(r){
        var who = [[PAIR, 'The searcher', 'Your words. Where you are. What you searched before.'],
          [GLOBE, 'The search company', 'Its secret rules. Who has paid to be first.'],
          [PEN, 'The website maker', 'Good words and links. Or cheating.']];
        r.innerHTML = '<div class="abs" style="left:80px;top:40px"><div class="kick">Three suspects</div><h2 class="h2 tw" style="margin-top:6px">Who pulls the strings?</h2></div>' +
          who.map(function(w, i){
            return '<div class="abs pp" data-s="' + (i + 1) + '" style="left:' + (80 + i * 460) + 'px;top:180px;width:420px">' +
              '<div class="index" style="height:470px;padding:80px 30px 24px;transform:rotate(' + [-1.5, 1, -1][i] + 'deg);position:relative">' +
                '<span class="stamp ink" style="--r:-4deg;position:absolute;left:24px;top:12px;font-size:22px">Suspect ' + (i + 1) + '</span>' +
                '<div style="margin-top:14px">' + w[0].replace('width="64" height="64"', 'width="110" height="110"') + '</div>' +
                '<div class="se" style="font-size:40px;margin-top:10px">' + w[1] + '</div>' +
                '<div class="body" style="font-size:27px;margin-top:12px">' + w[2] + '</div></div></div>';
          }).join('');
      } },

    /* 26 */ { name:'Whiteflix HQ', tab:'Exhibit W', steps:1,
      note:'Next opens Whiteflix HQ, with three sliders deciding the Top 10. The laminator episode is Sponsored. Challenge: get it to number 1. Then ask what they had to change, and whether that is fair on the other programmes. Use the floating Next button to come back.',
      build:function(r){
        r.innerHTML = '<div class="abs" style="left:110px;top:110px;width:1100px"><div class="kick">Exhibit W</div><h1 class="h1 tw" style="margin-top:14px">Mr Whiteflix HQ</h1>' +
          '<p class="big" style="margin-top:34px">Three sliders decide the Top 10. <b>Mr White Explains the Laminator</b> is sponsored.</p>' +
          '<p class="big pp" data-s="1" style="margin-top:20px">Can you get it to number 1? What did you have to change?</p></div>' +
          '<span class="stamp abs" style="--r:-10deg;left:1110px;top:110px;font-size:40px;padding:12px 22px">Sponsored</span>';
      } },
    /* 27 */ { name:'Whiteflix HQ (open)', tab:'Exhibit W', frame:'whiteflix.html#hq', floatNav:true,
      note:'Whiteflix HQ. Use the floating Back and Next buttons in the corner.' },

    /* 28 */ video({ name:'How search works (Year 6)', tab:'Exhibit Y6', kick:'Exhibit Y6 · optional', title:'How search works', id:'LVV_93mBfSU', play:'Play the video (about 6 min)',
      note:'Optional, best for Year 6. Engineers from Google and Bing explain crawling and then ranking; the ranking part is in the second half. Skip if short of time.' }),

    /* 29 */ { name:'Case closed', tab:'Case file 02', steps:3,
      note:'Back to the search from the start and the whiteboard guesses. Step 1: the reasons, all from today. Step 2: CASE CLOSED. Step 3: Top Agents for the pair with the fewest words; tap the line and type their names.',
      build:function(r){
        var why = ['Its words match', 'Lots of sites link to it', 'People stay and read it', '…or someone paid'];
        r.innerHTML = hookPage(70, 70, 760) +
          '<div class="abs" style="left:900px;top:70px;width:560px"><div class="se" style="font-size:52px;line-height:1.1">Now: why is <span class="red">this</span> one first?</div>' +
            why.map(function(t, i){ return '<div class="pp" data-s="1" style="transition-delay:' + i * .15 + 's;margin-top:' + (i ? 12 : 30) + 'px;display:flex;gap:14px;align-items:center"><span class="pin" style="position:static;flex:none"></span><span class="body" style="font-size:28px">' + t + '</span></div>'; }).join('') +
          '</div>' +
          '<span class="stamp abs pp" data-s="2" style="--r:-12deg;left:120px;top:290px;font-size:86px;padding:16px 30px;background:rgba(255,255,255,.6)">Case closed</span>' +
          '<div class="abs pp" data-s="3" style="left:900px;top:470px;width:560px">' +
            '<div class="paper" style="padding:22px 28px;transform:rotate(-1deg);position:relative"><span class="stamp" style="--r:-6deg;font-size:30px">Top agents</span>' +
            '<div class="small" style="margin-top:12px;font-weight:700">Fewest words of the day:</div>' +
            '<div class="se TA" contenteditable="true" spellcheck="false" style="font-size:38px;border-bottom:2px dashed #CDBFA6;min-height:48px;outline:none;margin-top:6px"></div></div></div>';
        r.querySelector('.TA').addEventListener('click', function(e){ e.stopPropagation(); });
        r.querySelector('.TA').addEventListener('keydown', function(e){ e.stopPropagation(); if(e.key === 'Enter'){ e.preventDefault(); e.target.blur(); stage.focus({ preventScroll:true }); } });
      }, step:function(r){
        var p = r.querySelector('.HK'); p.style.strokeDasharray = 'none'; p.style.strokeDashoffset = 0;
      } },

    /* 30 */ { name:'Get into orbit', tab:'Debrief', steps:0,
      note:'Each pupil taps the rings: the closer to the centre, the surer they are about today’s three orders. Every tap stays as its own mark. Clear needs two taps.',
      build:function(r){
        var rings = [[300, '#E9DFC6'], [200, '#E2CFA2'], [100, '#D9B979']];
        r.innerHTML = '<div class="abs" style="left:80px;top:40px"><div class="kick">Debrief</div><h2 class="h2 tw" style="margin-top:6px">Get into orbit</h2>' +
            '<p class="body" style="margin-top:16px;width:560px">How sure are you that you can:</p>' +
            ['explain what an algorithm is?', 'find the search that gets an answer to the top?', 'explain why a result is first, and who gains?'].map(function(t, i){ return '<p class="body" style="margin:10px 0 0;width:560px;font-size:27px"><b>' + (i + 1) + '.</b> ' + t + '</p>'; }).join('') +
            '<div style="display:flex;gap:12px;margin-top:30px"><button type="button" class="tbtn UND">Undo</button><button type="button" class="tbtn CLR">Clear</button></div></div>' +
          '<div class="abs orbit" style="left:760px;top:40px;width:660px;height:660px"><svg viewBox="-330 -330 660 660" width="660" height="660">' +
            rings.map(function(g){ return '<circle r="' + g[0] + '" fill="' + g[1] + '" stroke="#8C7A5E" stroke-width="2"/>'; }).join('') +
            '<text y="-262" text-anchor="middle" font-family="Courier Prime" font-weight="700" font-size="22" fill="#5E4E3C">Drifting</text>' +
            '<text y="-162" text-anchor="middle" font-family="Courier Prime" font-weight="700" font-size="22" fill="#5E4E3C">In orbit</text>' +
            '<text y="8" text-anchor="middle" font-family="Special Elite" font-size="30" fill="#2B2118">Locked on</text><g class="MK"></g></svg></div>';
        var svg = r.querySelector('svg'), mk = r.querySelector('.MK'), clr = r.querySelector('.CLR'), armed = false;
        svg.addEventListener('click', function(e){
          e.stopPropagation();
          var b = svg.getBoundingClientRect(), x = (e.clientX - b.left) / b.width * 660 - 330, y = (e.clientY - b.top) / b.height * 660 - 330;
          if(Math.hypot(x, y) > 300) return;
          mk.insertAdjacentHTML('beforeend', '<circle cx="' + x + '" cy="' + y + '" r="13" fill="#A3221B" stroke="#FFFDF6" stroke-width="4"/>');
          thud();
        });
        r.querySelector('.UND').addEventListener('click', function(e){ e.stopPropagation(); if(mk.lastChild) mk.removeChild(mk.lastChild); });
        clr.addEventListener('click', function(e){
          e.stopPropagation();
          if(!armed){ armed = true; clr.textContent = 'Tap again to clear'; setTimeout(function(){ armed = false; clr.textContent = 'Clear'; }, 2500); return; }
          mk.innerHTML = ''; armed = false; clr.textContent = 'Clear';
        });
      } }
  ];

  /* ---------------- moving through the lesson ---------------- */
  var part = 0, step = 0;
  var dots = document.getElementById('parts'), tab = document.getElementById('tab'), notes = document.getElementById('notes'), nbtn = document.getElementById('nbtn');
  PARTS.forEach(function(p, i){
    var d = document.createElement('button'); d.className = 'part'; d.type = 'button'; d.title = p.name;
    d.setAttribute('aria-label', 'Go to ' + p.name);
    d.addEventListener('click', function(e){ e.stopPropagation(); show(i, 0); });
    dots.appendChild(d);
  });
  var notesOn = false;
  function paintNotes(){
    var p = PARTS[part];
    notes.innerHTML = '<b>' + esc(p.name) + '</b>' + esc(p.note || '');
    notes.classList.toggle('on', notesOn);
    nbtn.setAttribute('aria-pressed', notesOn ? 'true' : 'false');
  }
  nbtn.addEventListener('click', function(e){ e.stopPropagation(); notesOn = !notesOn; paintNotes(); stage.focus({ preventScroll:true }); });

  function paint(r, n, fwd){
    [].forEach.call(r.querySelectorAll('.pp'), function(el){
      var s = +el.getAttribute('data-s'), only = el.hasAttribute('data-only');
      var on = only ? (s === n) : (s <= n), was = !el.classList.contains('hide');
      el.classList.toggle('hide', !on);
      if(on && !was){ if(fwd && s === n) effects(el); else settle(el); }
    });
    var p = PARTS[part];
    if(p.step) p.step(r, n, fwd);
  }

  function show(i, at){
    clearTimers(); stopTape();
    part = Math.max(0, Math.min(PARTS.length - 1, i));
    var p = PARTS[part];
    [].forEach.call(dots.children, function(d, k){ d.classList.toggle('on', k === part); d.classList.toggle('done', k < part); });
    paintNotes();
    if(p.frame){
      fit.classList.add('off');
      frame.classList.add('on');
      fnav.classList.toggle('on', !!p.floatNav);
      frame.onload = function(){ try{ frame.contentWindow.focus(); }catch(e){} };
      frame.src = p.frame;
      return;
    }
    frame.classList.remove('on'); frame.removeAttribute('src'); fnav.classList.remove('on');
    fit.classList.remove('off');
    tab.textContent = p.tab || 'Case file 02';
    step = at === 'end' ? p.steps : 0;
    host.innerHTML = '';
    var r = document.createElement('div'); r.className = 'scene' + (RM ? '' : ' enter');
    host.appendChild(r);
    p.build.call(p, r);
    [].forEach.call(r.querySelectorAll('.pp'), function(el){ el.classList.add('hide'); });
    r.getBoundingClientRect();
    if(at === 'end'){ paint(r, step, false); settle(r); }
    else {
      [].forEach.call(r.querySelectorAll('.tw'), function(t){ if(!t.closest('.pp')) typeOut(t); });
      [].filter.call(r.querySelectorAll('.stamp'), function(t){ return !t.closest('.pp') && !t.classList.contains('manual'); }).forEach(function(t, k){ stampIn(t, 250 + k * 260); });
      paint(r, 0, true);
    }
    document.getElementById('back').disabled = part === 0 && step === 0;
    document.getElementById('next').disabled = part === PARTS.length - 1 && step === p.steps;
    setTimeout(function(){ try{ frame.blur(); }catch(e){} stage.focus({ preventScroll:true }); }, 30);
  }

  function next(){
    var p = PARTS[part];
    if(!p.frame && step < p.steps){
      step++;
      paint(host.firstChild, step, true);
      document.getElementById('back').disabled = false;
      document.getElementById('next').disabled = part === PARTS.length - 1 && step === p.steps;
      return;
    }
    if(part < PARTS.length - 1) show(part + 1, 0);
  }
  function back(){
    var p = PARTS[part];
    if(!p.frame && step > 0){
      clearTimers();
      step--;
      paint(host.firstChild, step, false);
      document.getElementById('back').disabled = part === 0 && step === 0;
      document.getElementById('next').disabled = false;
      return;
    }
    if(part > 0) show(part - 1, 'end');
  }

  document.getElementById('next').addEventListener('click', function(e){ e.stopPropagation(); next(); });
  document.getElementById('back').addEventListener('click', function(e){ e.stopPropagation(); back(); });
  document.getElementById('fnext').addEventListener('click', next);
  document.getElementById('fback').addEventListener('click', back);
  document.getElementById('home').addEventListener('click', function(e){ e.stopPropagation(); });
  host.addEventListener('click', function(e){
    if(e.target.closest('a,button,input,label,[contenteditable],.ecard,.rcard,.orbit')) return;
    next();
  });
  addEventListener('keydown', function(e){
    if(e.target && e.target.isContentEditable) return;
    if(['ArrowRight','PageDown',' ','Enter'].indexOf(e.key) > -1){ e.preventDefault(); next(); }
    else if(['ArrowLeft','PageUp'].indexOf(e.key) > -1){ e.preventDefault(); back(); }
    else if(e.key === 'n' || e.key === 'N'){ notesOn = !notesOn; paintNotes(); }
  });

  function fromHash(){ var m = /^#part(\d+)$/.exec(location.hash); return m ? +m[1] - 1 : 0; }
  addEventListener('hashchange', function(){ show(fromHash(), 0); });
  show(fromHash(), 0);
})();
</script>
