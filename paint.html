<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hartburn Paint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
  :root{
    --wall:#F4EFE4; --card:#FFFFFF; --edge:#E4DCCB; --ink:#1B2540; --muted:#4C5568;
    --sun:#F5B82E; --sun-soft:#FDEFC8; --good:#0E7D55; --good-soft:#D3F1E3; --bad:#B23A26;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--wall);color:var(--ink);font-family:Andika,system-ui,-apple-system,"Segoe UI",sans-serif;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  svg.i{width:1em;height:1em;fill:currentColor;flex:none}
  button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}

  .app{position:fixed;inset:0;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto 1fr auto;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));gap:10px}

  /* top bar */
  .bar{grid-column:1 / 3;display:flex;align-items:center;gap:10px;min-height:58px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;margin-right:auto}
  .brand .dot{width:36px;height:36px;border-radius:10px;background:var(--sun);display:grid;place-items:center;font-size:22px;color:var(--ink)}
  .act{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;padding:8px 18px;border-radius:14px;background:var(--card);border:2px solid var(--edge);min-height:54px}
  .act .i{font-size:26px}
  .act.send{background:var(--sun);border-color:var(--sun);color:var(--ink)}
  .act[hidden]{display:none}
  .task{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:6px 18px;border-radius:14px;background:var(--sun-soft);border:2px solid var(--sun);min-height:58px}
  .task[hidden]{display:none}
  .task .tl{font-size:16px;font-weight:700;color:var(--muted)}
  .task b{font-size:24px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .room .brand{margin-right:0} .room .brand span.t{display:none}

  /* tools */
  .bar{grid-row:1} .tour{grid-row:2}
  .board{grid-column:2;grid-row:3} .pal{grid-column:2;grid-row:4}
  .tools{grid-column:1;grid-row:3 / 5;display:flex;flex-direction:column;gap:8px;overflow:auto}
  .tool{width:96px;min-height:84px;border-radius:18px;background:var(--card);border:3px solid var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;font-size:15px;font-weight:700}
  .tool .i{font-size:36px}
  .tool.on{background:var(--sun-soft);border-color:var(--sun);box-shadow:inset 0 0 0 2px var(--sun)}
  .tool.undo{margin-top:auto;border-style:dashed}
  .tool:disabled{opacity:.35}

  /* canvas */
  .board{position:relative;display:grid;place-items:center;min-width:0;min-height:0}
  canvas{display:block;background:#fff;border-radius:6px;box-shadow:0 0 0 2px var(--edge),0 18px 40px -24px rgba(27,37,64,.45);touch-action:none}

  /* palette */
  .pal{display:flex;align-items:center;justify-content:center;gap:12px;min-height:72px}
  .sw{width:62px;height:62px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--edge);padding:0}
  .sw.on{box-shadow:0 0 0 4px var(--ink);transform:scale(1.08)}

  /* sheets */
  .sheet{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(27,37,64,.45);padding:20px}
  .sheet.on{display:flex}
  .panel{width:min(820px,100%);max-height:100%;overflow:auto;background:var(--card);border-radius:24px;padding:28px 30px;box-shadow:0 30px 70px -30px rgba(0,0,0,.6)}
  .panel h2{margin:0 0 6px;font-size:34px;font-weight:800}
  .panel p{margin:0 0 18px;font-size:20px;line-height:1.4;color:var(--muted)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{font-size:20px;font-weight:700;padding:14px 20px;border-radius:14px;background:var(--wall);border:2px solid var(--edge);display:inline-flex;align-items:center;gap:10px}
  .btn.main{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.small{font-size:16px;padding:10px 14px}

  /* guided tour */
  .tour{grid-column:1 / 3;display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:20px;background:var(--card);border:3px solid var(--sun);min-height:96px}
  .tour[hidden]{display:none}
  .tour .guide{width:64px;height:64px;flex:none;border-radius:18px;background:var(--sun);display:grid;place-items:center;font-size:38px}
  .tour p{flex:1;margin:0;font-size:28px;line-height:1.25;font-weight:700}
  .tour .tbs{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .tbtn{font-size:22px;font-weight:700;padding:14px 20px;border-radius:14px;background:var(--wall);border:2px solid var(--edge)}
  .tbtn.main{background:var(--ink);border-color:var(--ink);color:#fff}
  .tctl{display:flex;flex-direction:column;gap:6px}
  .tctl button{width:46px;height:40px;border-radius:10px;border:2px solid var(--edge);background:var(--wall);display:grid;place-items:center;font-size:22px;padding:0}
  .touring .bar{display:none}
  .touring .tools,.touring .pal,.touring canvas{pointer-events:none}
  .touring .glow{pointer-events:auto}
  .glow{position:relative;z-index:5;animation:glow 1.1s ease-in-out infinite;border-color:var(--sun)!important;background:var(--sun-soft)!important}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(245,184,46,.9);transform:scale(1)}50%{box-shadow:0 0 0 14px rgba(245,184,46,0);transform:scale(1.07)}}
  .hand{position:fixed;left:0;top:0;z-index:40;font-size:72px;color:var(--ink);pointer-events:none;opacity:0;transition:opacity .25s;margin:-6px 0 0 -26px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
  .hand.on{opacity:1}
  .hand.press .i{transform:scale(.86)}
  .show-me{font-size:18px}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.3s;background:var(--ink);color:#fff;font-size:20px;font-weight:700;padding:14px 22px;border-radius:14px;z-index:30;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%)}

  @media (max-width:900px){ .tool{width:80px;min-height:72px;font-size:13px} .tool .i{font-size:30px} .sw{width:50px;height:50px} .brand span.t{display:none} }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand"><span class="dot" data-ph="paint-brush"></span><span class="t">Hartburn Paint</span></div>
    <div class="task" id="task" hidden><span class="tl">Your task</span><b id="taskText">Waiting for your teacher</b></div>
    <button class="act show-me" type="button" id="showMe"><span data-ph="lightbulb"></span>Show me</button>
    <button class="act" type="button" id="newPic"><span data-ph="flower"></span>New picture</button>
    <button class="act send" type="button" id="send" hidden><span data-ph="paper-plane-right"></span>Send to the board</button>
  </div>
  <div class="tour" id="tour" hidden>
    <span class="guide" data-ph="paint-brush"></span>
    <p id="tourText"></p>
    <div class="tbs" id="tourBtns"></div>
    <div class="tctl"><button type="button" id="tourVoice"></button><button type="button" id="tourAgain" aria-label="Say it again" data-ph="arrow-counter-clockwise"></button><button type="button" id="tourStop" aria-label="Stop the tour" data-ph="x"></button></div>
  </div>
  <div class="tools" id="tools"></div>
  <div class="board" id="board"><canvas id="cv" width="1200" height="800"></canvas></div>
  <div class="pal" id="pal"></div>
</div>

<!-- new picture -->
<div class="sheet" id="newSheet"><div class="panel">
  <h2>Start a new picture?</h2>
  <p>This picture will go. Undo can&rsquo;t bring it back.</p>
  <div class="row"><button class="btn main" type="button" id="newYes">Start a new one</button><button class="btn" type="button" id="newNo">Keep this one</button></div>
</div></div>

<div class="toast" id="toast"></div>
<div class="hand" id="hand" data-ph="hand-pointing-fill"></div>

    var SB_URL = 'https://bbmzmlkcabcweywpuewx.supabase.co', SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJibXptbGtjYWJjd2V5d3B1ZXd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MTExNDYsImV4cCI6MjEwOTE4NzE0Nn0.QhO-Auzuw5DtK8uwmGnRh0BSvnrh1yPhqJc01cDNwjw';
    // every request gives up after 5 seconds, so one stuck request on the school Wi-Fi can't freeze the checks
    function rpc(name, args){
      var ctl = window.AbortController ? new AbortController() : null, t = ctl ? setTimeout(function(){ ctl.abort(); }, 5000) : 0;
      return fetch(SB_URL + '/rest/v1/rpc/' + name, { method:'POST', cache:'no-store', signal:ctl ? ctl.signal : undefined, headers:{ 'Content-Type':'application/json', apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY }, body:JSON.stringify(args) })
        .then(function(r){ clearTimeout(t); if(!r.ok) throw new Error(r.status); return r.json(); }, function(e){ clearTimeout(t); throw e; });
    }
    document.querySelector('.app').classList.add('room');
    $('task').hidden = false; $('send').hidden = false;
    var sendBtn = $('send'), sendLabel = sendBtn.lastChild;
    var pid; try{ pid = sessionStorage.getItem('hbpaint:pid'); if(!pid){ pid = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem('hbpaint:pid', pid); } }catch(e){ pid = 'p' + Math.random(); }
    var round = 0, active = false, busy = false;
    // one picture per task: remembered on the iPad, so reloading doesn't allow a second go
    function sentKey(){ return 'sent:' + ROOM + ':' + round; }
    function showSend(){
      var done = !!(round && store(sentKey()));
      sendBtn.disabled = done; sendLabel.textContent = done ? 'Sent' : 'Send to the board';
    }
    // ask only for the task and its number, never the pictures: that keeps each check tiny
    var lite = true;
    function poll(){
      if(busy || document.hidden) return; busy = true;
      rpc(lite ? 'live_get_room?select=question,round&limit=1' : 'live_get_room', { p_code:ROOM }).then(function(rows){
        var r = rows && rows[0];
        if(!r || r.question === ENDED){
          active = false; $('taskText').textContent = 'Waiting for your teacher';
          // nobody has set the class code up yet: do it from here, with the first task, so the iPads never wait on the board
          if(ROOM === CODE) return rpc('live_set_question', { p_code:CODE, p_token:TOKEN, p_question:'Draw a circle' }).then(function(){ busy = false; poll(); });
          return;
        }
        if(!active){ active = true; rpc('live_mark_joined', { p_code:ROOM, p_pupil_id:pid }).catch(function(){}); }
        $('taskText').textContent = r.question || 'Paint anything you like';
        if(round && r.round !== round){ toast('New task: ' + (r.question || 'paint anything')); open('newSheet'); }
        round = r.round; showSend();
      }).catch(function(err){
        if(lite && /^4/.test(err && err.message)){ lite = false; return; }   // older database: fall back to the full check
        $('taskText').textContent = 'Can’t reach the board. Keep painting.';
      }).then(function(){ busy = false; });
    }
    setInterval(poll, 3000); poll();
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) poll(); });
    sendBtn.addEventListener('click', function(){
      if(!active || !round){ toast('The board isn’t ready yet'); return; }
      if(store(sentKey())){ showSend(); toast('You’ve sent this one'); return; }
      var small = document.createElement('canvas'); small.width = 360; small.height = 240;
      var sx = small.getContext('2d'); sx.fillStyle = '#fff'; sx.fillRect(0, 0, 360, 240); sx.drawImage(cv, 0, 0, 360, 240);
      var forRound = round;
      sendBtn.disabled = true; sendLabel.textContent = 'Sending';
      rpc('live_submit_answer', { p_code:ROOM, p_kind:'drawing', p_content:small.toDataURL('image/jpeg', .72) })
        .then(function(id){
          if(id){ store('sent:' + ROOM + ':' + forRound, '1'); toast('Sent to the board'); }
          else toast('That task has finished');
        })
        .catch(function(){ toast('Didn’t send. Try again.'); })
        .then(showSend);
    });
  }
  var toastTimer;
  function toast(t){ var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 2400); }
  // for the lesson deck: paint.html?mode=l1&board opens straight to the canvas with no name picker
  /* ---------- guided tour: paint.html?mode=l1&board&tour, or the "Show me" button ----------
     A tool glows, a child taps it on the board, the bubble says what it does,
     and a hand paints with it. By the end the tour has painted a garden. */
  var touring = false, TOUR_VOICE = 'tourVoice';
  var tourEl = $('tour'), tourText = $('tourText'), tourBtns = $('tourBtns'), hand = $('hand');
  var voiceOn = store(TOUR_VOICE) !== 'off';
  function voiceIcon(){ $('tourVoice').innerHTML = ph(voiceOn ? 'speaker-high' : 'speaker-slash'); $('tourVoice').setAttribute('aria-label', voiceOn ? 'Reading aloud: on' : 'Reading aloud: off'); }
  var lastSaid = '';
  function speak(t){
    if(!voiceOn || !window.speechSynthesis) return;
    try{
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t.replace(/’/g, "'"));
      var v = speechSynthesis.getVoices().filter(function(v){ return /en-GB/i.test(v.lang); })[0];
      if(v) u.voice = v;
      u.lang = 'en-GB'; u.rate = .92;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  /* recorded voice: audio/tour-NN.mp3, one clip per line. Each line waits for the one before it
     to finish, so nothing gets cut off. If a clip can't play, the board's own voice reads it instead. */
  var clips = {}, current = null, lastN = 0, speechDone = Promise.resolve(), finishSpeech = function(){};
  function clip(n){
    if(!clips[n]){ var a = new Audio('audio/tour-' + ('0' + n).slice(-2) + '.mp3'); a.preload = 'auto'; clips[n] = a; }
    return clips[n];
  }
  function preloadClips(){ for(var n = 1; n <= 19; n++) clip(n); }
  function stopSpeech(){
    if(current){ current.pause(); current.onended = current.onerror = null; }
    if(window.speechSynthesis) speechSynthesis.cancel();
    finishSpeech();
  }
  function playLine(n, t){
    return new Promise(function(done){
      var finished = false;
      function end(){ if(finished) return; finished = true; done(); }
      finishSpeech = end;
      if(!voiceOn){ end(); return; }
      var a = clip(n); current = a;
      function fallback(){ speak(t); setTimeout(end, Math.max(900, t.replace(/[^A-Za-z]/g, '').length * 85)); }
      a.onended = end;
      a.onerror = function(){ a.onerror = null; fallback(); };
      try{ a.currentTime = 0; }catch(e){}
      var pr = a.play();
      // the browser blocks sound until someone has tapped the page: show the words and move on
      if(pr && pr.catch) pr.catch(function(err){ if(err && err.name === 'NotAllowedError') end(); else fallback(); });
    });
  }
  async function say(n, t, id){
    await speechDone;
    if(id !== undefined) alive(id);
    lastSaid = t; lastN = n; tourText.textContent = t;
    speechDone = playLine(n, t);
  }
  function sayAgain(){ if(!lastN) return; stopSpeech(); speechDone = playLine(lastN, lastSaid); }
  $('tourVoice').addEventListener('click', function(){ voiceOn = !voiceOn; store(TOUR_VOICE, voiceOn ? 'on' : 'off'); voiceIcon(); if(voiceOn) sayAgain(); else stopSpeech(); });
  $('tourAgain').addEventListener('click', sayAgain);
  voiceIcon();

  var tourRun = 0;                       // bumps when the tour is stopped, so a running step gives up
  function alive(id){ if(id !== tourRun) throw 'stopped'; }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, RM ? Math.min(ms, 60) : ms); }); }
  function frame(){ return new Promise(function(r){ requestAnimationFrame(r); }); }
  var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // wait for a child to tap the glowing button
  function tapOn(el, id){
    return new Promise(function(res, rej){
      el.classList.add('glow');
      function go(){ el.removeEventListener('click', go); el.classList.remove('glow'); if(id !== tourRun) rej('stopped'); else res(); }
      el.addEventListener('click', go);
      el.__stop = function(){ el.removeEventListener('click', go); el.classList.remove('glow'); rej('stopped'); };
    });
  }
  function buttons(list){
    return new Promise(function(res){
      tourBtns.innerHTML = '';
      list.forEach(function(b, i){
        var e = document.createElement('button'); e.type = 'button'; e.className = 'tbtn' + (i === 0 ? ' main' : ''); e.textContent = b;
        e.addEventListener('click', function(){ tourBtns.innerHTML = ''; res(i); });
        tourBtns.appendChild(e);
      });
    });
  }

  // the hand: screen positions, in step with the canvas
  function toScreen(p){ var r = cv.getBoundingClientRect(); return [r.left + p[0] * r.width / W, r.top + p[1] * r.height / H]; }
  var handAt = [innerWidth / 2, innerHeight];
  function placeHand(s){ handAt = s; hand.style.transform = 'translate(' + s[0] + 'px,' + s[1] + 'px)'; }
  async function moveHand(s, ms, id){
    var a = handAt.slice(), t0 = performance.now(); ms = RM ? 0 : ms;
    hand.classList.add('on');
    while(true){
      alive(id);
      var t = ms ? Math.min(1, (performance.now() - t0) / ms) : 1, e = 1 - Math.pow(1 - t, 3);
      placeHand([a[0] + (s[0] - a[0]) * e, a[1] + (s[1] - a[1]) * e]);
      if(t >= 1) break;
      await frame();
    }
  }
  function centre(el){ var r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
  async function handTap(el, id){ await moveHand(centre(el), 650, id); hand.classList.add('press'); await wait(180); hand.classList.remove('press'); el.click(); await wait(250); }

  // paint along a path with the current tool, as a stroke the undo list knows about
  async function paintPath(pts, ms, id){
    var segs = [], total = 0;
    for(var i = 1; i < pts.length; i++){ var d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(d); total += d; }
    await moveHand(toScreen(pts[0]), 600, id);
    snap();
    var w = SIZE[tool], c = tool === 'rubber' ? '#ffffff' : colour, last = pts[0], t0 = performance.now();
    line(last, [last[0] + .01, last[1]], w, c);
    while(true){
      alive(id);
      var t = RM ? 1 : Math.min(1, (performance.now() - t0) / ms), want = t * total, k = 0, acc = 0;
      while(k < segs.length - 1 && acc + segs[k] < want){ acc += segs[k]; k++; }
      var f = segs[k] ? (want - acc) / segs[k] : 1, p = [pts[k][0] + (pts[k + 1][0] - pts[k][0]) * f, pts[k][1] + (pts[k + 1][1] - pts[k][1]) * f];
      // draw through any corners passed since the last frame
      var j = 0, a2 = 0; while(j < k){ a2 += segs[j]; j++; }
      line(last, p, w, c); last = p;
      placeHand(toScreen(p));
      if(t >= 1) break;
      await frame();
    }
    record({ t:tool, c:c, w:w, pts:pts });
  }
  // pts given with every corner, so drawing each corner on the way keeps lines straight
  async function paintPoly(pts, ms, id){
    var dense = [];
    for(var i = 1; i < pts.length; i++){ for(var s = 0; s < 1; s += .05) dense.push([pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * s, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * s]); }
    dense.push(pts[pts.length - 1]);
    await paintPath(dense, ms, id);
  }
  async function sprayHold(p, ms, id){
    await moveHand(toScreen(p), 600, id);
    snap();
    var dots = [], t0 = performance.now(), last = 0;
    while(performance.now() - t0 < (RM ? 1 : ms)){
      alive(id);
      var t = (performance.now() - t0) / ms, q = [p[0] + Math.cos(t * 9) * 26, p[1] + Math.sin(t * 9) * 26];
      if(performance.now() - last > 30){ sprayAt(q, colour, dots); last = performance.now(); }
      placeHand(toScreen(q));
      await frame();
    }
    if(RM) for(var n = 0; n < 40; n++) sprayAt(p, colour, dots);
    record({ t:'spray', c:colour, dots:dots });
  }
  // fill, poured out slowly so the class can watch it spread through a gap
  async function pour(p, id){
    await moveHand(toScreen(p), 600, id);
    hand.classList.add('press'); await wait(180); hand.classList.remove('press');
    var x0 = Math.round(p[0]), y0 = Math.round(p[1]);
    var img = cx.getImageData(0, 0, W, H), d = img.data, i0 = (y0 * W + x0) * 4, tr = d[i0], tg = d[i0 + 1], tb = d[i0 + 2];
    var rgb = hexRGB(colour), seen = new Uint8Array(W * H), order = new Int32Array(W * H), head = 0, tail = 0;
    function ok(q){ var k = q * 4; return !seen[q] && Math.abs(d[k] - tr) + Math.abs(d[k + 1] - tg) + Math.abs(d[k + 2] - tb) <= 110; }
    var s0 = y0 * W + x0; seen[s0] = 1; order[tail++] = s0;
    while(head < tail){
      var q = order[head++], x = q % W;
      if(x > 0 && ok(q - 1)){ seen[q - 1] = 1; order[tail++] = q - 1; }
      if(x < W - 1 && ok(q + 1)){ seen[q + 1] = 1; order[tail++] = q + 1; }
      if(q >= W && ok(q - W)){ seen[q - W] = 1; order[tail++] = q - W; }
      if(q < W * (H - 1) && ok(q + W)){ seen[q + W] = 1; order[tail++] = q + W; }
    }
    history.push(cx.getImageData(0, 0, W, H)); if(history.length > LIMIT) history.shift(); undoBtn.disabled = false;
    var i = 0, step = Math.max(4000, Math.ceil(tail / 75));
    while(i < tail){
      alive(id);
      var end = RM ? tail : Math.min(tail, i + step);
      for(; i < end; i++){ var k = order[i] * 4; d[k] = rgb[0]; d[k + 1] = rgb[1]; d[k + 2] = rgb[2]; d[k + 3] = 255; }
      cx.putImageData(img, 0, 0);
      await frame();
    }
    record({ t:'fill', x:x0, y:y0, c:colour });
  }
  function btn(t){ return toolsEl.querySelector('[data-t="' + t + '"]'); }
  function sw(c){ return palEl.querySelector('[data-c="' + c + '"]'); }

  // the garden the tour paints
  var HOUSE = [[560, 380], [560, 600], [300, 600], [300, 380], [430, 262], [508, 333]];
  var GAP = [[508, 333], [560, 380]];
  var DOOR = [[400, 600], [400, 515], [460, 515], [460, 600]];
  function grassRow(y, ph){ var p = []; for(var x = 20; x <= 1180; x += 20) p.push([x, y + Math.sin(x / 70 + ph) * 8]); return p; }
  var PATH = [[430, 602], [440, 650], [410, 700], [450, 750], [430, 798]];

  async function tour(){
    var id = ++tourRun;
    touring = true; document.body.classList.add('touring'); tourEl.hidden = false; fit(); await frame(); fit();
    fresh(); setTool('pencil'); setColour('black'); preloadClips(); speechDone = Promise.resolve();
    try{
      await say(1, 'Let’s meet the paint tools. When a button glows, come and tap it.', id);
      await buttons(['Let’s go']); alive(id);

      await say(2, 'Tap the pencil.', id); await tapOn(btn('pencil'), id);
      await say(3, 'The pencil draws thin lines. I’ll draw a house.', id);
      await wait(600); await paintPoly(HOUSE, 3200, id); await paintPoly(DOOR, 1200, id);

      await say(4, 'Tap the brush.', id); await tapOn(btn('brush'), id);
      await say(5, 'The brush paints thick lines. Here’s some grass.', id);
      await handTap(sw('green'), id);
      await paintPath(grassRow(650, 0), 1500, id); await paintPath(grassRow(700, 1.5).reverse(), 1500, id); await paintPath(grassRow(750, 3), 1500, id);

      await say(6, 'Tap the spray.', id); await tapOn(btn('spray'), id);
      await say(7, 'The spray makes lots of dots. If I hold still, I get more.', id);
      await handTap(sw('yellow'), id);
      await sprayHold([980, 150], 2600, id);

      await say(8, 'Tap the fill.', id); await tapOn(btn('fill'), id);
      await handTap(sw('red'), id);
      await say(9, 'Fill colours a whole space in one tap. But look: my house has a gap in the roof. What will happen if I fill it?', id);
      await buttons(['Only the house goes red', 'Red all over the page']); alive(id);
      await pour([430, 470], id);
      await say(10, 'Oh no. The paint leaked out through the gap. Tap undo to take it back.', id);
      await tapOn(undoBtn, id);
      await say(11, 'Undo took it back. I’ll close the gap with the pencil.', id);
      await handTap(btn('pencil'), id); await handTap(sw('black'), id);
      await paintPoly(GAP, 900, id);
      await say(12, 'Now tap the fill again.', id); await tapOn(btn('fill'), id);
      await handTap(sw('red'), id);
      await pour([430, 470], id);
      await say(13, 'No gap, no leak. Just the house.', id);
      await wait(1800);

      await say(14, 'Tap the rubber.', id); await tapOn(btn('rubber'), id);
      await say(15, 'The rubber paints white. Watch the grass.', id);
      await paintPath(PATH, 1800, id);
      await say(16, 'It made a white path. The rubber didn’t take the green away. It painted white on top.', id);
      await wait(2200);

      await say(17, 'Tap undo.', id); await tapOn(undoBtn, id);
      await say(18, 'The path has gone. Undo takes back the last thing you did, one step at a time.', id);
      hand.classList.remove('on');
      await buttons(['Finish']); alive(id);

      await say(19, 'Now it’s your turn. Use every tool to paint a garden.', id);
      await buttons(['Start painting']);
    }catch(e){ if(e !== 'stopped') throw e; }
    endTour(id);
  }
  function endTour(id){
    if(id !== undefined && id !== tourRun) return;
    tourRun++; touring = false;
    document.body.classList.remove('touring'); tourEl.hidden = true; hand.classList.remove('on'); requestAnimationFrame(fit);
    [].forEach.call(document.querySelectorAll('.glow'), function(e){ if(e.__stop) e.__stop(); });
    stopSpeech(); speechDone = Promise.resolve();
  }
  $('tourStop').addEventListener('click', function(){ endTour(); });
  $('showMe').addEventListener('click', function(){ tour(); });
  if(q.has('tour')) setTimeout(tour, 300);

  window.HBPAINT = { floodFill:floodFill, undo:undo, counts:function(){ return counts; } };
})();
</script>
