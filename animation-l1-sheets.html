<style>
  @page{size:A4 portrait;margin:10mm}

  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Lexend,'Segoe UI',Arial,sans-serif}
  svg.i{width:1em;height:1em;fill:currentColor;flex:none;vertical-align:-.12em}
  .bar{max-width:210mm;margin:16px auto 0;display:flex;gap:10px;padding:0 4px}
  .bar a,.bar button{font:inherit;font-weight:600;font-size:16px;color:var(--ink);background:#fff;border:2px solid #E2D8C6;border-radius:10px;padding:9px 16px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px}

  .page{width:210mm;min-height:297mm;margin:12px auto 30px;background:#fff;padding:12mm 13mm;display:flex;flex-direction:column;gap:6mm;break-after:page;box-shadow:0 10px 30px -18px rgba(27,37,64,.45)}

  @media print{ html,body{background:#fff} .bar{display:none} .page{margin:0;width:auto;min-height:0;height:276mm;padding:0;box-shadow:none} }

  .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:5mm;border-bottom:.6mm solid var(--ink);padding-bottom:3mm}
  .hd h1{margin:0;font-size:22pt;font-weight:800;line-height:1.1}
  .hd .tag{font-weight:700;font-size:10pt;background:var(--ink);color:#fff;border-radius:2mm;padding:1.5mm 3mm;white-space:nowrap}
  .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:2.5mm}
  .st{border:.4mm solid var(--ink);border-radius:2.5mm;padding:2mm 2.5mm;font-size:10pt;line-height:1.25;font-weight:600;display:flex;gap:2mm;align-items:flex-start}
  .st b{flex:none;width:6mm;height:6mm;border-radius:50%;background:var(--ink);color:#fff;font-size:9pt;display:grid;place-items:center}
  .pair{flex:1;display:flex;flex-direction:column;gap:2mm;min-height:0}
  .pair h2{margin:0;font-size:13pt;font-weight:800}
  .pair h2 span{font-weight:400;color:var(--mut);font-size:11pt}
  .discs{flex:1;display:flex;justify-content:space-around;align-items:center}
  .disc{display:flex;flex-direction:column;align-items:center;gap:1.5mm}
  .disc svg{width:82mm;height:82mm;display:block}
  .disc small{font-size:10pt;font-weight:600;color:var(--mut)}
</style>

  }
  var ART = {

            '<circle cx="100" cy="68" r="12" fill="#fff"/></g>',

    helmet: '<g ' + K + '><path d="M62 108 C62 62 138 62 138 108"/><path d="M60 100 H140"/>' +

  // the cut line, and a small arrow at the top so both circles are stuck the right way up
  function disc(art, label, blank){
    return '<div class="disc"><svg viewBox="0 0 200 200" aria-hidden="true">' +
      '<circle cx="100" cy="100" r="97" fill="#fff" stroke="#1B2540" stroke-width="1.6"/>' +
      '<path d="M100 8 L94 17 H106 Z" fill="#9aa1ae"/>' +

      (art || '') + '</svg><small>' + label + '</small></div>';
  }
  var STEPS = '<div class="steps">' +
    ['Colour in both pictures.', 'Cut out both circles on the line.', 'Tape a straw to the back of one circle.', 'Glue the other on top. Both arrows point up.', 'Roll the straw fast between your hands.']
      .map(function(t, i){ return '<div class="st"><b>' + (i + 1) + '</b>' + t + '</div>'; }).join('') + '</div>';
  function pair(title, a, b, la, lb, blank){
    return '<div class="pair"><h2>' + title + '</h2><div class="discs">' + disc(ART[a], la, blank) + disc(ART[b], lb, blank) + '</div></div>';
  }

  }).join('');
  [].forEach.call(document.querySelectorAll('[data-ph]'), function(e){ e.insertAdjacentHTML('afterbegin', ph(e.getAttribute('data-ph'))); });
