<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flipbook Pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap">
<style>
  @page{size:A4 portrait;margin:10mm}
  :root{--ink:#1B2540;--mut:#4C5568;--line:#9aa1ae;--paper:#F6F1E7;--blue:#2F5FD0}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Lexend,'Segoe UI',Arial,sans-serif}
  svg.i{width:1em;height:1em;fill:currentColor;flex:none;vertical-align:-.12em}
  .bar{max-width:210mm;margin:16px auto 0;display:flex;gap:10px;padding:0 4px;flex-wrap:wrap}
  .bar a,.bar button{font:inherit;font-weight:600;font-size:16px;color:var(--ink);background:#fff;border:2px solid #E2D8C6;border-radius:10px;padding:9px 16px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .bar .go{background:var(--ink);border-color:var(--ink);color:#fff}
  .bar .sp{margin-left:auto}
  .page{width:210mm;height:297mm;margin:12px auto 30px;background:#fff;padding:10mm 10mm;display:flex;flex-direction:column;gap:4mm;break-after:page;box-shadow:0 10px 30px -18px rgba(27,37,64,.45)}
  .page:last-child{break-after:auto}
  @media print{
    html,body{background:#fff} .bar{display:none}
    .page{margin:0;width:auto;height:276mm;padding:0;box-shadow:none}
    body.only-ball .page.blank, body.only-blank .page.ball{display:none}
  }
  .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:5mm;border-bottom:.6mm solid var(--ink);padding-bottom:2.5mm}
  .hd h1{margin:0;font-size:18pt;font-weight:800;line-height:1.1}
  .hd p{margin:1mm 0 0;font-size:9.5pt;color:var(--mut);line-height:1.35}
  .hd .tag{font-weight:700;font-size:9.5pt;background:var(--ink);color:#fff;border-radius:2mm;padding:1.5mm 3mm;white-space:nowrap}
  .grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);border-top:.35mm dashed var(--line);border-left:.35mm dashed var(--line)}
  .pg{position:relative;border-right:.35mm dashed var(--line);border-bottom:.35mm dashed var(--line);display:flex}
  .bind{width:15mm;flex:none;border-right:.3mm solid #d9dde4;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3mm 0}
  .bind .n{font-size:13pt;font-weight:800}
  .bind .st{width:2.2mm;height:2.2mm;border-radius:50%;border:.3mm solid var(--line)}
  .draw{flex:1;position:relative}
  .draw svg{position:absolute;inset:0;width:100%;height:100%}
  .cut{position:absolute;left:-3mm;top:-3mm;font-size:10pt;color:var(--line);background:#fff;line-height:1}
</style>
</head>
<body>
<div class="bar">
  <a href="animation-l2.html#part7"><span data-ph="arrow-left"></span>Back to the lesson</a>
  <button type="button" class="sp" data-print="ball"><span data-ph="printer"></span>Print ball helper pages</button>
  <button type="button" data-print="blank"><span data-ph="printer"></span>Print blank pages</button>
  <button type="button" class="go" data-print="all"><span data-ph="printer"></span>Print everything</button>
</div>
<div id="pages"></div>

<script>
(function(){
  var PH = {"arrow-left": "<path d=\"M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z\"/>", "printer": "<path d=\"M214.67,72H200V40a8,8,0,0,0-8-8H64a8,8,0,0,0-8,8V72H41.33C27.36,72,16,82.77,16,96v80a8,8,0,0,0,8,8H56v32a8,8,0,0,0,8,8H192a8,8,0,0,0,8-8V184h32a8,8,0,0,0,8-8V96C240,82.77,228.64,72,214.67,72ZM72,48H184V72H72ZM184,208H72V160H184Zm40-40H200V152a8,8,0,0,0-8-8H64a8,8,0,0,0-8,8v16H32V96c0-4.41,4.19-8,9.33-8H214.67c5.14,0,9.33,3.59,9.33,8Zm-24-52a12,12,0,1,1-12-12A12,12,0,0,1,200,116Z\"/>", "scissors": "<path d=\"M157.73,113.13A8,8,0,0,1,159.82,102L227.48,55.7a8,8,0,0,1,9,13.21l-67.67,46.3a7.92,7.92,0,0,1-4.51,1.4A8,8,0,0,1,157.73,113.13Zm80.87,85.09a8,8,0,0,1-11.12,2.08L136,137.7,93.49,166.78a36,36,0,1,1-9-13.19L121.83,128,84.44,102.41a35.86,35.86,0,1,1,9-13.19l143,97.87A8,8,0,0,1,238.6,198.22ZM80,180a20,20,0,1,0-5.86,14.14A19.85,19.85,0,0,0,80,180ZM74.14,90.13a20,20,0,1,0-28.28,0A19.85,19.85,0,0,0,74.14,90.13Z\"/>"};
  function ph(n){ return '<svg class="i" viewBox="0 0 256 256" aria-hidden="true">' + (PH[n] || '') + '</svg>'; }

  // the helper ball: 20 frames, two bounces from left to right, drawn as a faint dotted circle to trace
  // drawing area is about 75 x 46 mm; the svg uses 750 x 460 units
  function ballAt(i){
    var t = i / 10, h = Math.abs(Math.cos(Math.PI * t));
    var x = 70 + i * 30, r = 36, ground = 400;
    var land = (i === 5 || i === 15);
    return { x:x, y:land ? ground - r * .7 : ground - r - Math.pow(h, 1.6) * 250, rx:land ? r * 1.3 : r, ry:land ? r * .7 : r, g:ground };
  }
  function helper(i){
    var b = ballAt(i);
    return '<svg viewBox="0 0 750 460" preserveAspectRatio="xMidYMid meet"><line x1="30" y1="' + b.g + '" x2="720" y2="' + b.g + '" stroke="#1B2540" stroke-width="5" stroke-linecap="round"/>' +
      '<ellipse cx="' + b.x + '" cy="' + b.y + '" rx="' + b.rx + '" ry="' + b.ry + '" fill="none" stroke="#9aa1ae" stroke-width="4" stroke-dasharray="9 9"/></svg>';
  }
  function sheet(kind, from){
    var h = '<div class="page ' + kind + '"><div class="hd"><div><h1>' + (kind === 'ball' ? 'Bouncing ball helper' : 'Flipbook pages') + '</h1>' +
      '<p>' + (kind === 'ball' ? 'Draw a ball over each dotted circle. Trace the last page so the ball stays the same size.' : 'Draw near the right-hand edge. Trace the last page each time and move things a tiny bit.') +
      ' Cut on the dashed lines, put the pages in order with 1 on top, then staple on the dots.</p></div><span class="tag">PAGES ' + from + ' TO ' + (from + 9) + '</span></div><div class="grid">';
    for(var i = from; i < from + 10; i++){
      h += '<div class="pg">' + (i === from ? '<span class="cut">' + ph('scissors') + '</span>' : '') +
        '<div class="bind"><span class="st"></span><span class="n">' + i + '</span><span class="st"></span></div><div class="draw">' + (kind === 'ball' ? helper(i - 1) : '') + '</div></div>';
    }
    return h + '</div></div>';
  }
  document.getElementById('pages').innerHTML = sheet('ball', 1) + sheet('ball', 11) + sheet('blank', 1) + sheet('blank', 11);
  [].forEach.call(document.querySelectorAll('[data-ph]'), function(e){ e.insertAdjacentHTML('afterbegin', ph(e.getAttribute('data-ph'))); });
  [].forEach.call(document.querySelectorAll('[data-print]'), function(b){
    b.addEventListener('click', function(){
      var k = b.getAttribute('data-print');
      document.body.className = k === 'all' ? '' : 'only-' + k;
      window.print();
    });
  });
})();
</script>
</body>
</html>
