<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr White-bot: Into the Digital World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap">
<style>
  :root{
    --pur:#6D4CE0; --ink:#1E2330; --mu:#6B7285;
    --navy:#0D2340; --white:#FFFFFF; --cloud:#EEF5FF; --sky:#8EC5FF;
    --yel:#FFC93C; --org:#FF7A2F; --grn:#2FB86E; --red:#E8475A;
    --phosphor:#4df89b; --crt-bg:#06140c;
    --f:'Fredoka','Trebuchet MS',Arial,sans-serif; --i:'Inter','Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0A0F1E;color:var(--navy);font-family:var(--f)}
  button{font:inherit}
  #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1600px;height:900px;flex:none;transform-origin:center center;outline:none;overflow:hidden;background:#04100A}
  #shake{position:absolute;inset:0}
  .abs{position:absolute}

  /* ============ layer 1: the lesson deck, built to look like every other lesson on the site ============ */
  #deckwrap{position:absolute;inset:0;background:linear-gradient(135deg,#E9ECFA,#F5F0FB);z-index:1;transition:opacity 1.4s ease,filter 1.4s ease}
  #deck{position:absolute;left:48px;top:28px;width:1504px;height:844px;background:#FCFCFE;border-radius:44px;box-shadow:0 30px 80px rgba(60,60,120,.18);overflow:hidden;font-family:var(--i);color:var(--ink)}
  .dk-pill{position:absolute;left:18px;top:16px;height:44px;padding:0 20px 0 14px;border-radius:22px;background:#fff;box-shadow:0 2px 14px rgba(40,40,90,.12);font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px;border:0;color:var(--ink);cursor:pointer;text-decoration:none;z-index:3}
  .dk-arrows{position:absolute;right:18px;top:16px;display:flex;gap:12px;z-index:3}
  .dk-arrow{width:46px;height:46px;border-radius:23px;border:0;background:#fff;box-shadow:0 2px 14px rgba(40,40,90,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .dk-arrow:disabled{opacity:.3;cursor:default}
  .dk-arrow svg{width:22px;height:22px}
  .dk-dots{position:absolute;left:0;right:0;bottom:18px;display:flex;gap:11px;justify-content:center;z-index:3}
  .dk-dots i{width:11px;height:11px;border-radius:50%;background:#E2E3EC}
  .dk-dots i.on{background:var(--pur)}
  .dk-tools{position:absolute;right:18px;bottom:16px;display:flex;gap:8px;z-index:3}
  .dk-tools i{width:42px;height:42px;border-radius:11px;border:1.5px solid #E3E5EE;background:#fff;display:flex;align-items:center;justify-content:center}
  .dk-tools svg{width:20px;height:20px}
  #slide{position:absolute;inset:0}
  .dk-h1{font-weight:800;font-size:96px;letter-spacing:-.035em;line-height:1.02;margin:0;text-align:center}
  .acc{color:var(--pur)}
  .dk-sub{font-weight:500;font-size:34px;color:var(--mu);text-align:center;margin-top:22px}
  .dk-ttl{position:absolute;left:0;top:250px;width:1504px;transition:transform 1s cubic-bezier(.4,0,.2,1)}
  .dk-ttl.shift{transform:translateX(-300px) scale(.74)}
  .dk-ico{display:flex;gap:46px;justify-content:center;margin-top:44px}
  .dk-ico svg{width:60px;height:60px}
  .dsay{position:absolute;background:#fff;border:4px solid var(--pur);border-radius:30px;padding:20px 28px;font-family:var(--i);font-weight:600;font-size:34px;line-height:1.28;color:var(--ink);box-shadow:0 10px 30px rgba(109,76,224,.18);z-index:6}
  .dsay::after{content:"";position:absolute;width:28px;height:28px;background:#fff;border:4px solid var(--pur);border-top:0;border-left:0;transform:rotate(45deg);bottom:-18px;right:90px}
  .dsay .cur,.csay .cur{display:inline-block;width:.5em;height:.9em;background:var(--pur);vertical-align:-.1em;margin-left:3px;animation:blinkc .7s steps(2) infinite}
  @keyframes blinkc{50%{opacity:0}}
  .dkbtn{position:absolute;font-family:var(--i);font-weight:700;font-size:34px;padding:20px 46px;border-radius:999px;border:0;background:var(--pur);color:#fff;cursor:pointer;box-shadow:0 10px 0 #4A31AE,0 18px 30px rgba(109,76,224,.3);z-index:6}
  .dkbtn:active{transform:translateY(8px);box-shadow:0 2px 0 #4A31AE}
  .dkbtn.pulse{animation:btnpulse 1.4s ease-in-out infinite}
  @keyframes btnpulse{50%{transform:scale(1.05)}}
  .pp{transition:opacity .35s steps(4),transform .35s steps(4)}
  .pp.hide{opacity:0;transform:translateY(16px);pointer-events:none}

  /* the ending: six ticks and the vote */
  .dk-grid{position:absolute;left:92px;top:210px;width:1320px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
  .dk-card{position:relative;background:#fff;border:2px solid #E3E5EE;border-radius:26px;padding:22px 24px 20px;text-align:left;font-family:var(--i);cursor:default;box-shadow:0 6px 20px rgba(40,40,90,.06)}
  .dk-card .ic{width:54px;height:54px;border-radius:16px;background:#EFEAFD;display:flex;align-items:center;justify-content:center}
  .dk-card .ic svg{width:32px;height:32px}
  .dk-card h3{margin:14px 0 4px;font-size:32px;font-weight:800;letter-spacing:-.02em}
  .dk-card p{margin:0;font-size:24px;font-weight:500;color:var(--mu);line-height:1.25}
  .dk-card .tk{position:absolute;right:18px;top:18px;width:38px;height:38px;border-radius:50%;background:var(--grn);display:flex;align-items:center;justify-content:center}
  .dk-card .tk svg{width:22px;height:22px}
  .dk-card.vote{cursor:pointer}
  .dk-card .cnt{position:absolute;right:16px;top:14px;min-width:50px;height:50px;border-radius:25px;background:#EFEAFD;color:var(--pur);font-weight:800;font-size:28px;line-height:50px;text-align:center;padding:0 12px}
  .dk-card.top{border-color:var(--pur);box-shadow:0 0 0 5px rgba(109,76,224,.22),0 6px 20px rgba(40,40,90,.1)}
  .dk-card.top .cnt{background:var(--pur);color:#fff}

  /* glitch clones of the deck */
  #gl{position:absolute;inset:0;pointer-events:none;z-index:2}
  #gl .gcl{position:absolute;left:48px;top:28px;width:1504px;height:844px;pointer-events:none;opacity:0}
  #gl .gcl .dk-pill,#gl .gcl .dk-arrows,#gl .gcl .dk-dots,#gl .gcl .dk-tools{visibility:visible}
  #noise{position:absolute;inset:0;width:1600px;height:900px;z-index:8;pointer-events:none;opacity:0;mix-blend-mode:screen;image-rendering:pixelated}
  #scan{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;transition:opacity .8s;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 5px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
  #scan.on{opacity:1}

  /* ============ layer 2: the Matrix ============ */
  #rain{position:absolute;left:0;top:0;width:1600px;height:900px;z-index:2;opacity:0;image-rendering:pixelated;background:#020a05;transition:opacity 1.2s ease}

  /* ============ layer 3: the digital world ============ */
  #world{position:absolute;inset:0;z-index:3;opacity:0;pointer-events:none;transition:opacity .8s ease}
  #world.on{opacity:1;pointer-events:auto}
  #world .grid{position:absolute;inset:0;background:
      linear-gradient(rgba(77,248,155,.10) 2px,transparent 2px) 0 0/100px 100px,
      linear-gradient(90deg,rgba(77,248,155,.10) 2px,transparent 2px) 0 0/100px 100px,
      linear-gradient(rgba(77,248,155,.05) 1px,transparent 1px) 0 0/20px 20px,
      linear-gradient(90deg,rgba(77,248,155,.05) 1px,transparent 1px) 0 0/20px 20px,
      radial-gradient(ellipse at 50% 40%,rgba(8,60,50,.55),rgba(3,14,10,.2) 70%)}
  #host{position:absolute;left:0;top:0;width:1600px;height:804px}
  .scene{position:absolute;inset:0}
  .scene.enter{animation:boot .45s cubic-bezier(.3,1.3,.5,1) both}
  @keyframes boot{from{opacity:0;transform:scale(.97) translateY(14px)}to{opacity:1;transform:none}}
  .kick{font-weight:700;font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:var(--phosphor);text-shadow:0 0 14px rgba(77,248,155,.6)}
  .h1{font-weight:700;font-size:84px;line-height:1.02;margin:0;color:#fff;text-shadow:0 0 24px rgba(77,248,155,.45),0 4px 0 rgba(0,0,0,.35)}
  .h2{font-weight:700;font-size:58px;line-height:1.04;margin:0;color:#fff;text-shadow:0 0 18px rgba(77,248,155,.4),0 3px 0 rgba(0,0,0,.35)}
  .lead{font-weight:500;font-size:34px;line-height:1.3;color:#DDFBEA}

  .nav{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:16px;z-index:5}
  .btn{font-family:var(--f);font-weight:700;font-size:28px;min-height:66px;padding:0 38px;border-radius:999px;border:5px solid var(--navy);background:var(--white);color:var(--navy);cursor:pointer;box-shadow:0 7px 0 var(--navy)}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--navy)}
  .btn.primary{background:var(--yel)}
  .btn:disabled{opacity:.35;cursor:default}
  .mid{display:flex;align-items:center;gap:18px}
  .parts{display:flex;gap:9px;flex-wrap:wrap;max-width:760px;justify-content:center}
  .part{width:16px;height:16px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:transparent;padding:0;cursor:pointer}
  .part.done{background:var(--phosphor);border-color:var(--phosphor)}
  .part.on{background:var(--yel);border-color:var(--yel)}
  .tool{font-family:var(--f);font-weight:600;font-size:18px;color:#fff;background:rgba(0,0,0,.25);border:3px solid rgba(255,255,255,.55);border-radius:999px;padding:7px 16px;cursor:pointer}
  .home{position:absolute;right:30px;top:20px;z-index:12;font-weight:600;font-size:18px;color:#fff;text-decoration:none;border:3px solid rgba(255,255,255,.6);border-radius:999px;padding:6px 18px;background:rgba(0,0,0,.25)}
  #notes{position:absolute;left:36px;right:36px;bottom:104px;background:#fff;border:5px solid var(--navy);border-radius:22px;padding:16px 24px;font-weight:500;font-size:22px;line-height:1.4;display:none;z-index:14;color:var(--navy)}
  #notes.on{display:block}
  #notes b{font-weight:700;margin-right:10px}

  /* a bolted steel plate, as on Mr White-bot Returns */
  .plate{position:absolute;background:
      radial-gradient(circle at 20px 20px,#B8C2D1 6px,#7F8BA0 7px,transparent 8px),
      radial-gradient(circle at calc(100% - 20px) 20px,#B8C2D1 6px,#7F8BA0 7px,transparent 8px),
      radial-gradient(circle at 20px calc(100% - 20px),#B8C2D1 6px,#7F8BA0 7px,transparent 8px),
      radial-gradient(circle at calc(100% - 20px) calc(100% - 20px),#B8C2D1 6px,#7F8BA0 7px,transparent 8px),
      #fff;
    border:5px solid var(--navy);border-radius:28px;box-shadow:0 9px 0 var(--navy),0 0 40px rgba(77,248,155,.25)}
  .say{position:absolute;background:#fff;border:5px solid var(--navy);border-radius:30px;padding:16px 26px;font-weight:600;font-size:32px;line-height:1.2;color:var(--navy);box-shadow:0 7px 0 var(--navy);z-index:4}
  .say::after{content:"";position:absolute;width:30px;height:30px;background:#fff;border:5px solid var(--navy);border-top:0;border-left:0;transform:rotate(45deg);bottom:-19px;left:80px}
  .tag{display:inline-flex;align-items:center;gap:10px;background:var(--yel);border:4px solid var(--navy);border-radius:999px;padding:6px 20px;font-weight:700;font-size:26px;color:var(--navy)}
  .act{font-family:var(--f);font-weight:700;font-size:30px;padding:14px 34px;border-radius:999px;border:5px solid var(--navy);background:var(--yel);color:var(--navy);cursor:pointer;box-shadow:0 6px 0 var(--navy)}
  .act:active{transform:translateY(5px);box-shadow:0 1px 0 var(--navy)}
  .act:disabled{opacity:.4}
  .stamp{position:absolute;border:7px solid var(--grn);color:var(--grn);border-radius:18px;padding:8px 26px;font-weight:700;font-size:46px;letter-spacing:.06em;transform:rotate(-6deg);background:rgba(255,255,255,.95);z-index:6}
  .stamp.go{animation:stampin .5s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes stampin{from{transform:rotate(-6deg) scale(2.2);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}

  /* picture cards: technology and rules */
  .pcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--cloud);border:5px solid var(--navy);border-radius:24px;cursor:pointer;font-family:var(--f);font-weight:600;font-size:28px;color:var(--navy);box-shadow:0 6px 0 var(--navy);padding:10px 8px;text-align:center;line-height:1.1}
  .pcard svg{width:84px;height:84px}
  .pcard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy)}
  .pcard.sel{background:#FFF1B8;box-shadow:0 0 0 7px rgba(255,201,60,.65),0 6px 0 var(--navy)}
  .pcard.ok{background:#E3FFEF;box-shadow:0 0 0 7px rgba(47,184,110,.6),0 6px 0 var(--navy)}
  .pcard.bad{background:#FFE7EA;animation:nope .45s}
  .pcard.miss{animation:missp .6s 2}
  @keyframes nope{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
  @keyframes missp{50%{box-shadow:0 0 0 9px rgba(232,71,90,.6),0 6px 0 var(--navy)}}
  .pcard .mk{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;background:var(--grn);display:none;align-items:center;justify-content:center}
  .pcard.sel .mk{display:flex;background:var(--yel);border:3px solid var(--navy)}
  .pcard.ok .mk{display:flex}
  .pcard .mk svg{width:20px;height:20px}
  .pcard.rule{font-size:27px}
  .pcard.rule svg{width:70px;height:70px}

  /* answer buttons */
  .opt{display:flex;align-items:center;gap:16px;font-family:var(--f);font-weight:700;font-size:34px;text-align:left;padding:16px 26px;border-radius:26px;border:5px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;box-shadow:0 7px 0 var(--navy)}
  .opt:active{transform:translateY(5px);box-shadow:0 2px 0 var(--navy)}
  .opt svg{width:60px;height:60px;flex:none}
  .opt.no{background:#FFE7EA;animation:nope .45s}
  .opt.yes{background:#E3FFEF}

  /* the on-screen keyboard */
  .kb{position:absolute;display:flex;flex-direction:column;gap:9px;align-items:center}
  .kb .row{display:flex;gap:9px}
  .key{min-width:74px;height:74px;border-radius:14px;border:4px solid var(--navy);background:#fff;font-family:var(--f);font-weight:700;font-size:34px;color:var(--navy);cursor:pointer;box-shadow:0 6px 0 var(--navy);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px}
  .key:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy)}
  .key svg{width:34px;height:34px}
  .key.space{min-width:480px}
  .key.ok{background:#8FF0B8}
  .key.no{background:#FFB3BC;animation:nope .4s}
  .key.glow{box-shadow:0 0 0 7px rgba(255,201,60,.8),0 6px 0 var(--navy)}
  .wslot{display:inline-flex;align-items:center;justify-content:center;width:96px;height:112px;border:5px dashed #97A3B8;border-radius:18px;font-weight:700;font-size:72px;color:var(--navy);margin:0 8px;background:#F4F9FF}
  .wslot.on{border-style:solid;border-color:var(--navy);background:#E3FFEF}

  /* the sentence on the edit island */
  .sent{font-family:'Courier New',monospace;font-weight:700;font-size:60px;letter-spacing:.02em;background:#06140c;color:var(--phosphor);border:5px solid var(--navy);border-radius:18px;padding:22px 30px;text-shadow:0 0 12px rgba(77,248,155,.7);min-height:112px;white-space:nowrap}
  .sent .cursor{display:inline-block;width:.18em;height:1em;background:var(--phosphor);vertical-align:-.12em;animation:blinkc .7s steps(2) infinite}
  .sent .hi{background:rgba(232,71,90,.55);border-radius:6px;padding:0 4px}
  .sent .fixd{background:rgba(77,248,155,.28);border-radius:6px;padding:0 4px}

  /* computer parts drawing */
  .part-hit{cursor:pointer}
  .part-hit:active{opacity:.85}
  .plab{font-family:var(--f);font-weight:700;font-size:28px;fill:var(--navy)}

  /* memory bar */
  .mem{position:absolute;display:flex;gap:12px}
  .slot{position:relative;width:74px;height:74px;border-radius:16px;border:4px dashed rgba(77,248,155,.5);background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;transition:background .3s,border-color .3s,box-shadow .3s}
  .slot svg{width:42px;height:42px;opacity:.25}
  .slot.full{border:4px solid var(--phosphor);background:rgba(77,248,155,.2);box-shadow:0 0 22px 4px rgba(77,248,155,.55)}
  .slot.full svg{opacity:1}
  .slot .n{position:absolute;left:-6px;top:-10px;width:28px;height:28px;border-radius:50%;background:#0D2340;color:#fff;font-weight:700;font-size:18px;line-height:28px;text-align:center}
  .chipfly{position:absolute;width:74px;height:74px;border-radius:16px;border:4px solid var(--phosphor);background:rgba(77,248,155,.28);box-shadow:0 0 26px 6px rgba(77,248,155,.7);display:flex;align-items:center;justify-content:center;z-index:9}
  .chipfly svg{width:44px;height:44px}

  /* ============ layer 5: Mr White-bot, one robot that stays on screen the whole way through ============ */
  #cine{position:absolute;inset:0;z-index:5;pointer-events:none}
  #cine .say,#cine .dsay,#cine .csay{pointer-events:none}
  .csay{position:absolute;background:#04140c;border:4px solid var(--phosphor);border-radius:22px;padding:18px 26px;font-family:var(--f);font-weight:600;font-size:34px;line-height:1.25;color:var(--phosphor);text-shadow:0 0 10px rgba(77,248,155,.7);box-shadow:0 0 30px rgba(77,248,155,.35);z-index:6}
  .csay::after{content:"";position:absolute;width:26px;height:26px;background:#04140c;border:4px solid var(--phosphor);border-top:0;border-left:0;transform:rotate(45deg);bottom:-16px;right:80px}
  .csay .cur{background:var(--phosphor)}
  .wbx{position:absolute;width:340px;height:640px;transform-origin:0 0;--al:8deg;--ar:-8deg;transition:left 1s cubic-bezier(.4,0,.2,1),top 1s cubic-bezier(.4,0,.2,1),transform 1s cubic-bezier(.4,0,.2,1)}
  .wbx.fast{transition:none}
  .wbx .bot{position:absolute;left:0;top:130px;width:340px;height:490px;transform-origin:50% 100%;filter:grayscale(1) brightness(.45);transform:rotate(4deg) translateY(4px);transition:filter .6s ease,transform .6s cubic-bezier(.34,1.56,.64,1)}
  .wbx .bot.on{filter:none;transform:none}
  .wbx .leg{position:absolute;bottom:0;width:64px;height:110px;background:linear-gradient(180deg,#e8ebf3,#c0c5d2);border:3px solid #888e9c;border-radius:18px 18px 24px 24px;box-shadow:inset 0 -8px 14px rgba(0,0,0,.12);transform-origin:50% 0}
  .wbx .leg.l{left:70px}.wbx .leg.r{right:70px}
  .wbx .foot{position:absolute;bottom:-14px;width:84px;height:34px;background:linear-gradient(180deg,#d4d8e2,#a6abb8);border:3px solid #828795;border-radius:16px}
  .wbx .foot.l{left:60px}.wbx .foot.r{right:60px}
  .wbx .torso{position:absolute;left:38px;bottom:96px;width:264px;height:220px;background:linear-gradient(160deg,#f7f9fd,#cbd0dc);border:4px solid #848a98;border-radius:40px;box-shadow:inset 0 10px 18px rgba(255,255,255,.7),inset 0 -18px 26px rgba(0,0,0,.14)}
  .wbx .chest{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#8ce5ff,#1c7ec4 70%,#0d528f);border:5px solid #373e4b}
  .wbx .chest::after{content:"";position:absolute;inset:13px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
  .wbx .bot.on .chest{box-shadow:0 0 20px 4px rgba(70,190,255,.65)}
  .wbx .leds{position:absolute;left:50%;top:140px;transform:translateX(-50%);display:flex;gap:9px;padding:6px 9px;background:#2a303b;border-radius:12px;border:3px solid #848a98}
  .wbx .leds i{width:18px;height:18px;border-radius:50%;background:#46505f;transition:background .3s,box-shadow .3s}
  .wbx .leds i.on{background:var(--phosphor);box-shadow:0 0 10px 2px var(--phosphor)}
  .wbx .vent{position:absolute;width:38px;height:6px;background:#8e94a2;border-radius:3px}
  .wbx .vent.a{left:30px;bottom:34px}.wbx .vent.b{left:30px;bottom:22px}.wbx .vent.c{right:30px;bottom:34px}.wbx .vent.d{right:30px;bottom:22px}
  .wbx .arm{position:absolute;top:250px;width:34px;height:154px;background:linear-gradient(180deg,#eef1f7,#c2c7d4);border:3px solid #8a909e;border-radius:17px;transform-origin:50% 14px;transition:transform .5s cubic-bezier(.3,1.4,.5,1);z-index:3}

function enableDrag(el, getTargets, onDrop){

    if(busy || el.classList.contains('placed')) return;
    e.preventDefault(); try{ el.setPointerCapture(e.pointerId); }catch(x){}
    var sx = e.clientX, sy = e.clientY;
    el.style.transition = 'none'; el.style.zIndex = 30; el.classList.add('drag'); sfx('pop');
    function mv(ev){ el.style.transform = 'translate(' + ((ev.clientX - sx) / SC) + 'px,' + ((ev.clientY - sy) / SC) + 'px) scale(1.06)'; }
    function up(ev){
      el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
      el.classList.remove('drag');
      var hit = null;
      getTargets().forEach(function(t){ var r = t.getBoundingClientRect(); if(ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) hit = t; });
      if(hit && onDrop(el, hit)){ el.style.zIndex = ''; return; }

      el.style.transition = 'transform .35s cubic-bezier(.3,1.4,.5,1)'; el.style.transform = '';
      setTimeout(function(){ el.style.zIndex = ''; }, 380);
    }
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
}

      bsayAt(n === 6 ? "Rebooted. I remember everything now. Technology, computer parts, the mouse, the keyboard, fixing mistakes and rules. Thank you, Year 2." : "Rebooted. I am missing some chips, but I remember a lot. Thank you, Year 2.", { l: 650, t: 560, w: 880, lt: true });
      $('next').classList.add('pulse');
    }, 2300);
  });
}

function badKey(k){ k.classList.remove('no'); void k.offsetWidth; k.classList.add('no'); setTimeout(function(){ k.classList.remove('no'); }, 500); }
var SCENES = { 3: sArrive, 4: sZ1, 5: sZ2, 6: sZ3, 7: sZ4, 8: sZ5, 9: sZ6, 10: sReboot };
var NOTES = {
  3: "Say it as a story: Mr White-bot has lost his memory in the digital world and only this class can bring it back. Each zone is one end point from this half term. Let children come up and drag on the board; the rest of the class can point and call out.",
  4: "Identify technology. Use the class definition: people make it on purpose to help us, and it does not have to plug in. Umbrella, pencil and book are the tricky ones, and a wrong drop gets an explanation.",
  5: "Identify a computer and its main parts. Round one: drag each name to its part. Round two: tap the part by its job. The robot names whatever a child tapped, so use it to say the words together.",
  6: "Using a mouse in different ways. Ask the class to act out each move with a hand in the air before anyone drags a card.",
  7: "Typing on a keyboard. Type MR BOT with a space in the middle; B is in the bottom row and O, R and T are in the top row. Then match the space bar, Backspace and Shift to their jobs.",
  8: "Editing text with the keyboard. Nine taps in order: full stop, left arrow five times, Backspace, Shift, W. Different children can take different taps.",
  9: "Rules for using technology responsibly. Here children sort rules; they made their own in Lesson 6. Ask why before each drop, and finish on the one to remember: tell a grown-up.",
  10: "All chips in. Let one child press the big button. Then press Next to go home and finish with the vote on the trickiest chip."
};
function paintNav(){
  var h = '';
  for(var p = 3; p <= 10; p++) h += '<button class="part' + (p < cur ? ' done' : p === cur ? ' on' : '') + '" type="button" data-p="' + p + '" aria-label="Part ' + p + '"></button>';
  $('parts').innerHTML = h;
  [].forEach.call($('parts').querySelectorAll('.part'), function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); goWorld(+b.getAttribute('data-p')); }); });
  $('back').disabled = cur <= 3; $('next').textContent = cur === 10 ? 'Go home' : 'Next';
  if(notes.classList.contains('on')) notes.innerHTML = '<b>Teacher</b>' + esc(NOTES[cur] || '');
  try{ history.replaceState(null, '', '#part' + cur); }catch(e){}
}
function prepWorld(){
  deckwrap.style.display = 'none'; gl.innerHTML = ''; rainOff(); tunOff(); glevel(0); scan.classList.remove('on'); cap.classList.remove('on'); $('dbtn').style.display = 'none';
  world.classList.add('on'); cine.style.display = 'block'; running = null;
}
function goWorld(p, fresh){
  stopAll(); busy = false; cur = p; $('next').classList.remove('pulse'); bhide();
  wbot.classList.remove('dance', 'bob', 'wave', 'jolt'); paintMem();
  if(fresh){ wb.classList.add('fast'); botTo(70, 150, .9, true); sleep(); wb.classList.remove('fast'); } else botState();
  if(p === 10 && rebooted) { /* allow another go */ rebooted = false; }
  SCENES[p](); paintNav();
}
function go(i){
  stopAll(); $('next').classList.remove('pulse');
  if(i === 1){ cur = 1; deckShow(); }
  else if(i === 2){ cur = 2; runCine(); }
  else if(i >= 3 && i <= 10){ if(!world.classList.contains('on')) prepWorld(); goWorld(i); }
  else if(i === 11){ cur = 11; runHome(); }
  else if(i === 12){ enterEnd(); }
}
function next(){
  if(cur === 1){ if(deckStep === 0) deckBot(); else go(2); }
  else if(cur === 2 || cur === 11) skipCine();
  else if(cur >= 3 && cur <= 9) goWorld(cur + 1);
  else if(cur === 10) go(11);
}
function back(){
  if(cur === 1 && deckStep === 1) deckBack();
  else if(cur >= 4 && cur <= 10) goWorld(cur - 1);
}
$('next').addEventListener('click', function(e){ e.stopPropagation(); ac(); next(); });
$('back').addEventListener('click', function(e){ e.stopPropagation(); back(); });
$('dknext').addEventListener('click', function(e){ e.stopPropagation(); ac(); next(); });
$('dkprev').addEventListener('click', function(e){ e.stopPropagation(); back(); });
$('nbtn').addEventListener('click', function(e){ e.stopPropagation(); notes.classList.toggle('on'); notes.innerHTML = '<b>Teacher</b>' + esc(NOTES[cur] || ''); });
addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); ac(); next(); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); back(); }
  else if(e.key === 'n' || e.key === 'N'){ $('nbtn').click(); }
});

/* start */
(function(){
  var m = /part(\d+)/.exec(location.hash), p = m ? +m[1] : 1;
  if(!(p >= 1 && p <= 12)) p = 1;
  if(p >= 4) for(var z = 0; z < 6; z++) got[z] = (p === 4 ? false : z < (p >= 10 ? 6 : p - 4));
  if(p === 1){ deckShow(); }
  else if(p === 2){ deckShow(); go(2); }
  else if(p >= 3 && p <= 10){ deckShow(); prepWorld(); goWorld(p, p === 3); }
  else if(p === 11){ deckShow(); for(var y = 0; y < 6; y++) got[y] = true; go(11); }
  else { for(var y2 = 0; y2 < 6; y2++) got[y2] = true; deckShow(); enterEnd(); }
  paintMem();
})();
})();

</script>
