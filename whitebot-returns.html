<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr White-bot Returns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bp:#1C5394; --bp2:#174579; --navy:#0D2340; --ink:#0D2340; --white:#FFFFFF; --cloud:#EEF5FF; --sky:#8EC5FF;
    --yel:#FFC93C; --org:#FF7A2F; --grn:#2FB86E; --red:#E8475A; --steel:#9AA6B8;
    --g0:#E8475A; --g1:#FF9A4D; --g2:#FFC93C; --g3:#9BD36B; --g4:#2FB86E;
    --phosphor:#4df89b; --crt-bg:#06140c;
    --f:'Fredoka','Trebuchet MS',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0A1A30;color:var(--navy);font-family:var(--f)}
  button{font:inherit}
  #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  /* the blueprint: a fine grid with a heavier line every fifth square */
  #stage{position:relative;width:1600px;height:900px;flex:none;transform-origin:center center;outline:none;overflow:hidden;
    background:
      linear-gradient(rgba(255,255,255,.13) 2px,transparent 2px) 0 0/100px 100px,
      linear-gradient(90deg,rgba(255,255,255,.13) 2px,transparent 2px) 0 0/100px 100px,
      linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px) 0 0/20px 20px,
      linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px) 0 0/20px 20px,
      radial-gradient(ellipse at 50% 40%,#2463AA,var(--bp) 60%,var(--bp2));}
  .spec{position:absolute;left:36px;top:22px;z-index:6;font-weight:600;font-size:17px;letter-spacing:.14em;color:rgba(255,255,255,.55);text-transform:uppercase}
  #host{position:absolute;left:0;top:0;width:1600px;height:804px;z-index:2}
  .scene{position:absolute;inset:0}
  .scene.enter{animation:boot .45s cubic-bezier(.3,1.3,.5,1) both}
  @keyframes boot{from{opacity:0;transform:scale(.97) translateY(14px)}to{opacity:1;transform:none}}

  .nav{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:16px;z-index:5}
  .btn{font-family:var(--f);font-weight:700;font-size:28px;min-height:66px;padding:0 38px;border-radius:999px;border:5px solid var(--navy);background:var(--white);color:var(--navy);cursor:pointer;box-shadow:0 6px 0 var(--navy)}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--navy)}
  .btn.primary{background:var(--yel)}
  .btn:disabled{opacity:.35;cursor:default}
  .mid{display:flex;align-items:center;gap:18px}
  .parts{display:flex;gap:9px;flex-wrap:wrap;max-width:760px;justify-content:center}
  .part{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:#33465f;padding:0;cursor:pointer}
  .part.done{background:var(--phosphor);border-color:var(--phosphor)}
  .part.on{background:var(--yel);border-color:var(--white);box-shadow:0 0 12px var(--yel)}
  .tool{font-family:var(--f);font-weight:600;font-size:17px;color:#fff;background:transparent;border:3px solid rgba(255,255,255,.6);border-radius:999px;padding:6px 16px;cursor:pointer}
  .home{position:absolute;right:30px;top:18px;z-index:6;font-weight:600;font-size:17px;color:#fff;text-decoration:none;border:3px solid rgba(255,255,255,.6);border-radius:999px;padding:6px 16px}
  #notes{position:absolute;left:36px;right:36px;bottom:104px;background:var(--white);border:5px solid var(--navy);border-radius:22px;padding:16px 24px;font-size:22px;line-height:1.4;display:none;z-index:7;box-shadow:0 6px 0 var(--navy)}
  #notes.on{display:block}
  #notes b{font-weight:700;margin-right:10px;color:var(--org)}

  .pp{transition:opacity .35s ease,transform .45s cubic-bezier(.3,1.5,.5,1)}
  .pp.hide{opacity:0;transform:translateY(18px) scale(.96);pointer-events:none}
  .abs{position:absolute}

  /* type */
  .kick{font-weight:600;font-size:24px;letter-spacing:.16em;text-transform:uppercase;color:var(--yel)}
  .h1{font-weight:700;font-size:112px;line-height:.95;margin:0;color:#fff;text-shadow:0 8px 0 var(--navy)}
  .h2{font-weight:700;font-size:64px;line-height:1.02;margin:0;color:#fff;text-shadow:0 6px 0 var(--navy)}
  .lead{font-weight:500;font-size:36px;line-height:1.3;color:#fff}
  .ink{color:var(--navy);text-shadow:none}

  /* a bolted steel plate: the panel every bit of content sits on */
  .plate{position:absolute;background:
      radial-gradient(circle at 20px 20px,#B8C2D1 6px,#7F8BA0 7px,transparent 8px),
      radial-gradient(circle at calc(100% - 20px) 20px,#B8C2D1 6px,#7F8BA0 7px,transparent 8px),
      radial-gradient(circle at 20px calc(100% - 20px),#B8C2D1 6px,#7F8BA0 7px,transparent 8px),
      radial-gradient(circle at calc(100% - 20px) calc(100% - 20px),#B8C2D1 6px,#7F8BA0 7px,transparent 8px),
      #fff;
    border:5px solid var(--navy);border-radius:28px;box-shadow:0 9px 0 var(--navy)}
  .plate.cloud{background-color:var(--cloud)}

  /* rule chips with a status light */
  .chip{display:flex;align-items:center;gap:18px;background:#fff;border:5px solid var(--navy);border-radius:999px;padding:12px 30px 12px 14px;font-weight:600;font-size:34px;line-height:1.1;box-shadow:0 6px 0 var(--navy);transition:background .3s}
  .chip .led{width:34px;height:34px;flex:none;border-radius:50%;background:#4F5B6C;border:4px solid var(--navy);transition:background .3s,box-shadow .3s}
  .chip .ic{width:52px;height:52px;flex:none;border-radius:50%;background:var(--cloud);border:4px solid var(--navy);display:flex;align-items:center;justify-content:center}
  .chip .ic svg{width:32px;height:32px}
  .chip.lit{background:#E5FFF0}
  .chip.lit .led{background:var(--phosphor);box-shadow:0 0 16px 3px var(--phosphor)}
  .chip.dim{opacity:.45}

  .say{position:absolute;background:#fff;border:5px solid var(--navy);border-radius:30px;padding:18px 28px;font-weight:600;font-size:36px;line-height:1.2;color:var(--navy);box-shadow:0 7px 0 var(--navy);z-index:4}
  .say::after{content:"";position:absolute;width:30px;height:30px;background:#fff;border:5px solid var(--navy);border-top:0;border-left:0;transform:rotate(45deg);bottom:-19px;left:56px}
  .say.r::after{left:auto;right:56px}
  .say.lt::after{bottom:auto;top:40%;left:-19px;transform:rotate(135deg)}
  .say .cur{display:inline-block;width:.5em;height:.9em;background:var(--org);vertical-align:-.1em;margin-left:3px;animation:blinkc .7s steps(2) infinite}
  @keyframes blinkc{50%{opacity:0}}

  .tag{display:inline-flex;align-items:center;gap:10px;background:var(--yel);border:4px solid var(--navy);border-radius:999px;padding:6px 20px;font-weight:700;font-size:24px;color:var(--navy)}
  .act{font-family:var(--f);font-weight:700;font-size:28px;padding:14px 30px;border-radius:999px;border:5px solid var(--navy);background:var(--yel);color:var(--navy);cursor:pointer;box-shadow:0 6px 0 var(--navy)}
  .act:active{transform:translateY(5px);box-shadow:0 1px 0 var(--navy)}
  .act.w{background:#fff}
  .stamp{position:absolute;border:7px solid var(--grn);color:var(--grn);border-radius:18px;padding:8px 26px;font-weight:700;font-size:44px;letter-spacing:.06em;transform:rotate(-8deg);background:rgba(255,255,255,.92);z-index:6}
  .stamp.go{animation:stampin .5s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes stampin{from{transform:rotate(-8deg) scale(2.2);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}

  /* ============ Mr White-bot (ported from the Mr White-bot clips) ============ */
  .wbx{position:absolute;width:340px;height:640px;transform-origin:0 0;--al:8deg;--ar:-8deg}
  .wbx.slide{transition:left 2.6s cubic-bezier(.42,0,.58,1)}
  .wbx .bot{position:absolute;left:0;top:130px;width:340px;height:490px;transform-origin:50% 100%;filter:grayscale(1) brightness(.45);transform:rotate(4deg) translateY(4px);transition:filter .6s ease,transform .6s cubic-bezier(.34,1.56,.64,1)}
  .wbx .bot.on{filter:none;transform:none}
  .wbx .leg{position:absolute;bottom:0;width:64px;height:110px;background:linear-gradient(180deg,#e8ebf3,#c0c5d2);border:3px solid #888e9c;border-radius:18px 18px 24px 24px;box-shadow:inset 0 -8px 14px rgba(0,0,0,.12);transform-origin:50% 0}
  .wbx .leg.l{left:70px}.wbx .leg.r{right:70px}
  .wbx .foot{position:absolute;bottom:-14px;width:84px;height:34px;background:linear-gradient(180deg,#d4d8e2,#a6abb8);border:3px solid #828795;border-radius:16px}
  .wbx .foot.l{left:60px}.wbx .foot.r{right:60px}
  .wbx .torso{position:absolute;left:38px;bottom:96px;width:264px;height:220px;background:linear-gradient(160deg,#f7f9fd,#cbd0dc);border:4px solid #848a98;border-radius:40px;box-shadow:inset 0 10px 18px rgba(255,255,255,.7),inset 0 -18px 26px rgba(0,0,0,.14)}
  .wbx .chest{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#8ce5ff,#1c7ec4 70%,#0d528f);border:5px solid #373e4b}
  .wbx .chest::after{content:"";position:absolute;inset:13px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
  .wbx .bot.on .chest{box-shadow:0 0 20px 4px rgba(70,190,255,.65)}
  .wbx .leds{position:absolute;left:50%;top:140px;transform:translateX(-50%);display:flex;gap:9px;padding:6px 9px;background:#2a303b;border-radius:12px;border:3px solid #848a98}
  .wbx .leds i{width:18px;height:18px;border-radius:50%;background:#46505f;transition:background .3s,box-shadow .3s}
  .wbx .leds i.on{background:var(--phosphor);box-shadow:0 0 10px 2px var(--phosphor)}
  .wbx .vent{position:absolute;width:38px;height:6px;background:#8e94a2;border-radius:3px}
  .wbx .vent.a{left:30px;bottom:34px}.wbx .vent.b{left:30px;bottom:22px}.wbx .vent.c{right:30px;bottom:34px}.wbx .vent.d{right:30px;bottom:22px}
  .wbx .arm{position:absolute;top:250px;width:34px;height:154px;background:linear-gradient(180deg,#eef1f7,#c2c7d4);border:3px solid #8a909e;border-radius:17px;transform-origin:50% 14px;transition:transform .5s cubic-bezier(.3,1.4,.5,1);z-index:3}
  .wbx .arm.l{left:6px;transform:rotate(var(--al))}
  .wbx .arm.r{right:6px;transform:rotate(var(--ar))}
  .wbx .hand{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:46px;height:46px;border-radius:50%;background:linear-gradient(160deg,#e5e8f0,#b5b9c5);border:3px solid #848a98}
  .wbx .neck{position:absolute;left:50%;bottom:308px;transform:translateX(-50%);width:52px;height:34px;background:linear-gradient(180deg,#d5d9e3,#8a909e);border:3px solid #848a98;border-radius:8px}
  .wbx .ant-stem{position:absolute;left:50%;bottom:558px;transform:translateX(-50%);width:6px;height:46px;background:#848a98;border-radius:3px}
  .wbx .ant-dot{position:absolute;left:50%;bottom:598px;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27c,#dc9f00)}
  .wbx .bot.on .ant-dot{box-shadow:0 0 14px 4px rgba(255,205,60,.75)}
  .wbx.alert .ant-dot{background:radial-gradient(circle at 35% 30%,#ff9aa5,#d8243a);animation:antPulse .5s steps(2) infinite}
  @keyframes antPulse{50%{opacity:.3}}
  .wbx .head{position:absolute;left:50%;bottom:332px;transform:translateX(-50%);width:224px;height:198px;background:linear-gradient(160deg,#f5f7fc,#ccd1dc);border:5px solid #757b88;border-radius:28px;box-shadow:inset 0 8px 14px rgba(255,255,255,.6),inset 0 -14px 20px rgba(0,0,0,.14),0 10px 22px rgba(0,0,0,.16);transform-origin:50% 90%;transition:transform .5s cubic-bezier(.34,1.56,.64,1);z-index:2}
  .wbx .bolt{position:absolute;width:10px;height:10px;border-radius:50%;background:#7c828e}
  .wbx .bolt.tl{left:9px;top:9px}.wbx .bolt.tr{right:9px;top:9px}.wbx .bolt.bl{left:9px;bottom:9px}.wbx .bolt.br{right:9px;bottom:9px}
  .wbx .screen{position:absolute;left:19px;top:19px;width:176px;height:150px;border-radius:12px;overflow:hidden;background:var(--crt-bg);border:4px solid #171a20;box-shadow:inset 0 0 24px 6px rgba(0,0,0,.9)}
  .wbx .screen .face{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:150%;height:150%;object-fit:contain;filter:grayscale(1) brightness(1.2) contrast(1.6) sepia(1) hue-rotate(78deg) saturate(5);mix-blend-mode:screen;opacity:0;transition:opacity .25s ease}
  .wbx .bot.on .screen .face.smile{opacity:.95}
  .wbx.shock .bot.on .screen .face.smile,.wbx.sad .bot.on .screen .face.smile{opacity:0}
  .wbx.shock .bot.on .screen .face.shock{opacity:.95}
  .wbx.sad .bot.on .screen .face.sad{opacity:.95}
  .wbx .screen .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(70,255,140,.32),transparent 70%)}
  .wbx .screen .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 1px,transparent 1px 3px)}
  .wbx .screen .vignette{position:absolute;inset:0;box-shadow:inset 0 0 32px 14px rgba(0,0,0,.8);border-radius:8px}
  .wbx .prop{position:absolute;z-index:2}
  .wbx .prop.front{z-index:4}

  /* moves */
  .wbx .bot.bob{animation:idleBob 2.8s ease-in-out infinite}
  @keyframes idleBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .wbx .bot.jolt{animation:wakeJolt .7s cubic-bezier(.34,1.56,.64,1)}
  @keyframes wakeJolt{0%{transform:translateY(8px) scaleY(.9)}35%{transform:translateY(-22px) scaleY(1.08)}65%{transform:translateY(4px) scaleY(.97)}100%{transform:none}}
  .wbx .bot.walk{animation:walkBounce .48s ease-in-out infinite}
  .wbx .bot.walk .leg.l{animation:legStepL .48s ease-in-out infinite}
  .wbx .bot.walk .leg.r{animation:legStepR .48s ease-in-out infinite}
  .wbx .bot.walk .arm.l{animation:armSwingL .48s ease-in-out infinite}
  .wbx .bot.walk:not(.holdr) .arm.r{animation:armSwingR .48s ease-in-out infinite}
  @keyframes walkBounce{0%,100%{transform:translateY(0) rotate(1deg)}50%{transform:translateY(-10px) rotate(-1deg)}}
  @keyframes legStepL{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
  @keyframes legStepR{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-14deg)}}
  @keyframes armSwingL{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-12deg)}}
  @keyframes armSwingR{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(12deg)}}
  .wbx .bot.shake{animation:shake .12s linear infinite}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-.6deg)}75%{transform:translateX(4px) rotate(.6deg)}}
  .wbx .bot.wave .arm.l{animation:waveArm .5s ease-in-out infinite alternate}
  @keyframes waveArm{from{transform:rotate(140deg)}to{transform:rotate(175deg)}}
  .wbx .bot.typing .arm.l{animation:typeL .26s ease-in-out infinite alternate}
  .wbx .bot.typing .arm.r{animation:typeR .26s ease-in-out infinite alternate .13s}
  @keyframes typeL{from{transform:rotate(-38deg)}to{transform:rotate(-30deg)}}
  @keyframes typeR{from{transform:rotate(-82deg)}to{transform:rotate(-74deg)}}
  .wbx .bot.dance{animation:danceTorso .56s ease-in-out infinite}
  .wbx .bot.dance .head{animation:danceHead .56s ease-in-out infinite}
  .wbx .bot.dance .leg.l{animation:legStepL .56s ease-in-out infinite}
  .wbx .bot.dance .leg.r{animation:legStepR .56s ease-in-out infinite}
  .wbx .bot.dance .arm.l{animation:danceArmL .56s ease-in-out infinite}
  .wbx .bot.dance .arm.r{animation:danceArmR .56s ease-in-out infinite}
  @keyframes danceTorso{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
  @keyframes danceHead{0%,100%{transform:translateX(-50%) rotate(6deg)}50%{transform:translateX(-50%) rotate(-6deg)}}
  @keyframes danceArmL{0%,100%{transform:rotate(12deg)}50%{transform:rotate(150deg)}}
  @keyframes danceArmR{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-12deg)}}
  .swing{transform-origin:6px 6px;animation:swing 1.6s ease-in-out infinite alternate}
  @keyframes swing{from{transform:rotate(18deg)}to{transform:rotate(44deg)}}

  /* pictures on the cards */
  .pic{position:absolute;left:10px;top:10px;width:640px;height:500px;border-radius:18px;overflow:hidden;
    background:linear-gradient(rgba(28,83,148,.08) 1px,transparent 1px) 0 0/20px 20px,linear-gradient(90deg,rgba(28,83,148,.08) 1px,transparent 1px) 0 0/20px 20px,#F4F9FF}
  .pic .floor{position:absolute;left:0;right:0;bottom:0;height:46px;background:#D8E6F7;border-top:4px solid var(--navy)}
  .pic.enter{animation:boot .4s cubic-bezier(.3,1.3,.5,1) both}
  .bub{animation:bubble 2.4s ease-in infinite}
  @keyframes bubble{from{transform:translateY(0);opacity:1}to{transform:translateY(-120px);opacity:0}}
  .crumb{animation:crumb 1.2s ease-in infinite}
  @keyframes crumb{from{transform:translateY(0);opacity:1}to{transform:translateY(70px);opacity:0}}
  .floaty{animation:floaty 2.2s ease-in-out infinite alternate}
  @keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-14px)}}
  .glowring{animation:glowring 1s ease-in-out infinite alternate}
  @keyframes glowring{from{opacity:.25}to{opacity:1}}

  /* the How OK line */
  .gauge{position:absolute;display:flex;gap:10px}
  .seg{position:relative;width:144px;height:118px;border:5px solid var(--navy);border-radius:22px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding:0 6px 10px;font-weight:700;font-size:22px;line-height:1.05;text-align:center;color:var(--navy);box-shadow:0 6px 0 var(--navy);font-family:var(--f)}
  .seg:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy)}
  .seg .num{position:absolute;top:8px;left:0;right:0;font-size:38px}
  .seg.off{filter:saturate(.25) brightness(1.05);opacity:.55}
  .pin{position:absolute;top:-78px;left:50%;width:64px;height:70px;margin-left:-32px;animation:pindrop .45s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes pindrop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
  .band{position:absolute;height:20px;border-radius:10px;background:var(--navy);transition:left .4s,width .4s}
  .band span{position:absolute;top:28px;left:0;right:0;text-align:center;font-weight:700;font-size:26px;color:#fff;white-space:nowrap}
  .tally{display:flex;gap:16px;align-items:center}
  .tbtn{font-family:var(--f);font-weight:700;font-size:26px;padding:12px 22px;border-radius:20px;border:5px solid var(--navy);background:#fff;cursor:pointer;box-shadow:0 5px 0 var(--navy);display:flex;align-items:center;gap:12px}
  .tbtn b{display:inline-block;min-width:48px;padding:2px 8px;border-radius:12px;background:var(--navy);color:#fff;font-size:30px}

  /* option buttons */
  .opt{position:absolute;display:flex;align-items:center;gap:20px;font-family:var(--f);font-weight:600;font-size:34px;text-align:left;padding:18px 28px;border-radius:26px;border:5px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;box-shadow:0 7px 0 var(--navy)}
  .opt .mk{width:56px;height:56px;flex:none;border-radius:50%;border:5px solid var(--navy);background:var(--cloud);display:flex;align-items:center;justify-content:center}
  .opt.no{background:#FFE7EA}.opt.no .mk{background:var(--red)}
  .opt.yes{background:#E3FFEF}.opt.yes .mk{background:var(--grn)}
  .opt.no{animation:nope .4s}
  @keyframes nope{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

  .adult{position:absolute;width:440px;height:470px;text-align:center}
  .adult .num{position:absolute;top:-38px;left:50%;margin-left:-38px;width:76px;height:76px;border-radius:50%;background:var(--yel);border:5px solid var(--navy);font-weight:700;font-size:44px;line-height:66px;box-shadow:0 5px 0 var(--navy)}
  .adult .big{width:150px;height:150px;margin:58px auto 10px;border-radius:50%;background:var(--cloud);border:5px solid var(--navy);display:flex;align-items:center;justify-content:center}
  .adult .big svg{width:92px;height:92px}
  .adult h3{margin:0;font-size:50px;line-height:1.05;font-weight:700}
  .adult p{margin:14px 26px 0;font-size:27px;line-height:1.3;font-weight:500;color:#33476A}

  .face3{position:absolute;width:300px;height:320px;cursor:pointer;font-family:var(--f);border:5px solid var(--navy);border-radius:30px;background:#fff;box-shadow:0 8px 0 var(--navy);padding:0}
  .face3:active{transform:translateY(5px);box-shadow:0 3px 0 var(--navy)}

        [].forEach.call(l, function(x, i){ x.classList.toggle('on', i < n); });

        var st = r.querySelector('#rstamp'), b = w.querySelector('.bot');
        b.classList.remove('dance');
        st.style.display = 'none'; st.classList.remove('go');
        if(fwd && n > 0){ sfx('whir'); later(function(){ sfx('ding'); move(w, 'jolt', 750); }, 450); }
        if(n === 5){ later(function(){ st.style.display = 'block'; st.classList.add('go'); sfx('yay'); b.classList.add('dance'); }, fwd ? 900 : 0); later(function(){ b.classList.remove('dance'); }, 4200); }
      } },

    { name:'Jessie and Friends', steps:1,
      note:'Play Episode 1, Watching Videos, and stop there. It opens on the CEOP Education page, which has all three episodes on one page with no separate link for each, so scroll to the first one. Episodes 2 and 3 cover sharing pictures and online gaming, which are for another time. Press Next after the video for the questions.',
      build:function(r){
        r.innerHTML =
          '<div class="abs" style="left:80px;top:60px"><div class="kick">Watch</div><h2 class="h2" style="margin-top:12px">Jessie and Friends</h2></div>' +
          '<div class="plate pp" data-s="0" style="left:80px;top:200px;width:820px;height:440px">' +
            '<a href="https://www.ceopeducation.co.uk/parents/jessie-and-friends-videos/" target="_blank" rel="noopener" style="position:absolute;left:60px;top:70px;width:200px;height:200px;border-radius:50%;background:var(--yel);border:6px solid var(--navy);box-shadow:0 9px 0 var(--navy);display:flex;align-items:center;justify-content:center" aria-label="Open Jessie and Friends on CEOP Education"><svg width="90" height="90" viewBox="0 0 90 90"><path d="M28 14 L76 45 L28 76 Z" fill="#0D2340" stroke="#0D2340" stroke-width="8" stroke-linejoin="round"/></svg></a>' +
            '<div style="position:absolute;left:310px;top:66px;right:40px"><div style="font-weight:700;font-size:44px;line-height:1.05">Episode 1</div><div style="font-weight:600;font-size:38px;margin-top:6px;color:#33476A">Watching Videos</div>' +
            '<div style="font-size:24px;line-height:1.35;margin-top:22px;color:#33476A">Opens on CEOP Education. Scroll down to the first episode.</div></div>' +
            '<div style="position:absolute;left:60px;bottom:40px;right:40px;font-weight:600;font-size:30px">Watch for: how does Jessie feel, and what does she do?</div>' +
          '</div>' +
          '<div class="plate pp" data-s="1" data-only style="left:80px;top:200px;width:820px;height:440px;padding:46px 54px">' +
            '<div style="font-weight:700;font-size:40px;margin-bottom:20px">After the video</div>' +
            ['How did Jessie feel?', 'Who could she talk to?', 'What else could she do?'].map(function(q, i){ return '<div style="display:flex;align-items:center;gap:20px;font-weight:600;font-size:38px;margin-top:22px"><span style="width:58px;height:58px;border-radius:50%;background:var(--yel);border:5px solid var(--navy);display:inline-flex;align-items:center;justify-content:center;font-size:30px">' + (i + 1) + '</span>' + q + '</div>'; }).join('') +
          '</div>' +
          bot({ id:'jb', x:1100, y:130, s:.9, cls:'bob' });
        [].forEach.call(r.querySelectorAll('a'), function(a){ a.addEventListener('click', function(e){ e.stopPropagation(); }); });
      },
      step:function(r, n){
        var b = r.querySelector('#jb .bot');
        // he holds up his chest lights as a reminder of rule 5 on the questions slide
        [].forEach.call(r.querySelectorAll('#jb .leds i'), function(x){ x.classList.toggle('on', n === 1); });
        if(n === 1) sfx('pop');
      } },

    { name:'Uh oh', steps:3,
      note:'He is on the computer and something pops up that scares him. Ask what he should do before you show the choices. Tap each choice to check it. Step 3 is the message from the video: stop, and tell a grown-up you trust. Say clearly that nobody is ever in trouble for telling.',
      build:function(r){
        r.innerHTML =
          '<div class="abs" style="left:520px;top:400px">' + deskSVG(420) + '</div>' +
          '<div class="abs" style="left:560px;top:110px" id="mon">' + monitorSVG('<g id="popg" style="opacity:0">' + POPUP + '</g>', 340, 300) + '</div>' +
          bot({ id:'ub', x:150, y:120, s:.9, cls:'typing', al:-34, ar:-78 }) +
          '<div class="abs pp" data-s="1" style="left:80px;top:40px"><h2 class="h2">What should he do?</h2></div>' +
          '<button class="opt pp" data-s="1" type="button" data-k="no" style="left:960px;top:150px;width:580px"><span class="mk"></span>Keep it a secret</button>' +
          '<button class="opt pp" data-s="1" type="button" data-k="no" style="left:960px;top:310px;width:580px"><span class="mk"></span>Click it to see more</button>' +
          '<button class="opt pp" data-s="1" type="button" data-k="yes" style="left:960px;top:470px;width:580px"><span class="mk"></span>Stop, and tell a grown-up he trusts</button>' +
          '<div class="plate pp" data-s="3" style="left:960px;top:140px;width:580px;height:470px;padding:44px 46px;z-index:5">' +
            '<div style="font-weight:700;font-size:60px;line-height:1">Stop.</div><div style="font-weight:700;font-size:52px;line-height:1.1;margin-top:20px">Tell a grown-up you trust.</div>' +
            '<div style="font-weight:600;font-size:36px;line-height:1.25;margin-top:30px;color:#33476A">You will not be in trouble for telling.</div></div>';
        // the bigger monitor: scale the pop-up to fit its screen
        var pg = r.querySelector('#popg'); pg.setAttribute('transform', 'translate(10 10) scale(1.38)');
        [].forEach.call(r.querySelectorAll('.opt'), function(o){ o.addEventListener('click', function(e){
          e.stopPropagation(); var yes = o.getAttribute('data-k') === 'yes';
          o.classList.remove('no', 'yes'); void o.offsetWidth; o.classList.add(yes ? 'yes' : 'no');
          o.querySelector('.mk').innerHTML = yes ? tick() : cross();
          sfx(yes ? 'yay' : 'fail');
          if(yes){ var w = r.querySelector('#ub'); w.style.setProperty('--al', '165deg'); }
        }); });
        later(function(){ var w = r.querySelector('#ub'); if(r._n) return; pop(r); }, 1800);
      },
      step:function(r, n, fwd){
        r._n = n;
        var w = r.querySelector('#ub'), b = w.querySelector('.bot');
        if(n === 0){ r.querySelector('#popg').style.opacity = 0; setFace(w, 'smile'); w.classList.remove('alert'); b.className = 'bot on typing'; w.style.setProperty('--al', '-34deg'); w.style.setProperty('--ar', '-78deg'); return; }
        pop(r, true);
        if(n >= 2){ var y = r.querySelector('.opt[data-k="yes"]'); if(!y.classList.contains('yes')) y.click(); }
        if(n === 3){ w.style.setProperty('--al', '165deg'); b.classList.remove('shake'); setFace(w, 'smile'); w.classList.remove('alert'); if(fwd) sfx('ding'); }
      } },

    { name:'Three grown-ups', steps:4,
      note:'Three is enough for this age: one at home, one at school, and one more. Hold up a finger for each. At home might be Mum, Dad, a grandparent or a carer. At school is you, Mr White, or any adult in school. The third is anyone else they trust, such as an aunt, a neighbour or a coach. Step 4: everyone thinks of their own three and tells a partner. Watch for anyone who cannot name one at home, and follow it up quietly afterwards.',
      build:function(r){
        var A = [['house','At home','Mum, Dad, Nana, Grandad or a carer'], ['book-open','At school','Your teacher, Mr White or a teaching assistant'], ['users-three','One more','An aunt, an uncle, a neighbour or a coach']];
        r.innerHTML = '<div class="abs" style="left:80px;top:50px"><div class="kick">Who can you tell?</div><h2 class="h2" style="margin-top:12px">Three grown-ups you trust</h2></div>' +
          A.map(function(a, i){ return '<div class="plate adult pp" data-s="' + (i + 1) + '" style="left:' + (80 + i * 490) + 'px;top:250px"><div class="num">' + (i + 1) + '</div><div class="big">' + ph(a[0], '#0D2340') + '</div><h3>' + a[1] + '</h3><p>' + a[2] + '</p></div>'; }).join('') +
          '<div class="say pp" data-s="4" data-only style="left:300px;top:210px;font-size:46px;padding:28px 40px;max-width:1000px;z-index:6;text-align:center">Think of your three.<br>Tell your partner who they are.</div>';
      },
      step:function(r, n, fwd){ if(fwd) sfx(n === 4 ? 'pop' : 'ding'); [].forEach.call(r.querySelectorAll('.adult'), function(a){ a.style.opacity = n === 4 ? .35 : ''; }); } },

    { name:'Our class rules', steps:1,
      note:'The poster is Mr White-bot\'s rules, made by the class. Give every child one rule card from the sheet; share the five rules round the tables, and give the blank card to anyone with a rule of their own from How OK. They draw Mr White-bot doing it the right way and write the rule if they can. Put the cards round the poster header by the computers.',
      build:function(r){
        r.innerHTML =
          '<div class="plate" style="left:80px;top:40px;width:900px;height:680px;padding:30px 46px">' +
            '<div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:5px solid var(--navy);padding-bottom:16px"><div style="font-weight:700;font-size:54px;line-height:1">Mr White-bot\'s Rules</div><div style="font-weight:600;font-size:26px;color:#33476A">made by our class</div></div>' +
            RULES.map(function(x, i){ return '<div style="margin-top:20px">' + chip(i, 'lit') + '</div>'; }).join('') +
          '</div>' +
          bot({ id:'cb', x:1130, y:120, s:.85, cls:'bob', leds:5 }) +
          '<div class="plate pp" data-s="1" style="left:1010px;top:120px;width:540px;height:580px;padding:40px 44px;z-index:5">' +
            '<div style="font-weight:700;font-size:44px;line-height:1.05">Your job</div>' +
            '<div style="font-size:31px;line-height:1.35;margin-top:20px;font-weight:500">Draw Mr White-bot doing your rule <b>the right way</b>.</div>' +
            '<div style="font-size:31px;line-height:1.35;margin-top:16px;font-weight:500">Write the rule underneath if you can.</div>' +
            '<a class="act w" href="whitebot-sheet.html" target="_blank" style="position:absolute;left:44px;bottom:40px;text-decoration:none;display:inline-flex;align-items:center;gap:12px"><span style="width:34px;height:34px;display:inline-block">' + ph('printer', '#0D2340') + '</span>Rule cards</a>' +
          '</div>';
        [].forEach.call(r.querySelectorAll('a'), function(a){ a.addEventListener('click', function(e){ e.stopPropagation(); }); });
      } },

    { name:'Thumbs up, thumbs down', steps:QUIZ.length - 1,
      note:'Mr White-bot tells them what he did. Thumbs up if it was right, thumbs down if not, then press Show the answer. Next moves to the next one.',
      build:function(r){
        r.innerHTML = '<div class="abs kick" style="left:60px;top:58px">Thumbs up or thumbs down?</div><div class="abs kick" id="qnum" style="left:1300px;top:58px;width:240px;text-align:right;color:#fff"></div>' +
          '<div class="plate cloud" style="left:60px;top:110px;width:670px;height:530px"><div class="pic" id="qpic"></div></div>' +
          '<div class="say lt" id="qs" style="left:800px;top:130px;width:740px;font-size:44px"></div>' +
          '<button class="act" id="qshow" type="button" style="position:absolute;left:800px;top:560px">Show the answer</button>' +
          '<div class="abs" id="qans" style="left:800px;top:380px;width:740px;display:none;align-items:center;gap:30px"><div id="qth" style="width:150px;height:150px;flex:none"></div><div id="qwhy" style="font-weight:700;font-size:40px;line-height:1.15;color:#fff;text-shadow:0 4px 0 var(--navy)"></div></div>';
        r.querySelector('#qshow').addEventListener('click', function(e){ e.stopPropagation(); showQ(r); });
      },
      step:function(r, n){
        stopAll(); r._q = n; var Q = QUIZ[n];
        r.querySelector('#qnum').textContent = (n + 1) + ' of ' + QUIZ.length;
        var p = r.querySelector('#qpic'); p.className = 'pic' + (RM ? '' : ' enter'); p.innerHTML = SCENE(Q.pic, Q.line);
        r.querySelector('#qans').style.display = 'none'; r.querySelector('#qshow').style.display = '';
        say(r.querySelector('#qs'), Q.q);
      } },

    { name:'How sure are you?', steps:0,
      note:'Ask the question, and tap a screen for each hand that goes up. Anyone on the first screen: go back to the rules poster with them at the end.',
      build:function(r){
        var F = [['I am not sure yet', 'M70 120 Q115 104 160 120'], ['I think I know', 'M70 116 H160'], ['I know the rules', 'M70 106 Q115 146 160 106']];
        r.innerHTML = '<div class="abs" style="left:80px;top:50px"><div class="kick">How sure are you?</div><h2 class="h2" style="margin-top:12px;max-width:1100px">Could you teach Mr White-bot the rules?</h2></div>' +
          F.map(function(f, i){ return '<button class="face3" type="button" data-i="' + i + '" style="left:' + (180 + i * 440) + 'px;top:300px"><div class="scr"><svg viewBox="0 0 230 170" width="100%" height="100%"><circle cx="80" cy="68" r="12" fill="#4df89b"/><circle cx="150" cy="68" r="12" fill="#4df89b"/><path d="' + f[1] + '" fill="none" stroke="#4df89b" stroke-width="10" stroke-linecap="round"/></svg></div><div class="lab">' + f[0] + '</div><div class="cnt">0</div></button>'; }).join('');
        [].forEach.call(r.querySelectorAll('.face3'), function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); var c = b.querySelector('.cnt'); c.textContent = +c.textContent + 1; sfx('pop'); }); });
      } },

    { name:'Goodbye', steps:0,
      note:'That is the whole unit done. Put the rule cards up with the poster by the computers this week.',
      build:function(r){
        r.innerHTML = bot({ id:'gb', x:200, y:110, s:.95, cls:'wave', leds:5 }) +
          '<div class="say" id="gs" style="left:650px;top:150px;max-width:860px;min-height:96px"></div>' +
          '<div class="abs" style="left:650px;top:470px"><div class="h2">Rules installed.</div><div class="lead" style="margin-top:16px">Thank you for teaching me, Class.</div></div>';
        later(function(){ say(r.querySelector('#gs'), 'Now I know how to use the computers. Goodbye.'); }, 500);
      } }
  ];

  /* the pop-up arrives on Mr White-bot's monitor */
  function pop(r, quiet){
    var w = r.querySelector('#ub'), b = w.querySelector('.bot');
    r.querySelector('#popg').style.opacity = 1;
    b.classList.remove('typing'); w.style.setProperty('--al', '30deg'); w.style.setProperty('--ar', '-30deg');
    setFace(w, 'shock'); w.classList.add('alert');
    if(!quiet){ sfx('alarm'); move(w, 'jolt', 700); later(function(){ b.classList.add('shake'); }, 700); }
    else b.classList.add('shake');
  }

  /* How OK: paint the current card */
  function paintCard(r, fresh){
    var n = r._n, C = CARDS[n], st = r._st[n];
    r.querySelector('#cnum').textContent = 'Card ' + (n + 1) + ' of ' + CARDS.length;
    if(fresh){
      stopAll();
      r.querySelector('#ct').textContent = C.t;
      var p = r.querySelector('#pic'); p.className = 'pic' + (RM ? '' : ' enter'); p.innerHTML = SCENE(C.pic);
      if(C.sfx) later(function(){ sfx(C.sfx); }, 400);
    }
    var segs = r.querySelectorAll('.seg');
    [].forEach.call(segs, function(s, i){
      var old = s.querySelector('.pin'); if(old) old.remove();
      if(st.pin === i) s.insertAdjacentHTML('beforeend', '<svg class="pin" viewBox="0 0 64 70"><path d="M32 66 L14 36 A20 20 0 1 1 50 36 Z" fill="#fff" stroke="#0D2340" stroke-width="5" stroke-linejoin="round"/><circle cx="32" cy="24" r="9" fill="#FF7A2F" stroke="#0D2340" stroke-width="4"/></svg>');
      s.classList.toggle('off', st.shown && !C.vote && (i < C.min || i > C.max));
    });
    var band = r.querySelector('#band');
    if(st.shown && !C.vote){ band.style.left = (790 + C.min * 154) + 'px'; band.style.width = ((C.max - C.min + 1) * 154 - 10) + 'px'; band.style.opacity = 1; }
    else { band.style.opacity = 0; }
    var ctrl = r.querySelector('#ctrl');
    if(!st.shown){
      ctrl.innerHTML = '<button class="act" type="button" id="cshow">Show the answer</button>';
      ctrl.querySelector('#cshow').addEventListener('click', function(e){ e.stopPropagation(); st.shown = true; sfx(C.vote ? 'pop' : 'ding'); paintCard(r, false); });
      return;
    }
    if(C.vote){
      ctrl.innerHTML = '<div style="width:760px;font-weight:700;font-size:36px;color:#fff;text-shadow:0 4px 0 var(--navy);margin:-80px 0 14px">No right answer. What do you think?</div>' +
        '<div class="tally"><button class="tbtn" type="button" id="tok"><span style="width:44px;height:44px;display:inline-block">' + thumb(true, '#2FB86E') + '</span>OK <b>' + st.ok + '</b></button>' +
        '<button class="tbtn" type="button" id="tno"><span style="width:44px;height:44px;display:inline-block">' + thumb(false, '#E8475A') + '</span>Not OK <b>' + st.no + '</b></button></div>';
      ctrl.querySelector('#tok').addEventListener('click', function(e){ e.stopPropagation(); st.ok++; sfx('pop'); paintCard(r, false); });
      ctrl.querySelector('#tno').addEventListener('click', function(e){ e.stopPropagation(); st.no++; sfx('pop'); paintCard(r, false); });
      return;
    }
    if(C.ask){
      ctrl.innerHTML = st.inst
        ? '<div class="plate" style="position:relative;width:760px;padding:22px 30px 24px;font-weight:600;font-size:29px;line-height:1.3"><div style="font-weight:700;color:var(--org);font-size:24px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px">Instead</div>' + esc(C.ask) + '</div>'
        : '<button class="act w" type="button" id="cins">What should he do instead?</button>';
      var ci = ctrl.querySelector('#cins'); if(ci) ci.addEventListener('click', function(e){ e.stopPropagation(); st.inst = true; sfx('pop'); paintCard(r, false); });
      return;
    }
    ctrl.innerHTML = C.aside ? '<div style="font-weight:600;font-size:30px;color:#fff;text-shadow:0 3px 0 var(--navy)">' + esc(C.aside) + '</div>' : '';
  }

  function showQ(r){
    var Q = QUIZ[r._q], a = r.querySelector('#qans');
    r.querySelector('#qth').innerHTML = thumb(Q.a, Q.a ? '#2FB86E' : '#E8475A');
    r.querySelector('#qwhy').textContent = (Q.a ? 'Thumbs up. ' : 'Thumbs down. ') + Q.why;
    a.style.display = 'flex'; r.querySelector('#qshow').style.display = 'none';
    sfx(Q.a ? 'yay' : 'fail');
    var w = r.querySelector('#qpic .wbx'); if(w && !Q.a) setFace(w, 'sad');
  }

  /* ---------------- moving through ---------------- */
  var part = 0, step = 0, dotsEl = document.getElementById('parts'), notes = document.getElementById('notes'), nbtn = document.getElementById('nbtn'), notesOn = false;
  PARTS.forEach(function(p, i){
    var d = document.createElement('button'); d.className = 'part'; d.type = 'button'; d.title = p.name; d.setAttribute('aria-label', 'Go to ' + p.name);
    d.addEventListener('click', function(e){ e.stopPropagation(); show(i, 0); }); dotsEl.appendChild(d);
  });
  function paintNotes(){ var p = PARTS[part]; notes.innerHTML = '<b>' + esc(p.name) + '</b>' + esc(p.note || ''); notes.classList.toggle('on', notesOn); }
  nbtn.addEventListener('click', function(e){ e.stopPropagation(); notesOn = !notesOn; paintNotes(); stage.focus({ preventScroll:true }); });
  function paint(r, n, fwd){
    [].forEach.call(r.querySelectorAll('.pp'), function(el){ var s = +el.getAttribute('data-s'), only = el.hasAttribute('data-only'); el.classList.toggle('hide', !(only ? s === n : s <= n)); });
    var p = PARTS[part]; if(p.step) p.step(r, n, fwd);
  }
  function navPaint(){ var p = PARTS[part]; document.getElementById('back').disabled = part === 0 && step === 0; document.getElementById('next').disabled = part === PARTS.length - 1 && step === p.steps; }
  function show(i, at){
    stopAll();
    part = Math.max(0, Math.min(PARTS.length - 1, i));
    var p = PARTS[part];
    [].forEach.call(dotsEl.children, function(d, k){ d.classList.toggle('on', k === part); d.classList.toggle('done', k < part); });
    paintNotes();
    step = at === 'end' ? p.steps : 0;
    host.innerHTML = '';
    var r = document.createElement('div'); r.className = 'scene' + (RM ? '' : ' enter'); host.appendChild(r);
    p.build(r);
    [].forEach.call(r.querySelectorAll('.pp'), function(el){ el.classList.add('hide'); });
    r.getBoundingClientRect();
    paint(r, step, false);
    navPaint();
    setTimeout(function(){ stage.focus({ preventScroll:true }); }, 30);
  }
  function next(){
    var p = PARTS[part];
    if(step < p.steps){ step++; paint(host.firstChild, step, true); navPaint(); return; }
    if(part < PARTS.length - 1) show(part + 1, 0);
  }
  function back(){
    if(step > 0){ step--; paint(host.firstChild, step, false); navPaint(); return; }
    if(part > 0) show(part - 1, 'end');
  }
  document.getElementById('next').addEventListener('click', function(e){ e.stopPropagation(); next(); });
  document.getElementById('back').addEventListener('click', function(e){ e.stopPropagation(); back(); });
  document.getElementById('home').addEventListener('click', function(e){ e.stopPropagation(); });
  addEventListener('keydown', function(e){
    if(['ArrowRight','PageDown',' ','Enter'].indexOf(e.key) > -1){ e.preventDefault(); next(); }
    else if(['ArrowLeft','PageUp'].indexOf(e.key) > -1){ e.preventDefault(); back(); }
    else if(e.key === 'n' || e.key === 'N'){ notesOn = !notesOn; paintNotes(); }
  });
  function fromHash(){ var m = /^#part(\d+)$/.exec(location.hash); return m ? +m[1] - 1 : 0; }
  addEventListener('hashchange', function(){ show(fromHash(), 0); });
  show(fromHash(), 0);
})();
</script>
