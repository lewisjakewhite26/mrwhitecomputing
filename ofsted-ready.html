<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hartburn Ofsted Ready</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one calm column, like a phone app. A curved Orient-to-Cerulean header on the
   home screen, then one card at a time in the lesson player with a single action at the bottom. */
:root{
  --orient:#015481; --cer:#0B93E3; --alto:#DDDDDD;
  --ink:#12324A; --soft:#4A6478; --paper:#F3F7FA; --card:#FFFFFF; --tint:#E6F3FC;
  --good:#17835A; --good-bg:#E5F5EE; --miss:#B4541A; --miss-bg:#FCEFE4;
  --display:'Lora',Georgia,'Times New Roman',serif;
  --body:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--cer);outline-offset:3px;border-radius:10px}
#app{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 20px}
.view{flex:1;display:flex;flex-direction:column;animation:viewIn .38s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}

/* ---------- home header ---------- */
.hero{position:relative;background:linear-gradient(120deg,var(--orient) 0%,var(--orient) 30%,var(--cer) 100%);color:#fff;padding:22px 0 54px;border-bottom-left-radius:50% 34px;border-bottom-right-radius:50% 34px;overflow:hidden}
.hero::before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-50px;top:-90px;background:rgba(255,255,255,.13)}
.hero .wrap{position:relative}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand img{height:40px;width:auto;display:block}
.brand span{font:500 10.5px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;opacity:.95}
.hero h1{font:700 34px/1.12 var(--display);margin-top:26px;text-wrap:balance}
.hero p{margin-top:8px;font-size:16px;opacity:.95;max-width:34ch}
.herorow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:rgba(255,255,255,.25)}
.ring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 15px/1 var(--body);font-variant-numeric:tabular-nums}

/* ---------- shared bits ---------- */
.sec{font:700 20px/1.25 var(--display);color:var(--orient);margin:26px 0 4px}
.lead{color:var(--soft);margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:0 22px;border-radius:16px;background:var(--orient);color:#fff;font-weight:700;font-size:16.5px;box-shadow:0 4px 0 #013d5e;transition:transform .12s var(--ease),box-shadow .12s var(--ease),background .2s}
.btn:hover{background:#02629a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #013d5e}
.btn[disabled]{background:var(--alto);color:#7b8791;box-shadow:none;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--orient);box-shadow:none;border:2px solid var(--alto);min-height:50px}
.btn.ghost:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;transition:transform .2s var(--ease)}
.btn:hover svg.arr{transform:translateX(4px)}
.link{color:var(--orient);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:10px 4px}

/* ---------- role picker ---------- */
.roles{display:grid;gap:8px;margin-bottom:6px}
.grp{font:700 12.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--cer);margin:18px 0 8px}
.pick{padding-bottom:20px}
.dock.stick{position:sticky;bottom:0;z-index:3}
.codebox{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:320px;margin:8px 0 10px}
.codebox i{height:72px;border-radius:16px;background:var(--card);border:2px solid var(--alto);display:grid;place-items:center;font:700 30px/1 var(--display);font-style:normal;color:var(--orient);transition:border-color .15s,transform .2s var(--spring),background .2s}
.codebox i.on{border-color:var(--orient);transform:scale(1.04)}
.codebox:focus-within i.cur{border-color:var(--cer);box-shadow:0 0 0 4px rgba(11,147,227,.18)}
.codebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.codebox.bad{animation:shake .4s}
.codebox.bad i{border-color:var(--miss);background:var(--miss-bg)}
.codebox.ok i{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.codemsg{min-height:24px;color:var(--miss);font-weight:600;font-size:15px}
.btn.tickle{animation:bump .4s var(--spring)}
.step.extra .n{background:transparent;border:2px dashed var(--alto);color:var(--soft)}
.step.extra.done .n{border:0}
.role{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:var(--r);padding:13px 16px;box-shadow:0 1px 2px rgba(1,84,129,.08);font-weight:600;transition:transform .15s var(--ease),border-color .15s,box-shadow .15s;animation:rise .45s var(--ease) backwards}
.role:hover{border-color:var(--cer);box-shadow:0 6px 18px rgba(1,84,129,.12)}
.role:active{transform:scale(.98)}
.role i{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--alto);display:grid;place-items:center;transition:all .2s var(--spring)}
.role i svg{width:14px;height:14px;stroke:#fff;opacity:0;transform:scale(.3);transition:all .25s var(--spring)}
.role.on{border-color:var(--orient)}
.role.on i{background:var(--orient);border-color:var(--orient)}
.role.on i svg{opacity:1;transform:scale(1)}
.role small{display:block;font-weight:400;color:var(--soft);font-size:13.5px;margin-top:1px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* ---------- path ---------- */
.path{position:relative;display:grid;gap:10px;margin:6px 0 18px}
.step{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:var(--r);padding:14px 16px;border:2px solid transparent;box-shadow:0 1px 2px rgba(1,84,129,.08);transition:transform .15s var(--ease),box-shadow .15s,border-color .15s;animation:rise .45s var(--ease) backwards}
.step:hover{box-shadow:0 6px 18px rgba(1,84,129,.12)}
.step:active{transform:scale(.985)}
.step .n{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--tint);color:var(--orient);font-variant-numeric:tabular-nums}
.step .n svg{width:20px;height:20px;stroke:#fff}
.step.done .n{background:var(--good)}
.step.next{border-color:var(--cer)}
.step.next .n{background:var(--orient);color:#fff;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(11,147,227,.45)}60%{box-shadow:0 0 0 10px rgba(11,147,227,0)}}
.step h3{font:700 16.5px/1.25 var(--display);color:var(--orient)}
.step p{font-size:13.5px;color:var(--soft);line-height:1.4;margin-top:2px}
.step .meta{margin-left:auto;flex:none;font-size:12.5px;font-weight:600;color:var(--soft);white-space:nowrap;padding-left:6px}
.step.done .meta{color:var(--good)}
.step.next .meta{color:#fff;background:var(--orient);padding:6px 12px;border-radius:99px}
.rolebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px}
.rolebar .sec{margin:0}
.foot{margin-top:auto;padding:22px 0 26px;color:var(--soft);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- finish card ---------- */
.fin{background:var(--card);border-radius:22px;padding:22px 20px;margin:4px 0 20px;box-shadow:0 8px 28px rgba(1,84,129,.12);border-top:5px solid var(--cer)}
.fin h2{font:700 22px/1.2 var(--display);color:var(--orient)}
.fin p{color:var(--soft);margin:6px 0 14px}
.fin label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.fin input{width:100%;height:52px;border-radius:14px;border:2px solid var(--alto);padding:0 14px;font:inherit;color:var(--ink);background:#fff;margin-bottom:12px;transition:border-color .15s}
.fin input:focus{border-color:var(--cer);outline:none}
.cert{text-align:center;background:linear-gradient(160deg,#fff 0%,var(--tint) 100%);border:2px solid var(--orient);border-radius:22px;padding:26px 20px;margin:4px 0 20px;animation:pop .5s var(--spring)}
.cert .seal{width:64px;height:64px;border-radius:50%;background:var(--orient);display:grid;place-items:center;margin:0 auto 12px}
.cert .seal svg{width:32px;height:32px;stroke:#fff}
.cert small{font:500 11px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--cer)}
.cert h2{font:700 26px/1.2 var(--display);color:var(--orient);margin:8px 0 4px;overflow-wrap:anywhere}
.cert p{color:var(--ink)}
.cert .row{display:flex;justify-content:center;gap:22px;margin-top:14px;font-size:14px;color:var(--soft)}
.cert .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.cert .acts .btn{min-height:50px;font-size:15px;padding:0 12px}
.cert .acts .btn svg{width:20px;height:20px}
.cert .acts .btn[disabled]{opacity:.6}
.cert .row b{display:block;font-size:18px;color:var(--orient);font-variant-numeric:tabular-nums}
.cert .note{font-size:13px;color:var(--soft);margin-top:14px}
@keyframes pop{from{opacity:0;transform:scale(.9)}}

/* ---------- player ---------- */
.player{height:100%;position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;z-index:5}
.top{padding:14px 0 8px}
.top .wrap{display:flex;align-items:center;gap:14px}
.x{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--soft);transition:background .15s,transform .15s var(--ease)}
.x:hover{background:#e3eaf0}.x:active{transform:scale(.9)}
.x svg{width:20px;height:20px}
.bar{flex:1;display:flex;gap:4px}
.bar i{flex:1;height:8px;border-radius:99px;background:var(--alto);overflow:hidden;position:relative}
.bar i.q{background:#cfdce6}
.bar i::after{content:"";position:absolute;inset:0;border-radius:99px;background:var(--cer);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.bar i.f::after{transform:scaleX(1)}
.bar i.q.f::after{background:var(--orient)}
.streak{flex:none;font-size:12.5px;font-weight:700;color:var(--orient);background:var(--tint);padding:6px 10px;border-radius:99px;animation:pop .4s var(--spring);white-space:nowrap}
.stage{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 0 24px}
.cardwrap{animation:slideIn .34s var(--ease)}
.cardwrap.back{animation-name:slideBack}
@keyframes slideIn{from{opacity:0;transform:translateX(34px)}}
@keyframes slideBack{from{opacity:0;transform:translateX(-34px)}}
.kick{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cer);margin:8px 0 8px}
.card h2{font:700 27px/1.18 var(--display);color:var(--orient);text-wrap:balance;margin-bottom:16px}
.card p{font-size:17px;line-height:1.6;margin-bottom:12px;max-width:60ch}
.card .footn{font-size:15px;color:var(--soft);background:var(--tint);border-radius:14px;padding:13px 15px;margin-top:16px;border-left:4px solid var(--cer)}
.card .footn b{color:var(--orient)}
.stag>*{animation:rise .45s var(--ease) backwards}
.stag>*:nth-child(1){animation-delay:.06s}.stag>*:nth-child(2){animation-delay:.13s}.stag>*:nth-child(3){animation-delay:.2s}.stag>*:nth-child(4){animation-delay:.27s}.stag>*:nth-child(5){animation-delay:.34s}.stag>*:nth-child(6){animation-delay:.41s}
.items{display:grid;gap:9px}
.items li{background:var(--card);border-radius:14px;padding:13px 15px 13px 44px;position:relative;font-size:16px;line-height:1.45;box-shadow:0 1px 2px rgba(1,84,129,.07)}
.items li::before{content:"";position:absolute;left:18px;top:21px;width:9px;height:9px;border-radius:50%;background:var(--cer)}
ol.items{counter-reset:s}
ol.items li{counter-increment:s;padding-left:54px}
ol.items li::before{content:counter(s);left:13px;top:11px;width:28px;height:28px;background:var(--orient);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
.people{display:grid;gap:12px}
.people div{background:var(--card);border-radius:16px;padding:14px 16px;border-left:5px solid var(--cer);box-shadow:0 1px 2px rgba(1,84,129,.07)}
.people h3{font:700 13px/1.3 var(--body);color:var(--cer);margin-bottom:6px}
.people li{font:600 17px/1.5 var(--display);color:var(--orient)}
.route{display:grid;gap:10px}
.route div{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(1,84,129,.07)}
.route h3{font:700 13px/1.3 var(--body);color:var(--cer);margin-bottom:3px}
.route p{font:600 17px/1.4 var(--display);color:var(--orient);margin:0}
.quote{background:linear-gradient(140deg,var(--orient),#0672b5);color:#fff;border-radius:22px;padding:24px 22px}
.quote li{font:600 20px/1.35 var(--display);padding:7px 0}
.quote li+li{border-top:1px solid rgba(255,255,255,.22)}
.flip{width:100%;text-align:left;background:var(--card);border-radius:20px;padding:20px;border:2px dashed var(--cer);transition:transform .15s var(--ease),border-color .2s,background .3s;display:block}
.flip:active{transform:scale(.985)}
.flip .hint{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--orient)}
.flip .hint svg{width:22px;height:22px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.flip .think{display:block;color:var(--soft);font-size:15px;margin-top:6px}
.flip.open{border-style:solid;border-color:var(--orient);cursor:default}
.flip .ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.flip.open .ans{grid-template-rows:1fr}
.flip .ans>div{overflow:hidden}
.flip .ans h3{font:700 13px/1.3 var(--body);color:var(--cer);margin:0 0 6px;letter-spacing:.04em;text-transform:uppercase}
.flip .ans p{margin:0;font-size:17px}
.flip.open .hint,.flip.open .think{display:none}
.revnote{color:var(--soft);font-size:15px;margin-top:12px}

/* ---------- quiz ---------- */
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);border:2px solid var(--alto);border-radius:16px;padding:14px 15px;font-size:16.5px;line-height:1.4;font-weight:600;box-shadow:0 3px 0 var(--alto);transition:transform .12s var(--ease),box-shadow .12s,border-color .15s,background .2s,opacity .3s}
.opt:hover{border-color:var(--cer)}
.opt:active{transform:translateY(3px);box-shadow:0 0 0 var(--alto)}
.opt k{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--alto);display:grid;place-items:center;font:700 13.5px/1 var(--body);color:var(--soft);transition:all .2s var(--spring)}
.opt k svg{width:16px;height:16px;stroke:#fff}
.opts.lock .opt{pointer-events:none}
.opts.lock .opt:not(.ok):not(.no){opacity:.5;box-shadow:none}
.opt.ok{border-color:var(--good);background:var(--good-bg);box-shadow:0 3px 0 var(--good);animation:bump .45s var(--spring)}
.opt.ok k{background:var(--good);border-color:var(--good)}
.opt.no{border-color:var(--miss);background:var(--miss-bg);box-shadow:0 3px 0 var(--miss);animation:shake .4s}
.opt.no k{background:var(--miss);border-color:var(--miss)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.draw{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .35s .08s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;min-height:76px;font-size:18px}

/* ---------- bottom action ---------- */
.dock{padding:12px 0 calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 70%,rgba(243,247,250,0))}
.dock .wrap{display:flex;gap:10px}
.backb{flex:none;width:54px;height:54px;border-radius:16px;border:2px solid var(--alto);display:grid;place-items:center;color:var(--orient);background:var(--card);transition:transform .12s var(--ease)}
.backb:active{transform:scale(.92)}
.backb svg{width:20px;height:20px}
.fb{border-radius:22px 22px 0 0;padding:18px 0 calc(16px + env(safe-area-inset-bottom));animation:sheet .38s var(--ease);box-shadow:0 -8px 30px rgba(1,84,129,.12)}
@keyframes sheet{from{transform:translateY(100%)}}
.fb.ok{background:var(--good-bg)}.fb.no{background:var(--miss-bg)}
.fb h3{display:flex;align-items:center;gap:9px;font:700 19px/1.2 var(--display)}
.fb.ok h3{color:var(--good)}.fb.no h3{color:var(--miss)}
.fb h3 svg{width:24px;height:24px}
.fb p{margin:6px 0 14px;font-size:15.5px;line-height:1.5}
.fb.ok .btn{background:var(--good);box-shadow:0 4px 0 #0f6344}
.fb.no .btn{background:var(--miss);box-shadow:0 4px 0 #8a3f12}

/* ---------- module complete ---------- */
.doneview{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:24px 0}
.big{position:relative;width:168px;height:168px;margin:0 auto 18px}
.big svg{width:100%;height:100%;transform:rotate(-90deg)}
.big circle{fill:none;stroke-width:12}
.big .bg{stroke:var(--alto)}
.big .fg{stroke:var(--cer);stroke-linecap:round;transition:stroke-dashoffset 1.2s .25s var(--ease)}
.big b{position:absolute;inset:0;display:grid;place-items:center;font:700 44px/1 var(--display);color:var(--orient);font-variant-numeric:tabular-nums}
.big b small{font:600 15px/1 var(--body);color:var(--soft);display:block;margin-top:4px}
.doneview h2{font:700 28px/1.2 var(--display);color:var(--orient);text-wrap:balance}
.doneview p{color:var(--soft);margin:8px auto 0;max-width:34ch}
.doneact{display:grid;gap:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}

/* ---------- admin list ---------- */
.rows{display:grid;gap:8px;margin:10px 0 24px}
.rowi{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 15px;box-shadow:0 1px 2px rgba(1,84,129,.07)}
.rowi b{font:700 16px/1.3 var(--display);color:var(--orient);overflow-wrap:anywhere}
.rowi small{display:block;color:var(--soft);font-size:13px}
.rowi span{margin-left:auto;font-weight:700;color:var(--orient);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{background:var(--card);border-radius:16px;padding:20px;color:var(--soft);text-align:center}
.topbar{background:var(--orient);color:#fff;padding:16px 0}
.topbar .wrap{display:flex;align-items:center;gap:12px}
.topbar h1{font:700 20px/1.2 var(--display)}
.topbar .x{color:#fff}.topbar .x:hover{background:rgba(255,255,255,.15)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
@media (min-width:700px){
  .hero{padding-top:30px}.hero h1{font-size:42px}
  .card h2{font-size:31px}
  .stage{padding-top:26px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
/* Ofsted ready: content. Every fact here comes from the Hartburn Ofsted question prep document. */
const CORE = ["how", "team", "tells", "adults", "answer"];
const ORDER = ["how", "team", "tells", "adults", "answer", "classroom", "support", "inclusion", "early", "subject", "sendlead", "leading", "safelead", "call", "governance", "office"];
/* Tick all that apply. The path is the core blocks plus the blocks for every tick. */
const GROUPS = [
  { h: "In the classroom", ticks: [
    { id: "teach", label: "I teach classes", short: "Teaching", mods: ["classroom", "inclusion"] },
    { id: "support", label: "I support pupils in lessons", short: "Supporting pupils", mods: ["support", "inclusion"] },

      { k: "info", h: "The single central record", p: ["The single central record is one register of every adult's recruitment checks, and inspectors ask for it early on day one.", "Keep it open, complete and dated, and know who checked it last."] },
      { k: "info", h: "“Talk me through a case”", p: ["Choose a case before they do. Tell it as a story (what you knew, what you did, who you rang and what changed for the child) and have the CPOMS record ready."] },
      { k: "info", h: "When the DSL is away", p: ["Say who covers, then explain how a teaching assistant would find them at two o'clock on a Friday afternoon."] },
      { k: "info", h: "“How do you know nothing has been missed?”", p: ["A named person reads every report and follows it up. Be ready for “show me this week's concerns”, with a decision recorded against each one."] },
      { k: "list", h: "Also be ready for", items: ["How do you follow up children who are absent or off site?", "How do you work with other agencies?", "What are the main risks around Hartburn?", "How do you check filtering and monitoring?", "How do you keep vulnerable children safe?"] },
    ],
    quiz: [
      { q: "When do inspectors ask for the single central record?", opts: ["Early on day one", "At the final feedback meeting", "Only if there's a concern", "Before the notification call"], why: "They ask early on day one. Keep it open, complete and dated." },
      { q: "“Talk me through a case.” What's the best preparation?", opts: ["Choose one before they do, and have the CPOMS record ready", "Wait to see which they pick", "Describe the policy instead", "Offer the most recent one unseen"], why: "Choose one before they do. Tell it as a story and have the CPOMS record ready." },
      { q: "“Show me this week's concerns.” What should each one have?", opts: ["A decision recorded against it", "A parent's signature", "A printed copy", "A governor's initials"], why: "A named person reads every report and follows it up, with a decision recorded against each one." },
      { q: "For filtering and monitoring, be ready to say…", opts: ["Who is responsible, when we last tested it and what happens when something is flagged", "Which company sold it", "That the trust handles it", "How much it costs"], why: "Say who is responsible, when we last tested it, and what happens when something is flagged." },

if(!Array.isArray(S.roles))S.roles=[];

const canAdmin=false;

/* ---------- confetti ---------- */
const fx=$("#fx"),ctx=fx.getContext("2d");let parts=[],raf=0;
function burst(x,y,n){
  if(reduce)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#015481","#0B93E3","#7CC7F4","#DDDDDD","#FFFFFF"];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*9;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,r:3+Math.random()*5,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1,sq:Math.random()<.5});}
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.vy+=.34;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.013;
    ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
    if(p.sq)ctx.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);else{ctx.beginPath();ctx.arc(0,0,p.r*.8,0,7);ctx.fill();}
    if(p.c==="#FFFFFF"){ctx.strokeStyle="#0B93E3";ctx.lineWidth=1;ctx.stroke&&p.sq&&ctx.strokeRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);}
    ctx.restore();}
  if(parts.length)raf=requestAnimationFrame(tick);else{raf=0;ctx.clearRect(0,0,innerWidth,innerHeight);}
}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};

/* ---------- home ---------- */
let view="home",keyHandler=null;

}

    if(extras().length){h+=`<h2 class="sec">More blocks</h2><p class="lead">Optional. These don't count towards finishing.</p><div class="path">`;
      extras().forEach(id=>{const m=MODULES[id],d=S.done[id];

  app.querySelectorAll(".step").forEach(b=>b.onclick=()=>play(b.dataset.mod));

function finishHTML(){

function wireFinish(){
  const cn=$("#certname");if(cn)cn.textContent=S.name;
  const sp=$("#savepdf"),si=$("#savepng");
  if(sp)sp.onclick=()=>saveRecord("pdf",sp);
  if(si)si.onclick=()=>saveRecord("png",si);

    S.name=v;S.finishedAt=new Date().toISOString();save();btn.disabled=true;

/* ---------- save record (PNG / PDF) ---------- */
function drawRecord(){
  const W=1240,H=1754,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const O="#015481",C="#0B93E3",INK="#12324A",SOFT="#4A6478";
  const serif="Lora,Georgia,serif",sans="'Open Sans',Arial,sans-serif";
  x.fillStyle="#fff";x.fillRect(0,0,W,H);
  // header
  x.save();x.beginPath();x.moveTo(0,0);x.lineTo(W,0);x.lineTo(W,470);x.quadraticCurveTo(W/2,560,0,470);x.closePath();x.clip();
  const g=x.createLinearGradient(0,0,W,470);g.addColorStop(0,O);g.addColorStop(.35,O);g.addColorStop(1,C);x.fillStyle=g;x.fillRect(0,0,W,560);
  x.fillStyle="rgba(255,255,255,.08)";x.beginPath();x.arc(1080,90,230,0,7);x.fill();
  x.fillStyle="rgba(255,255,255,.06)";x.beginPath();x.arc(1180,400,150,0,7);x.fill();
  x.restore();
  const finish=()=>{
    x.textAlign="center";
    x.fillStyle="#fff";x.font=`600 22px ${sans}`;if("letterSpacing" in x)x.letterSpacing="6px";
    x.fillText("LEARNING FOR LIFE",W/2,400);if("letterSpacing" in x)x.letterSpacing="0px";
    const oy=90;
    // seal
    x.fillStyle="#fff";x.beginPath();x.arc(W/2,(640+oy),62,0,7);x.fill();
    x.fillStyle=O;x.beginPath();x.arc(W/2,(640+oy),52,0,7);x.fill();
    x.strokeStyle="#fff";x.lineWidth=9;x.lineCap="round";x.lineJoin="round";x.beginPath();x.moveTo(W/2-22,(640+oy));x.lineTo(W/2-6,(657+oy));x.lineTo(W/2+24,(623+oy));x.stroke();
    x.fillStyle=C;x.font=`600 24px ${sans}`;if("letterSpacing" in x)x.letterSpacing="6px";x.fillText("OFSTED READY",W/2,(770+oy));if("letterSpacing" in x)x.letterSpacing="0px";
    x.fillStyle=SOFT;x.font=`400 28px ${sans}`;x.fillText("This is to record that",W/2,(830+oy));
    // name, shrink to fit
    let fs=84;x.fillStyle=O;do{x.font=`700 ${fs}px ${serif}`;fs-=4;}while(x.measureText(S.name).width>W-200&&fs>30);
    x.fillText(S.name,W/2,(945+oy));
    x.strokeStyle="#DDDDDD";x.lineWidth=3;x.beginPath();x.moveTo(W/2-260,(990+oy));x.lineTo(W/2+260,(990+oy));x.stroke();
    x.fillStyle=INK;x.font=`400 30px ${sans}`;
    const lines=wrap(x,"has finished the Ofsted ready staff training: "+mods().length+" blocks, each with a quiz.",W-300);
    lines.forEach((l,i)=>x.fillText(l,W/2,1065+oy+i*44));
    let y=1065+oy+lines.length*44+40;
    const rl=roleLabel();
    if(rl){x.fillStyle=SOFT;x.font=`600 24px ${sans}`;x.fillText("Path",W/2,y);y+=40;x.fillStyle=INK;x.font=`400 26px ${sans}`;
      wrap(x,rl,W-320).forEach(l=>{x.fillText(l,W/2,y);y+=38;});}
    const d=new Date(S.finishedAt).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
    x.fillStyle=SOFT;x.font=`600 24px ${sans}`;x.fillText("Date completed",W/2,y+70);
    x.fillStyle=O;x.font=`700 40px ${serif}`;x.fillText(d,W/2,y+125);
    x.fillStyle=SOFT;x.font=`400 22px ${sans}`;x.fillText("Hartburn Primary School, Stockton-on-Tees",W/2,1680);
    x.fillStyle=C;x.fillRect(0,H-18,W,18);
  };
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{const lw=360,lh=lw*im.height/im.width;x.drawImage(im,(W-lw)/2,140,lw,lh);finish();res(c);};
    im.onerror=()=>{finish();res(c);};
    im.src=LOGO;
  });
}
function wrap(x,s,max){const w=s.split(" "),out=[];let l="";for(const a of w){const t=l?l+" "+a:a;if(x.measureText(t).width>max&&l){out.push(l);l=a;}else l=t;}if(l)out.push(l);return out;}
function pdfFromJpeg(jpg,w,h){
  const enc=s=>new TextEncoder().encode(s),parts=[],offs=[];let len=0;
  const add=b=>{if(typeof b==="string")b=enc(b);parts.push(b);len+=b.length;};
  const obj=(n,b)=>{offs[n]=len;add(n+" 0 obj\n");add(b);add("\nendobj\n");};
  add("%PDF-1.4\n");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
  offs[4]=len;add("4 0 obj\n<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n");add(jpg);add("\nendstream\nendobj\n");
  const cs="q 595 0 0 842 0 0 cm /Im0 Do Q";
  obj(5,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
  const xr=len;let t="xref\n0 6\n0000000000 65535 f \n";
  for(let i=1;i<=5;i++)t+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  add(t+"trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
async function saveRecord(kind,btn){
  const old=btn.innerHTML;btn.disabled=true;btn.textContent="Making it...";
  try{
    try{await Promise.all([document.fonts.load("700 40px Lora"),document.fonts.load("400 28px 'Open Sans'"),document.fonts.load("600 24px 'Open Sans'")]);}catch(e){}
    const c=await drawRecord();
    const base="Ofsted-ready-"+S.name.trim().replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"");
    const blob=kind==="pdf"
      ? pdfFromJpeg(Uint8Array.from(atob(c.toDataURL("image/jpeg",.92).split(",")[1]),ch=>ch.charCodeAt(0)),c.width,c.height)
      : await new Promise(r=>c.toBlob(r,"image/png"));
    const file=new File([blob],base+"."+kind,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia("(pointer:coarse)").matches){
      try{await navigator.share({files:[file],title:"Ofsted ready"});buzz(15);btn.innerHTML=old;btn.disabled=false;return;}catch(e){if(e&&e.name==="AbortError"){btn.innerHTML=old;btn.disabled=false;return;}}
    }
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    buzz(15);btn.textContent="Saved";setTimeout(()=>{btn.innerHTML=old;btn.disabled=false;},1600);
  }catch(e){btn.textContent="Couldn't save";setTimeout(()=>{btn.innerHTML=old;btn.disabled=false;},2000);}
}

/* ---------- player ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function play(id){
  view="play";
  const m=MODULES[id];
  const steps=m.cards.map(c=>({t:"card",c})).concat(m.quiz.map((q,i)=>({t:"quiz",q,i})));
  const nQ=m.quiz.length;let pos=0,score=0,streak=0,dir=1,retry=new Set(),answered=false;
  const el=document.createElement("div");el.className="player";
  el.innerHTML=`<div class="top"><div class="wrap"><button class="x" aria-label="Close and go back to your path">${I.close}</button><div class="bar" role="progressbar" aria-label="Progress through this block"></div><span id="streak"></span></div></div><div class="stage"><div class="wrap" id="slot"></div></div><div id="dock"></div>`;
  app.innerHTML="";app.appendChild(el);
  const slot=$("#slot",el),dock=$("#dock",el),bar=$(".bar",el),stage=$(".stage",el);
  $(".x",el).onclick=home;
  function paintBar(){bar.innerHTML=steps.map((s,i)=>`<i class="${s.t==="quiz"?"q":""} ${i<pos?"f":""}"></i>`).join("");bar.setAttribute("aria-valuenow",pos);bar.setAttribute("aria-valuemax",steps.length);}
  function fillTo(){[...bar.children].forEach((e,i)=>e.classList.toggle("f",i<pos));}
  function go(d){dir=d;pos+=d;if(pos>=steps.length)return finish();if(steps.length!==bar.children.length)paintBar();else fillTo();show();}
  function show(){
    const s=steps[pos];answered=false;stage.scrollTop=0;
    slot.innerHTML=`<div class="cardwrap ${dir<0?"back":""}">${s.t==="card"?cardHTML(s.c):quizHTML(s)}</div>`;
    if(s.t==="card"){
      const needsOpen=s.c.k==="reveal";
      dock.className="dock";
      dock.innerHTML=`<div class="wrap">${pos>0&&steps[pos-1].t==="card"?`<button class="backb" aria-label="Back">${I.back}</button>`:""}<button class="btn" id="go" ${needsOpen?"disabled":""}>${pos===m.cards.length-1?"Start the questions":"Continue"} ${I.arrow}</button></div>`;
      $("#go",dock).onclick=()=>go(1);
      const bb=$(".backb",dock);if(bb)bb.onclick=()=>go(-1);
      const fl=$(".flip",slot);
      if(fl)fl.onclick=()=>{if(fl.classList.contains("open"))return;fl.classList.add("open");fl.setAttribute("aria-expanded","true");buzz(8);$("#go",dock).disabled=false;};
      keyHandler=e=>{if(e.key==="ArrowRight"||e.key==="Enter"){const g=$("#go",dock);if(g&&!g.disabled){e.preventDefault();g.click();}else if(fl&&!fl.classList.contains("open")){e.preventDefault();fl.click();}}
        else if(e.key==="ArrowLeft"&&bb){bb.click();}};
    }else{
      dock.className="";dock.innerHTML="";
      const btns=[...slot.querySelectorAll(".opt")];
      btns.forEach(b=>b.onclick=()=>pick(s,b,btns));
      keyHandler=e=>{const n=parseInt(e.key,10);
        if(!answered&&n>=1&&n<=btns.length){btns[n-1].click();}
        else if(answered&&(e.key==="Enter"||e.key==="ArrowRight")){e.preventDefault();const g=$("#go",dock);g&&g.click();}};
    }
  }
  function pick(s,b,btns){
    if(answered)return;answered=true;
    const ok=b.dataset.ok==="1",first=!s.again;
    $(".opts",slot).classList.add("lock");
    btns.forEach(x=>{if(x.dataset.ok==="1"){x.classList.add("ok");$("k",x).innerHTML=I.check;}});
    if(ok){
      if(first)score++;streak++;
      const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,26);buzz(12);
    }else{
      b.classList.add("no");$("k",b).innerHTML=I.cross;streak=0;buzz([20,40,20]);
      if(!retry.has(s.i)){retry.add(s.i);steps.push({t:"quiz",q:s.q,i:s.i,again:true});paintBar();}
    }
    const st=$("#streak",el);st.innerHTML=streak>=2?`<span class="streak">${streak} in a row</span>`:"";
    const last=pos===steps.length-1;
    dock.className="fb "+(ok?"ok":"no");
    dock.innerHTML=`<div class="wrap" style="display:block" role="status"><h3>${ok?I.okc:I.noc}${ok?praise():"Not quite"}</h3><p>${esc(s.q.why)}${!ok&&!s.again?" You'll see this one again at the end.":""}</p><button class="btn" id="go">${last?"Finish":"Continue"} ${I.arrow}</button></div>`;
    $("#go",dock).onclick=()=>go(1);
    setTimeout(()=>{const g=$("#go",dock);g&&g.focus({preventScroll:true});},60);
  }
  const P=["Correct","That's right"];let pi=0;const praise=()=>P[pi++%P.length];
  function quizHTML(s){
    const q=s.q,n=s.i+1;
    const kick=s.again?"One more go":`Question ${n} of ${nQ}`;
    let opts;
    if("tf" in q){opts=`<div class="opts tf">${["True","False"].map((t,i)=>`<button class="opt" data-ok="${(i===0)===q.tf?1:0}">${t}<k style="display:none"></k></button>`).join("")}</div>`;
      return `<div class="card"><p class="kick">${kick} · True or false?</p><h2>${esc(q.q)}</h2>${opts}</div>`;}
    const sh=shuffle(q.opts.map((t,i)=>({t,ok:i===0})));
    opts=`<div class="opts stag">${sh.map((o,i)=>`<button class="opt" data-ok="${o.ok?1:0}"><k>${"ABCD"[i]}</k><span>${esc(o.t)}</span></button>`).join("")}</div>`;
    return `<div class="card"><p class="kick">${kick}</p><h2>${esc(q.q)}</h2>${opts}</div>`;
  }
  function finish(){
    const prev=S.done[id];
    S.done[id]={score:prev?Math.max(prev.score,score):score,total:nQ,at:Date.now()};save();
    keyHandler=null;
    const list=mods(),nextId=list.find(x=>!S.done[x]);
    const msg=score===nQ?"Every one right first time.":score>=nQ-1?"One to look at again.":"You've now seen the right answer to each one you missed.";
    el.innerHTML=`<div class="wrap" style="flex:1;display:flex;flex-direction:column"><div class="doneview">${ringHTML("big",score/nQ,`<span><span id="cnt">0</span>/${nQ}<small>first time</small></span>`,72)}<h2>${esc(m.title)}: done</h2><p>${msg}</p></div><div class="doneact">${nextId?`<button class="btn" id="nx">Next: ${esc(MODULES[nextId].title)} ${I.arrow}</button><button class="btn ghost" id="hm">Back to my path</button>`:`<button class="btn" id="hm">${allDone()?"Finish up":"Back to my path"} ${I.arrow}</button>`}</div></div>`;
    runRings();
    const cnt=$("#cnt",el);let c=0;const iv=setInterval(()=>{if(c>=score){clearInterval(iv);cnt.textContent=score;return;}c++;cnt.textContent=c;},reduce?0:220);
    setTimeout(()=>burst(innerWidth/2,innerHeight*.32,score===nQ?130:70),reduce?0:500);buzz(18);
    const nx=$("#nx",el);if(nx)nx.onclick=()=>play(nextId);
    $("#hm",el).onclick=home;
    keyHandler=e=>{if(e.key==="Enter"){(nx||$("#hm",el)).click();}};
  }
  /* swipe between learn cards */
  let sx=0,sy=0;
  stage.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  stage.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<70||Math.abs(dy)>50||steps[pos].t!=="card")return;
    if(dx<0){const g=$("#go",dock);if(g&&!g.disabled)g.click();}else{const b=$(".backb",dock);if(b)b.click();}},{passive:true});
  paintBar();show();
}
function cardHTML(c){
  let b="";
  if(c.k==="info")b=`<div class="stag">${c.p.map(p=>`<p>${p}</p>`).join("")}</div>`;
  else if(c.k==="list"||c.k==="steps"){const tag=c.k==="steps"?"ol":"ul";
    b=`${c.intro?`<p>${c.intro}</p>`:""}<${tag} class="items stag">${c.items.map(x=>`<li>${x}</li>`).join("")}</${tag}>`;}
  else if(c.k==="people")b=`<div class="people stag">${c.groups.map(g=>`<div><h3>${esc(g[0])}</h3><ul>${g[1].map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`).join("")}</div>`;
  else if(c.k==="route")b=`<div class="route stag">${c.rows.map(r=>`<div><h3>${esc(r[0])}</h3><p>${esc(r[1])}</p></div>`).join("")}</div>`;
  else if(c.k==="quote")return `<div class="card"><h2>${esc(c.h)}</h2><ul class="quote stag">${c.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>`;
  else if(c.k==="reveal")return `<div class="card"><p class="kick">An inspector asks</p><h2>${esc(c.h)}</h2><button class="flip" aria-expanded="false"><span class="hint">${I.tap}Tap to see a strong answer</span><span class="think">Have a go at answering before you look.</span><span class="ans"><div><h3>A strong answer</h3><p>${esc(c.a)}</p></div></span></button>${c.note?`<p class="revnote">${esc(c.note)}</p>`:""}</div>`;
  return `<div class="card"><h2>${esc(c.h)}</h2>${b}${c.foot?`<p class="footn">${c.foot}</p>`:""}</div>`;
}

document.addEventListener("keydown",e=>{if(e.target&&e.target.tagName==="INPUT")return;if(keyHandler)keyHandler(e);});
function gate(){
  view="gate";keyHandler=null;
  app.innerHTML=`<div class="view"><header class="hero"><div class="wrap"><div class="brand"><img src="${LOGO}" alt="Hartburn Primary School"><span>Learning for Life</span></div><h1>Ofsted ready</h1><p>For Hartburn staff and governors.</p></div></header><main class="wrap gate"><h2 class="sec"><label for="code">Staff passcode</label></h2><p class="lead">Enter the four-digit passcode you were given.</p><div class="codebox" id="codebox"><i></i><i></i><i></i><i></i><input id="code" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="4" aria-describedby="codemsg"></div><p class="codemsg" id="codemsg" role="status"></p></main></div>`;
  const inp=$("#code"),box=$("#codebox"),cells=[...box.querySelectorAll("i")],msg=$("#codemsg");
  const paint=()=>cells.forEach((c,i)=>{c.textContent=inp.value[i]||"";c.classList.toggle("on",i<inp.value.length);c.classList.toggle("cur",i===inp.value.length);});
  inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,"").slice(0,4);msg.textContent="";paint();
    if(inp.value.length<4)return;
    let h=5381;for(const ch of "hartburn:"+inp.value)h=((h<<5)+h+ch.charCodeAt(0))>>>0;
    if(h===1306008053){S.open=true;save();box.classList.add("ok");buzz(15);const r=box.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,40);setTimeout(home,reduce?0:550);}
    else{box.classList.remove("bad");void box.offsetWidth;box.classList.add("bad");buzz([20,40,20]);msg.textContent="That passcode isn't right. Try again.";setTimeout(()=>{inp.value="";paint();},380);}};
  paint();setTimeout(()=>inp.focus({preventScroll:true}),300);
}
S.open?home():gate();
})();
</script>
