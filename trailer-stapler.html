<!--
  The Evil Stapler: a forty second horror trailer for a Whiteflix programme
  that does not exist yet. It is the worked example for Year 5/6 Video
  production Lesson 4, so every trailer beat is in it: hook, who, problem,
  build, title card.

  Built like the Whiteflix cartoons: drawn in code, every frame worked out
  from the time alone, so pausing and dragging the bar just work, and the
  sounds are cues that fire as playback passes them. Mr White is the same
  cut-out photo with the same body and the same five faces.

    trailer-stapler.html        press play
    trailer-stapler.html#t12.5  a still of that second, for checking
-->

  :root{--red:#E11B22;--ui:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #frame{position:relative;width:1920px;height:1080px;flex:none;transform-origin:center center;background:#000;overflow:hidden}
  svg#sv{position:absolute;inset:0;width:1920px;height:1080px;display:block}
  .cap{position:absolute;left:0;right:0;bottom:70px;text-align:center;pointer-events:none}
  .cap span{display:inline-block;font-size:44px;line-height:1.25;letter-spacing:.01em;color:#fff;text-shadow:0 0 6px #000,0 0 14px #000,0 2px 3px #000,0 0 28px rgba(0,0,0,.9)}
  .cap:empty{display:none}
  .start{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;cursor:pointer;z-index:5}
  .start .go{width:170px;height:170px;border-radius:50%;border:3px solid #2a2a2a;display:grid;place-items:center;color:var(--red);background:radial-gradient(circle,#1c0607,#000 70%);animation:pulse 2.6s infinite}
  .start .go svg{width:70px;height:70px;fill:currentColor}
  .start p{margin:0;color:#6a6a6a;font-size:28px;letter-spacing:.3em;text-transform:uppercase}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(225,27,34,.45)}70%{box-shadow:0 0 0 40px rgba(225,27,34,0)}100%{box-shadow:0 0 0 0 rgba(225,27,34,0)}}
  .bar{position:absolute;left:0;right:0;bottom:0;height:78px;padding:0 34px;display:flex;align-items:center;gap:26px;background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .3s;z-index:4}
  #frame.show .bar,#frame.paused .bar{opacity:1}
  .bar button{width:48px;height:48px;display:grid;place-items:center}
  .bar svg{width:34px;height:34px;fill:#fff}
  .trk{position:relative;flex:1;height:8px;background:#4a4a4a;border-radius:4px;cursor:pointer}
  .trk i{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:4px;width:0}
  .trk b{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--red);left:0}
  .tm{font-size:26px;color:#d0d0d0;font-variant-numeric:tabular-nums;min-width:140px;text-align:right}
</style>

<script>
(function(){
  var FLOOR = 976, INTRO = 6, TAU_END = 42.5;
  // story time (tau) is stretched onto real time so the trailer breathes: slowest in the dark, quickest in the chase
  var PRE = 11.6, PRE_K = 1.45;
  var SEG = [[-PRE,0,PRE_K],[0,3.8,1.7],[3.8,7.6,1.6],[7.6,11.2,1.5],[11.2,12,1.5],[12,14,1.6],[14,15.9,1.7],[15.9,17.8,2],[17.8,19.2,2],[19.2,24.5,1.4],[24.5,25.4,2],[25.4,30.2,1.4],[30.2,31.4,1.3],[31.4,39.8,1.2],[39.8,42.5,1.3]];
  var KEYS = [[INTRO,-PRE]], acc = INTRO;
  SEG.forEach(function(g){ acc += (g[1] - g[0]) * g[2]; KEYS.push([acc, g[1]]); });
  var DUR = acc;
  function tauOf(T){
    if(T < INTRO) return -99;
    for(var i = 1; i < KEYS.length; i++){ if(T <= KEYS[i][0]){ var p = (T - KEYS[i - 1][0]) / (KEYS[i][0] - KEYS[i - 1][0]); return KEYS[i - 1][1] + (KEYS[i][1] - KEYS[i - 1][1]) * p; } }
    return TAU_END;
  }
  var WF_IMG = { face_smile:'whiteflix/img/face_smile.webp', face_stare:'whiteflix/img/face_stare.webp', face_blank:'whiteflix/img/face_blank.webp', face_shock:'whiteflix/img/face_shock.webp', face_sad:'whiteflix/img/face_sad.webp' };
  window.WF_IMG = WF_IMG;
  var SKIN = '#eab18f', SKIN_LINE = '#c98f6e', artUid = 0;
  function faceImg(k, H, extra){
    var src = window.WF_IMG && WF_IMG['face_' + k];
    if(!src) return '';
    var w = H * .74;
    return '<image href="' + src + '" x="' + (-w / 2).toFixed(1) + '" y="' + (-H) + '" width="' + w.toFixed(1) + '" height="' + H + '" preserveAspectRatio="xMidYMax meet"' + (extra || '') + '/>';
  }
  function hand(x, y, kind, ang){
    var g = '<g transform="translate(' + x + ' ' + y + ') rotate(' + (ang || 0) + ')">';
    if(kind === 'thumb') g += '<rect x="-4" y="-58" width="20" height="44" rx="10" fill="' + SKIN + '" stroke="' + SKIN_LINE + '" stroke-width="3"/>';
    if(kind === 'point') g += '<rect x="-9" y="-62" width="18" height="46" rx="9" fill="' + SKIN + '" stroke="' + SKIN_LINE + '" stroke-width="3"/>';
    g += '<circle r="27" fill="' + SKIN + '" stroke="' + SKIN_LINE + '" stroke-width="3"/>';
    if(kind === 'thumb') g += '<path d="M-14 -8h22M-14 4h22M-14 16h20" stroke="' + SKIN_LINE + '" stroke-width="3" stroke-linecap="round"/>';
    return g + '</g>';
  }
  function armPath(sx, sy, a){
    // a = [elbowX, elbowY, handX, handY, handKind, inFront, handAngle]
    var d = 'M' + sx + ' ' + sy + ' L' + a[0] + ' ' + a[1] + ' L' + a[2] + ' ' + a[3];
    return '<path d="' + d + '" stroke="#c3ccd9" stroke-width="48" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="' + d + '" stroke="#f3f6fb" stroke-width="41" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
      hand(a[2], a[3], a[4], a[6]);
  }
  // o: x, y, s (scale), face, H (head height), lean, arms [viewer's left, viewer's right],
  // behind / after (extra markup in his own coordinates), badge (a bigger, shinier pass)
  function mwBody(o){
    var H = o.H || 330, back = '', front = '';
    [[-96, 44], [96, 44]].forEach(function(sh, i){
      var a = o.arms[i], m = armPath(sh[0], sh[1], a);
      if(a[5]) front += m; else back += m;
    });
    var s = '<g transform="translate(' + o.x + ' ' + o.y + ') rotate(' + (o.lean || 0) + ') scale(' + o.s + ')">' +

    var fx = window.__face.x, body = '<rect x="' + f1(fx - 120) + '" y="850" width="240" height="230" rx="40" fill="#eab18f"/><path d="M' + f1(fx - 520) + ' 1080 Q' + f1(fx - 470) + ' 1000 ' + f1(fx - 200) + ' 960 L' + f1(fx + 200) + ' 960 Q' + f1(fx + 470) + ' 1000 ' + f1(fx + 520) + ' 1080 Z" fill="#f3f6fb"/><path d="M' + f1(fx - 36) + ' 1000 L' + f1(fx + 36) + ' 1000 L' + f1(fx + 24) + ' 1080 L' + f1(fx - 24) + ' 1080 Z" fill="#d8443c"/>';
    return '<rect width="1920" height="1080" fill="#0d0a10"/><ellipse cx="1500" cy="500" rx="900" ry="700" fill="url(#gRed)" opacity=".4"/><ellipse cx="500" cy="540" rx="700" ry="600" fill="url(#gLamp)" opacity=".5"/>' + body;
  }

  /* ---------- the title card ---------- */
  function titleScene(t){
    var q = t - 25.4, s = '<rect width="1920" height="1080" fill="#000"/>';
    var a1 = seg(q, .5, 1.3), a2 = seg(q, 1.5, 2.2);
    s += '<text x="880" y="432" text-anchor="end" font-family="Bebas Neue,Impact,sans-serif" font-size="64" letter-spacing="10" fill="#bdbdbd" opacity="' + a1.toFixed(2) + '">COMING SOON TO</text>';
    s += '<g transform="translate(930 392)" opacity="' + a1.toFixed(2) + '"><path d="M0 0L30 108L60 40L90 108L120 0" fill="none" stroke="#E11B22" stroke-width="22" transform="scale(.9)"/><text x="140" y="86" font-family="Bebas Neue,Impact,sans-serif" font-size="104" letter-spacing="4" fill="#E11B22">MR WHITEFLIX</text></g>';
    var g = q > 2.3 && q < 2.45 ? 14 : 0, fr = Math.floor(t * 30), jx = (hs(fr) - .5) * g;
    s += '<text x="' + f1(960 + jx) + '" y="770" text-anchor="middle" font-family="Bebas Neue,Impact,sans-serif" font-size="270" letter-spacing="8" fill="#f1efe6" opacity="' + seg(q, 2.2, 2.35).toFixed(2) + '" style="filter:drop-shadow(0 0 ' + (10 + Math.sin(q * 5) * 6).toFixed(0) + 'px #e11b22)">THE EVIL STAPLER</text>';
    var eyes = seg(q, 3.1, 3.4);
    s += '<g transform="translate(1560 860) scale(.55)" opacity="' + eyes.toFixed(2) + '">' + stapler(0, 1, -1, 0) + '</g>';
    return s;
  }

  /* ---------- the lunge ---------- */
  function lungeScene(t){
    var q = seg(t, 30.2, 30.7), sc = 3.2 + q * 3.2, snap = t >= 30.6 ? 0 : 38 - q * 6;
    var fr = Math.floor(t * 30), sh = t >= 30.6 ? 24 : 5;
    return '<rect width="1920" height="1080" fill="#14090a"/><ellipse cx="960" cy="560" rx="900" ry="600" fill="url(#gRed)" opacity=".6"/><g transform="translate(' + f1(960 + (hs(fr) - .5) * sh) + ' ' + f1(780 + (hs(fr + 5) - .5) * sh) + ') scale(' + sc.toFixed(2) + ') scale(-1 1)">' + stapler(snap, 1, -1, 0) + '</g>';
  }

  /* ---------- the corridor chase ---------- */
  function corrScene(t){
    var T0 = 31.4, scrollOn = 32.8, scroll = t > scrollOn ? (t - scrollOn) * 760 : 0;
    var s = '<rect width="1920" height="1080" fill="url(#gCorr)"/>';
    // ceiling lights
    for(var i = -1; i < 5; i++){
      var lx = i * 560 - (scroll * .5) % 560, flick = (hs(Math.floor(t * 12) + i) > .8) ? .35 : 1;
      s += '<rect x="' + f1(lx) + '" y="40" width="280" height="26" rx="6" fill="#dff1ff" opacity="' + flick.toFixed(2) + '"/>';
    }
    // lockers
    for(var k = -1; k < 7; k++){
      var x = k * 340 - (scroll % 340), tone = (Math.floor((scroll / 340) + k) % 2) ? '#264a74' : '#2c5282';
      s += '<rect x="' + f1(x) + '" y="190" width="318" height="760" rx="5" fill="' + tone + '" stroke="#14294a" stroke-width="5"/>';
      for(var v = 0; v < 4; v++) s += '<rect x="' + f1(x + 58) + '" y="' + (236 + v * 22) + '" width="200" height="8" rx="3" fill="#14294a"/>';
      s += '<rect x="' + f1(x + 262) + '" y="520" width="12" height="60" rx="5" fill="#9fb4d2"/>';
    }
    // the doorway they came out of
    var dx = 120 - scroll;
    if(dx > -500){
      s += '<rect x="' + f1(dx) + '" y="170" width="330" height="806" fill="#f6d28f"/><rect x="' + f1(dx) + '" y="170" width="330" height="806" fill="none" stroke="#5a3b22" stroke-width="16"/>' +
        '<polygon points="' + f1(dx + 330) + ',170 ' + f1(dx + 330 + 120) + ',210 ' + f1(dx + 330 + 120) + ',976 ' + f1(dx + 330) + ',976" fill="#7a4f2c" stroke="#4a2e17" stroke-width="6"/>';
    }
    // floor
    s += '<rect y="' + FLOOR + '" width="1920" height="104" fill="#16212f"/><rect y="' + FLOOR + '" width="1920" height="10" fill="#3a5578"/>';
    for(var f = 0; f < 8; f++) s += '<rect x="' + f1(f * 300 - (scroll % 300)) + '" y="' + (FLOOR + 30) + '" width="140" height="8" rx="4" fill="#233246"/>';
    // Mr White
    var mx = kf(t, [[T0, 380], [T0 + 1.5, 1250]], out), ph = t * 12.5, bob = -Math.abs(Math.sin(ph)) * 18, jump = 0, shockFace = false, hitNow = -1;
    HITS.forEach(function(h, i){ if(t >= h && t < h + .55){ jump = -Math.sin(seg(t, h, h + .55) * Math.PI) * 120; shockFace = true; hitNow = i; } });
    var legA = Math.sin(ph) * 34, legB = -legA;
    var legs = '<g transform="rotate(' + f1(legB) + ' 12 296)"><rect x="-20" y="296" width="62" height="262" rx="22" fill="#222a3b"/><ellipse cx="26" cy="566" rx="50" ry="20" fill="#14161a"/></g>' +
      '<g transform="rotate(' + f1(legA) + ' -12 296)"><rect x="-42" y="296" width="62" height="262" rx="22" fill="#2b3448"/><ellipse cx="-2" cy="566" rx="50" ry="20" fill="#14161a"/></g>';
    var arms = [[-150, 120, f1(-120 + Math.sin(ph) * 74) * 1, 200 - Math.cos(ph) * 22, 'fist', false], [150, 120, 120 - Math.sin(ph) * 74, 200 + Math.cos(ph) * 22, 'fist', true]];
    if(shockFace) arms = [[-200, 60, -226, -70, 'fist', false], [200, 60, 226, -70, 'fist', true]];
    var stuck = '';
    var spots = [[-58, 332], [-38, 356], [-62, 372], [-44, 322], [-30, 346]];
    HITS.forEach(function(h, i){ if(t >= h + .2) stuck += '<path d="M' + (spots[i][0] - 9) + ' ' + spots[i][1] + ' v-8 h18 v8" stroke="#e0e0e0" stroke-width="4" fill="none" stroke-linecap="round" transform="rotate(' + (i * 12 - 20) + ' ' + spots[i][0] + ' ' + spots[i][1] + ')"/>'; });
    var sc = .72, by = FLOOR - 580 * sc + bob + jump;
    // the body origin is the chin, so the feet land on the floor
    s += mwBody({ x:mx, y:by, s:sc, lean:10, face:null, arms:arms, behind:legs, after:stuck });
    window.__face = { x:mx, y:by, s:sc, k:'shock', H:330, lean:10 };
    // the stapler
    var SCS = 1.4, sx = kf(t, [[T0 + .5, 60], [T0 + 1.8, 800], [T0 + 2.6, 700]], out), lunge = 0;
    HITS.forEach(function(h){ if(t >= h - .25 && t < h + .3) lunge = Math.sin(seg(t, h - .25, h + .3) * Math.PI) * 90; });
    if(t >= 38.8) sx += (t - 38.8) * 900;
    var hop = -Math.abs(Math.sin(t * 8.6)) * 60, open = 12 + Math.abs(Math.sin(t * 14)) * 24;
    var hitLocal = -1; HITS.forEach(function(h, i){ if(t >= h - .05 && t < h + .12) hitLocal = i; });
    if(hitLocal > -1) open = 0;
    var sy = FLOOR + hop * (t < 38.8 ? 1 : 1);
    s += '<g transform="translate(' + f1(sx + lunge) + ' ' + f1(sy) + ') scale(-' + SCS + ' ' + SCS + ')">' + stapler(open, 1, -1, 0) + '</g>';
    // flying staples, and the noise they make
    HITS.forEach(function(h, i){
      if(t >= h && t < h + .22){
        var q = seg(t, h, h + .22), x0 = sx + lunge + 136 * SCS, y0 = sy - 60 * SCS, x1 = mx - 62 * sc, y1 = by + 350 * sc;
        s += '<path d="M-12 0 v-12 h24 v12" stroke="#f0f0f0" stroke-width="6" fill="none" stroke-linecap="round" transform="translate(' + f1(x0 + (x1 - x0) * q) + ' ' + f1(y0 + (y1 - y0) * q) + ') rotate(' + f1(q * 360) + ')"/>';
      }
        });
    return s;
  }

  /* ---------- the end tag ---------- */
  function endScene(t){
    var q = t - 39.8, a = 1 - seg(q, 2.2, 2.6);
    return '<rect width="1920" height="1080" fill="#000"/><g opacity="' + a.toFixed(2) + '"><g transform="translate(960 400) scale(2.4) translate(-60 -50)">' + ribbon(q - .1) + '</g><text x="960" y="760" text-anchor="middle" font-family="Bebas Neue,Impact,sans-serif" font-size="150" letter-spacing="6" fill="#E11B22" opacity="' + seg(q, .9, 1.5).toFixed(2) + '">MR WHITEFLIX</text></g>';
  }

  /* ---------- the Whiteflix ribbon and the start-up, as on the original ---------- */
  var LINES = [[10, 8, 35, 92, 88, 'wA'], [35, 92, 60, 30, 67, 'wB'], [60, 30, 85, 92, 67, 'wA'], [85, 92, 110, 8, 88, 'wB']];
  function ribbon(q, sc, stroke){
    var r = '';
    LINES.forEach(function(L, i){
      var p = seg(q, i * .22, i * .22 + .3), p2 = p * p * (3 - 2 * p);
      r += '<line x1="' + L[0] + '" y1="' + L[1] + '" x2="' + L[2] + '" y2="' + L[3] + '" stroke="' + (stroke || 'url(#' + L[5] + ')') + '" stroke-width="20" stroke-dasharray="' + L[4] + '" stroke-dashoffset="' + f1(L[4] * (1 - p2)) + '"/>';
    });
    return r;
  }
  var STREAK_COLS = ['#E11B22', '#ff4d6d', '#b20710', '#ff8a3d', '#7a0409', '#ff2e63', '#c9184a', '#ffb4a2'];
  var STREAKS = (function(){
    var a = [], x = 0, i = 0;
    while(x < 1920 + 60){ var w = 6 + hs(i + 40) * 42; a.push([x, w, i % 8, (i + 3) % 8, 20 + hs(i + 9) * 30]); x += w + 5; i++; }
    return a;
  })();
  function introScene(T){
    var s = '<rect width="1920" height="1080" fill="#000"/>';
    // the light streaks of the fly-through
    var zs = seg(T, 2, 3.15), sop = zs < .25 ? zs / .25 : zs < .8 ? 1 - (zs - .25) * .18 : .9 * (1 - (zs - .8) / .2);
    if(zs > 0 && zs < 1){
      var g = seg(T, 2, 3.1), gr = out(g), off = (1920 - (STREAKS[STREAKS.length - 1][0] + STREAKS[STREAKS.length - 1][1])) / 2;
      s += '<g opacity="' + sop.toFixed(2) + '">';
      STREAKS.forEach(function(k, i){
        var c1 = STREAK_COLS[k[2]], c2 = STREAK_COLS[k[3]];
        s += '<rect x="' + f1(k[0] + off) + '" y="0" width="' + f1(k[1]) + '" height="1080" fill="url(#st' + k[2] + '_' + k[3] + ')" transform="translate(0 540) scale(1 ' + gr.toFixed(3) + ') translate(0 -540)"/>';
      });
      s += '</g>';
    }
    // the W, drawn stroke by stroke, then flown through
    if(T >= .5 && T < 3.05){
      var z = seg(T, 2, 3), zz = Math.pow(z, 3), sc = 1.98 * (1 + 15 * zz);
      s += '<g opacity="' + (T < 2 ? 1 : 1 - zz).toFixed(3) + '" transform="translate(960 540) scale(' + sc.toFixed(3) + ') translate(-60 -50)">' + ribbon(T - .5) + '</g>';
    }
    // the name settles in
    if(T >= 3){
      var q = T - 3, e = seg(q, 0, 1.3), eo = 1 - Math.pow(1 - e, 4), fo = 1 - seg(T, 5.2, 5.9);
      s += '<text x="960" y="' + f1(580 + (1 - eo) * 10) + '" text-anchor="middle" font-family="Bebas Neue,Impact,sans-serif" font-size="190" fill="#E11B22" letter-spacing="' + f1(2 + (1 - eo) * 54) + '" opacity="' + (eo * fo).toFixed(3) + '" transform="translate(960 540) scale(' + (1 + (1 - eo) * .25).toFixed(3) + ') translate(-960 -540)" style="filter:drop-shadow(0 0 40px rgba(225,27,34,.35))">MR WHITEFLIX</text>';
    }
    return s;
  }

  /* ---------- the title cards over the dark ---------- */
  function cards(t){
    var s = '';
    if(t < 24.5) s += '<g transform="translate(64 46) scale(.5)" opacity=".92">' + ribbon(9, 1, '#E11B22') + '</g>';
    if(t < 3.8){
      var a = seg(t, .8, 1.3) * (1 - seg(t, 2.1, 2.4)), b = seg(t, 2.4, 2.9) * (1 - seg(t, 3.5, 3.8));
      s += '<text x="960" y="560" text-anchor="middle" font-family="Bebas Neue,Impact,sans-serif" font-size="120" letter-spacing="6" fill="#e9e9e2" opacity="' + a.toFixed(2) + '">IN A CLASSROOM,</text>' +
        '<text x="960" y="560" text-anchor="middle" font-family="Bebas Neue,Impact,sans-serif" font-size="120" letter-spacing="6" fill="#e9e9e2" opacity="' + b.toFixed(2) + '">NOBODY CAN HEAR YOU MARK.</text>';
    }
    return s;
  }

  /* ---------- the camera ---------- */
  function camT(c){ return 'translate(960 540) scale(' + c[0].toFixed(4) + ') translate(' + f1(-c[1]) + ' ' + f1(-c[2]) + ')'; }
  var E = {};
  function renderTau(t){
    var sh = shotAt(t), dyn = '', cam = [1, 960, 540], fc = null;
    window.__face = null; window.__glow = '';
    if(sh === 'desk'){
      var k = kf(t, [[3.8, 1], [7.6, 1.06], [11.2, 1.06], [17.8, 1.16], [19.2, 1.2]], lin);
      cam = [k, kf(t, [[3.8, 960], [17.8, 900]], lin), kf(t, [[3.8, 540], [17.8, 500]], lin)];
      dyn = deskScene(t);
    } else if(sh === 'pre'){ var u = t + PRE; cam = [1 + u * .006, 960, 540]; dyn = preScene(u); }
    else if(sh === 'page') dyn = pageScene(t);
    else if(sh === 'cuA') dyn = cuAScene(t);
    else if(sh === 'cuM') dyn = cuMScene(t);
    else if(sh === 'title') dyn = titleScene(t);
    else if(sh === 'lunge') dyn = lungeScene(t);
    else if(sh === 'corr') dyn = corrScene(t);
    else if(sh === 'end') dyn = endScene(t);
    else dyn = '';
    E.dyn.innerHTML = dyn;
    E.camA.setAttribute('transform', camT(cam)); E.camB.setAttribute('transform', camT(cam));
    var f = window.__face;
    if(f){
      var w = f.H * .74;
      E.face.setAttribute('transform', 'translate(' + f1(f.x) + ' ' + f1(f.y) + ') rotate(' + (f.lean || 0) + ') scale(' + f.s + ')');
      E.face.innerHTML = '<image href="' + WF_IMG['face_' + f.k] + '" x="' + (-w / 2).toFixed(1) + '" y="' + (-f.H) + '" width="' + w.toFixed(1) + '" height="' + f.H + '" preserveAspectRatio="xMidYMax meet"/>';
    } else E.face.innerHTML = '';
    E.glow.innerHTML = sh === 'desk' ? window.__glow : '';
    E.dark.setAttribute('opacity', sh === 'desk' ? darkAt(t) : 0);
    var fl = 0;
    if(inR(t, 21.7, 21.85)) fl = 1; else if(inR(t, 24.2, 24.4)) fl = 1; else if(inR(t, 30.6, 30.7)) fl = .8;
    E.flash.setAttribute('opacity', fl);
    E.cards.innerHTML = cards(t);
    var c = caption(curT);
    if(c !== E.capK){ E.cap.innerHTML = c ? '<span>' + c + '</span>' : ''; E.capK = c; }
  }

  function render(T){
    curT = T;
    if(T >= INTRO){ renderTau(tauOf(T)); return; }
    E.dyn.innerHTML = introScene(T); E.face.innerHTML = ''; E.glow.innerHTML = ''; E.cards.innerHTML = '';
    E.dark.setAttribute('opacity', 0); E.flash.setAttribute('opacity', 0);
    E.camA.setAttribute('transform', ''); E.camB.setAttribute('transform', '');
    if(E.capK){ E.cap.innerHTML = ''; E.capK = ''; }
  }

  /* ---------- the page and the player ---------- */
  var $ = function(i){ return document.getElementById(i); };
  ['dyn','face','glow','dark','flash','cards','camA','camB','cap','frame','trk','trki','trkb','tm','ppi','start'].forEach(function(i){ E[i] = $(i); });
  var PLAY = '<path d="M232.4,114.49,88.32,26.35a16,16,0,0,0-16.2-.3A15.86,15.86,0,0,0,64,39.87V216.13A15.94,15.94,0,0,0,80,232a16.07,16.07,0,0,0,8.36-2.35L232.4,141.51a15.81,15.81,0,0,0,0-27Z"/>';
  var PAUSE = '<path d="M216,48V208a16,16,0,0,1-16,16H160a16,16,0,0,1-16-16V48a16,16,0,0,1,16-16h40A16,16,0,0,1,216,48ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Z"/>';
  var T = 0, playing = false, last = 0, raf = 0, hideT = 0;
  // drop an mp3 at audio/stapler-vo.mp3 and it plays in time with the picture; without one the trailer stays silent apart from the effects
  var TRK = [ { url:'audio/stapler-vo.mp3', buf:null, src:null, load:false, vol:1 }, { url:'audio/stapler-music.mp3', buf:null, src:null, load:false, vol:1 } ];
  function trkLoad(k){
    var c = ac(); if(!c || k.buf || k.load) return; k.load = true;
    try {
      var u = k.url;
      var getAB = u.indexOf('data:') === 0
        ? new Promise(function(res){ var s = atob(u.slice(u.indexOf(',') + 1)), a = new Uint8Array(s.length); for(var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); res(a.buffer); })
        : fetch(u).then(function(r){ return r.arrayBuffer(); });
      getAB.then(function(ab){
        return new Promise(function(res, rej){ var p = c.decodeAudioData(ab, res, rej); if(p && p.then) p.then(res, rej); });
      }).then(function(buf){ k.buf = buf; if(playing) voSync(true); }).catch(function(){ k.load = false; });
    } catch(e){ k.load = false; }
  }
  function voSync(on){
    var c = ac();
    TRK.forEach(function(k){
      try { if(k.src){ k.src.stop(); k.src.disconnect(); k.src = null; } } catch(e){ k.src = null; }
      if(!on || !c) return;
      if(!k.buf){ trkLoad(k); return; }
      if(T >= k.buf.duration - .05) return;
      k.src = c.createBufferSource(); k.src.buffer = k.buf; k.src.connect(c.destination); k.src.start(0, T);
    });
  }
  function fmt(s){ s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + pad(s % 60); }
  function ui(){
    var p = T / DUR * 100;
    E.trki.style.width = p + '%'; E.trkb.style.left = p + '%'; E.tm.textContent = fmt(T) + ' / ' + fmt(DUR);
    E.ppi.innerHTML = playing ? PAUSE : PLAY;
    E.frame.classList.toggle('paused', !playing && T > 0);
  }
  function tick(now){
    if(!playing) return;
    var dt = Math.min(.1, (now - last) / 1000); last = now;
    var prev = T; T = Math.min(DUR, T + dt);
    cues(prev, T); render(T); ui();
    if(T >= DUR){ playing = false; voSync(false); ui(); return; }
    raf = requestAnimationFrame(tick);
  }
  function play(){
    if(T >= DUR - .05) T = 0;
    busOn(); playing = true; last = performance.now(); E.start.style.display = 'none'; voSync(true);
    cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); ui();
  }
  function pause(){ playing = false; cancelAnimationFrame(raf); hush(); voSync(false); ui(); }
  function seek(t){ T = cl(t, 0, DUR); hush(); render(T); ui(); if(playing){ last = performance.now(); voSync(true); } }
  E.start.addEventListener('click', play);
  $('pp').addEventListener('click', function(e){ e.stopPropagation(); playing ? pause() : play(); });
  E.frame.addEventListener('click', function(e){ if(e.target.closest('.bar') || e.target.closest('.start')) return; playing ? pause() : play(); });
  E.trk.addEventListener('click', function(e){ e.stopPropagation(); var r = E.trk.getBoundingClientRect(), sc = r.width / E.trk.offsetWidth || 1; seek((e.clientX - r.left) / r.width * DUR); });
  addEventListener('keydown', function(e){
    if(e.key === ' '){ e.preventDefault(); playing ? pause() : play(); }
    else if(e.key === 'ArrowRight') seek(T + 5); else if(e.key === 'ArrowLeft') seek(T - 5);
    else if(e.altKey && e.code === 'KeyF'){ e.preventDefault(); var d = document, el = d.documentElement; if(d.fullscreenElement) d.exitFullscreen(); else el.requestFullscreen && el.requestFullscreen(); }
  });
  E.frame.addEventListener('mousemove', function(){ E.frame.classList.add('show'); clearTimeout(hideT); hideT = setTimeout(function(){ E.frame.classList.remove('show'); }, 2200); });
  function fit(){ E.frame.style.transform = 'scale(' + Math.min(innerWidth / 1920, innerHeight / 1080) + ')'; }
  addEventListener('resize', fit); fit();
  window.WF_TRAILER = { DUR:DUR, seek:seek, render:render, vo:function(){ return { loaded:TRK.map(function(k){ return !!k.buf; }), playing:TRK.map(function(k){ return !!k.src; }), ctx:AC && AC.state }; } };

  // preload the faces so the first frame is not empty
  Object.keys(WF_IMG).forEach(function(k){ var i = new Image(); i.src = WF_IMG[k]; });
  var m = /^#t([\d.]+)$/.exec(location.hash);
  if(m){ E.start.style.display = 'none'; seek(+m[1]); } else { render(0); ui(); }
})();
