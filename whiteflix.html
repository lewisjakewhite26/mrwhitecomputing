<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr Whiteflix</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 100'%3E%3Cpath d='M10 8L35 92L60 30L85 92L110 8' fill='none' stroke='%23E11B22' stroke-width='20'/%3E%3C/svg%3E">
<!--
  Mr Whiteflix. A made-up streaming service for Year 5/6 Systems and
  Searching, Lessons 5 and 6. It lives outside the lesson deck, like Quick
  Click, so it can fill the whole board.

  The lesson point never changes: somebody decides the order things come
  back in, and two people asking the same question get different answers.
  Everything else here (the power button, the sting, the profiles, the
  loading) is there so the class believes it before anyone explains it.

  Links the deck uses:
    whiteflix.html            standby, then the full start-up
    whiteflix.html#search     straight to the search page
    whiteflix.html#hq         Whiteflix HQ, the three ranking sliders
    whiteflix.html#compare    HQ, two accounts side by side

  Photos are CC0 from StockSnap, found through Openverse with the licence
  filtered to CC0, so none needs a credit. They live next to this file in
  whiteflix/img (one WebP each, plus Mr White's five faces) and load as they
  come on screen, so the page itself stays small. Fonts are SIL Open Font
  Licence, from Google Fonts, cut down to basic Latin, and icons are
  Phosphor; both are bundled into this file.
-->
<style>
  :root{
    --bg:#141414;--red:#E11B22;--card:#181818;--green:#46d369;--mute:#b3b3b3;--dim:#808080;
    --ui:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
    --gut:3.6rem;
  }
  *{box-sizing:border-box}
  html{font-size:clamp(12px,1vw,26px)}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
  body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  input{-webkit-user-select:text;user-select:text}
  button{font:inherit;color:inherit}
  svg.i{width:1.5rem;height:1.5rem;fill:currentColor;flex:none;display:block}
  .screen{position:fixed;inset:0;display:none}
  .screen.on{display:block}
  .fade-in{animation:fadeIn .5s ease both}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .logo{font-family:"Bebas Neue",Impact,sans-serif;color:var(--red);line-height:1;letter-spacing:.02em;white-space:nowrap}

  /* ---------- standby: the television is off ---------- */
  #standby{background:#000;cursor:pointer}
  #standby .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem}
  .power{width:7rem;height:7rem;border-radius:50%;border:2px solid #2a2a2a;display:grid;place-items:center;color:var(--red);
    background:radial-gradient(circle,#1c0607,#000 70%);animation:pulse 2.6s infinite;cursor:pointer;padding:0}
  .power svg.i{width:3rem;height:3rem}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(225,27,34,.45)}70%{box-shadow:0 0 0 1.8rem rgba(225,27,34,0)}100%{box-shadow:0 0 0 0 rgba(225,27,34,0)}}
  #standby p{margin:0;color:#5e5e5e;font-size:1.1rem;letter-spacing:.3em;text-transform:uppercase}
  #standby .led{position:absolute;bottom:2.2rem;left:50%;width:.5rem;height:.5rem;margin-left:-.25rem;border-radius:50%;background:var(--red);box-shadow:0 0 .8rem var(--red)}

  /* ---------- boot: the sting ---------- */
  #boot{background:#000;overflow:hidden}
  #boot .w{position:absolute;left:50%;top:50%;width:22vmin;transform:translate(-50%,-50%);overflow:visible}
  #boot .w line{stroke-width:20;stroke-linecap:butt;stroke-dasharray:var(--l);stroke-dashoffset:var(--l)}
  #boot.play .w line{animation:draw .3s cubic-bezier(.6,0,.4,1) forwards}
  #boot.play .w line:nth-child(2){animation-delay:.22s}
  #boot.play .w line:nth-child(3){animation-delay:.44s}
  #boot.play .w line:nth-child(4){animation-delay:.66s}
  @keyframes draw{to{stroke-dashoffset:0}}
  #boot.zoom .w{animation:wzoom 1s cubic-bezier(.7,0,.9,.4) forwards}
  @keyframes wzoom{to{transform:translate(-50%,-50%) scale(16);opacity:0}}
  .streaks{position:absolute;inset:0;display:flex;align-items:stretch;justify-content:center;gap:.25vw;opacity:0;pointer-events:none}
  #boot.zoom .streaks{animation:streak 1.15s ease-out forwards}
  .streaks i{flex:none;transform:scaleY(0)}
  #boot.zoom .streaks i{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes streak{0%{opacity:0}25%{opacity:1}80%{opacity:.9}100%{opacity:0}}
  @keyframes grow{to{transform:scaleY(1)}}
  #boot .word{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3rem}
  #boot.word-on .word{display:flex}
  #boot.word-on .w{display:none}
  #boot .word .logo{font-size:9vw;animation:wordIn 1.3s cubic-bezier(.16,1,.3,1) both;text-shadow:0 0 3vw rgba(225,27,34,.35)}
  @keyframes wordIn{from{transform:scale(1.25);letter-spacing:.3em;opacity:0;filter:blur(8px)}to{transform:none;letter-spacing:.02em;opacity:1;filter:none}}
  .loadbar{width:18rem;height:.25rem;background:#262626;border-radius:1rem;overflow:hidden;opacity:0;transition:opacity .4s}
  .loadbar i{display:block;height:100%;width:0;background:var(--red);transition:width .25s linear}
  #boot.loading .loadbar{opacity:1}
  .skipintro{position:absolute;right:3rem;bottom:3rem;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.6);color:#fff;
    padding:.7rem 1.6rem;font-size:1.1rem;font-weight:600;cursor:pointer;border-radius:.2rem;z-index:5}
  .skipintro:hover{background:rgba(255,255,255,.15)}

  /* ---------- who is watching ---------- */
  #profiles{background:var(--bg)}
  #profiles.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
  #profiles h1{font-size:3.6rem;font-weight:500;margin:0 0 2.4rem;letter-spacing:.01em}
  .pf-list{display:flex;gap:2.4rem}
  .pf{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.9rem;width:11rem}
  .pf .av{width:11rem;height:11rem;border-radius:.45rem;overflow:hidden;outline:.22rem solid transparent;outline-offset:-.22rem;transition:outline-color .2s}
  .pf span{color:var(--dim);font-size:1.35rem;transition:color .2s}
  .pf:hover .av,.pf:focus-visible .av{outline-color:#fff}
  .pf:hover span,.pf:focus-visible span{color:#fff}
  .av svg{width:100%;height:100%;display:block}
  #profiles h1,#profiles .pf{transition:opacity .3s}
  #profiles.leaving h1,#profiles.leaving .pf{opacity:0}
  .pf-list{animation:fadeIn .5s ease both}
  .pf-fly{position:fixed;z-index:9;border-radius:.45rem;overflow:hidden;transition:all .6s cubic-bezier(.6,0,.2,1)}
  .pf-ring{position:fixed;z-index:10;left:50%;top:50%;width:14rem;height:14rem;margin:-7rem 0 0 -7rem;opacity:0;transition:opacity .3s}
  .pf-ring.on{opacity:1}
  .pf-ring svg{width:100%;height:100%;animation:spin .9s linear infinite}

  /* ---------- the app shell ---------- */
  #app{background:var(--bg);overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
  #app::-webkit-scrollbar{display:none}
  .nav{position:fixed;top:0;left:0;right:0;height:4.6rem;display:flex;align-items:center;gap:1.7rem;padding:0 var(--gut);z-index:50;
    background:linear-gradient(180deg,rgba(0,0,0,.75) 10%,transparent);transition:background .4s}
  .nav.solid{background:var(--bg)}
  .nav .logo{font-size:2.3rem;cursor:pointer;margin-right:1rem}
  .nav a{color:#e5e5e5;font-size:1rem;text-decoration:none;cursor:pointer;transition:color .3s}
  .nav a:hover{color:var(--mute)}
  .nav a.on{font-weight:700;color:#fff}
  .nav .sp{flex:1}
  .ic{background:none;border:0;padding:.25rem;cursor:pointer;display:grid;place-items:center;color:#fff}
  .sbox{display:flex;align-items:center;gap:.6rem;border:1px solid transparent;padding:.35rem .5rem;transition:background .3s,border-color .3s}
  .sbox input{width:0;opacity:0;background:transparent;border:0;color:#fff;font:inherit;font-size:1.05rem;outline:0;padding:0;
    transition:width .4s var(--ease),opacity .2s}
  .sbox input::placeholder{color:#8c8c8c}
  .sbox.open{border-color:#fff;background:rgba(0,0,0,.8)}
  .sbox.open input{width:19rem;opacity:1}
  .sbox .clr{display:none}
  .sbox.open.has .clr{display:grid}
  .bell{position:relative}
  .bell b{position:absolute;top:-.1rem;right:-.2rem;background:var(--red);font-size:.7rem;border-radius:1rem;padding:.05rem .35rem;font-weight:700}
  .drop{position:relative}
  .drop>.menu{position:absolute;right:0;top:3.2rem;background:rgba(0,0,0,.92);border:1px solid #3a3a3a;min-width:17rem;padding:.7rem 0;display:none;
    box-shadow:0 1rem 2rem rgba(0,0,0,.6)}
  .drop.open>.menu{display:block;animation:fadeIn .15s ease}
  .menu button{display:flex;align-items:center;gap:.9rem;width:100%;background:none;border:0;padding:.55rem 1.1rem;text-align:left;cursor:pointer;font-size:1rem;color:#fff}
  .menu button:hover{text-decoration:underline}
  .menu .av{width:2.1rem;height:2.1rem;border-radius:.25rem;overflow:hidden;flex:none}
  .menu hr{border:0;border-top:1px solid #3a3a3a;margin:.6rem 0}
  .menu .hq{color:#ff6b6b;font-weight:600}
  .menu .note{display:flex;gap:.9rem;padding:.7rem 1.1rem;align-items:center;font-size:.95rem;line-height:1.35;color:#d0d0d0;cursor:default}
  .menu .note .th{width:7rem;aspect-ratio:16/9;position:relative;flex:none;border-radius:.2rem;overflow:hidden}
  .menu .note small{display:block;color:#7a7a7a;margin-top:.2rem}
  .me{display:flex;align-items:center;gap:.5rem;cursor:pointer;background:none;border:0;padding:0}
  .me .av{width:2.3rem;height:2.3rem;border-radius:.25rem;overflow:hidden}
  .me svg.i{width:1rem;height:1rem;transition:transform .25s}
  .drop.open .me svg.i{transform:rotate(180deg)}
  #page{min-height:100%}

  /* ---------- billboard ---------- */
  .bill{position:relative;height:min(56.25vw,94vh);min-height:30rem;overflow:hidden}
  .bill .art{position:absolute;inset:0}
  .bill .art .art-img{animation:kb 28s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.13) translate(-1.6%,-1.2%)}}
  .bill .vl{position:absolute;inset:0;background:linear-gradient(77deg,rgba(0,0,0,.75),rgba(0,0,0,.3) 50%,transparent 85%)}
  .bill .vb{position:absolute;left:0;right:0;bottom:0;height:16vw;background:linear-gradient(180deg,transparent,rgba(20,20,20,.2) 20%,rgba(20,20,20,.6) 50%,var(--bg) 92%)}
  .bill .info{position:absolute;left:var(--gut);bottom:36%;width:42%;z-index:2}
  .bill .tl{--ts:5.4rem;transform-origin:left bottom;transition:transform 1.4s var(--ease)}
  .bill.quiet .tl{transform:scale(.75)}
  .rankline{display:flex;align-items:center;gap:.8rem;font-size:1.55rem;font-weight:600;margin:1.2rem 0 0;text-shadow:0 .1rem .4rem rgba(0,0,0,.5)}
  .t10{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:1.9rem;height:2.1rem;background:var(--red);
    font-weight:800;line-height:.95;border-radius:.12rem;flex:none}
  .t10 small{font-size:.48rem;letter-spacing:.04em}
  .t10 b{font-size:.95rem}
  .bill .blurb{font-size:1.4rem;line-height:1.4;text-shadow:.1rem .1rem .3rem rgba(0,0,0,.6);margin:1rem 0 0;max-height:12rem;overflow:hidden;
    transition:opacity .9s,max-height 1.2s var(--ease),margin 1.2s}
  .bill.quiet .blurb{opacity:0;max-height:0;margin:0}
  .bill .btns{display:flex;gap:.8rem;margin-top:1.6rem}
  .btn{display:inline-flex;align-items:center;gap:.7rem;border:0;border-radius:.3rem;padding:.75rem 2rem .75rem 1.6rem;font-size:1.3rem;font-weight:700;cursor:pointer;transition:background .2s}
  .btn svg.i{width:1.9rem;height:1.9rem}
  .btn.play{background:#fff;color:#000}
  .btn.play:hover{background:rgba(255,255,255,.75)}
  .btn.more{background:rgba(109,109,110,.7);color:#fff}
  .btn.more:hover{background:rgba(109,109,110,.45)}
  .bill .side{position:absolute;right:0;bottom:36%;display:flex;align-items:center;gap:1.1rem;z-index:2}
  .roundbtn{width:2.9rem;height:2.9rem;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.15);display:grid;place-items:center;cursor:pointer;color:#fff;padding:0}
  .roundbtn:hover{background:rgba(255,255,255,.12)}
  .roundbtn svg.i{width:1.4rem;height:1.4rem}
  .mat{background:rgba(51,51,51,.6);border-left:3px solid #dcdcdc;padding:.45rem 4rem .45rem .9rem;font-size:1.15rem}

  /* ---------- rows ---------- */
  .rows{position:relative;z-index:3;margin-top:-10vw;padding-bottom:5rem}
  .row{margin:0 0 3.2vw}
  .row h2{margin:0 var(--gut) .7rem;font-size:1.45rem;font-weight:600;color:#e5e5e5;display:flex;align-items:center;gap:1rem}
  .row h2 .pips{margin-left:auto;display:flex;gap:.15rem;opacity:0;transition:opacity .3s}
  .row:hover h2 .pips{opacity:1}
  .pips i{width:.9rem;height:.14rem;background:#4d4d4d}
  .pips i.on{background:#aaa}
  .rail-wrap{position:relative}
  .rail{display:flex;gap:.45vw;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding:0 var(--gut);
    padding:0 var(--gut);scrollbar-width:none;scroll-behavior:smooth;overscroll-behavior-x:contain}
  .rail::-webkit-scrollbar{display:none}
  .rail>*{scroll-snap-align:start;flex:none}
  .arrow{position:absolute;top:0;bottom:0;width:3.2rem;border:0;background:rgba(20,20,20,.5);color:#fff;cursor:pointer;z-index:4;
    opacity:0;transition:opacity .2s,background .2s;display:grid;place-items:center;padding:0}
  .arrow.l{left:0;border-radius:0 .3rem .3rem 0}
  .arrow.r{right:0;border-radius:.3rem 0 0 .3rem}
  .rail-wrap:hover .arrow,.coarse .arrow{opacity:1}
  .arrow:hover{background:rgba(20,20,20,.8)}
  .arrow svg.i{width:2.2rem;height:2.2rem;transition:transform .2s}
  .arrow:hover svg.i{transform:scale(1.25)}
  .arrow[hidden]{display:none}

  /* ---------- cards ---------- */
  .card{--w:calc((100vw - 2 * var(--gut) - 2.25vw) / 6);width:var(--w);aspect-ratio:16/9;position:relative;border-radius:.3rem;overflow:hidden;
    cursor:pointer;background:#262626;border:0;padding:0;display:block;text-align:left}
  .art-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .card .art-img,.t10item .art-img{opacity:0;transition:opacity .6s}
  .card .art-img.ld,.t10item .art-img.ld{opacity:1}
  .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,.1) 55%,transparent)}
  .card .tl{--ts:1.35rem;position:absolute;left:.7rem;right:.7rem;bottom:.55rem}
  .card.cw .tl{bottom:1.2rem}
  .card.sp .tl,.t10item .ps.sp .tl{bottom:1.45rem}
  .tt .ps.sp .tl{bottom:1.6rem}
  .wb{position:absolute;left:.45rem;top:.4rem;width:1.1rem;height:1rem;overflow:visible}
  .card .t10{position:absolute;right:0;top:0;border-radius:0 0 0 .12rem;width:1.6rem;height:1.8rem}
  .card .t10 b{font-size:.8rem}
  .strip{position:absolute;left:50%;bottom:0;transform:translateX(-50%);background:var(--red);color:#fff;font-size:.66rem;font-weight:700;
    letter-spacing:.07em;padding:.22rem .6rem;border-radius:.15rem .15rem 0 0;white-space:nowrap}
  .card .prog{position:absolute;left:.7rem;right:.7rem;bottom:.5rem;height:.22rem;background:rgba(160,160,160,.6)}
  .prog i{display:block;height:100%;background:var(--red)}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3.2vw .45vw;padding:0 var(--gut)}
  .grid .card{width:auto}

  /* top 10 row: the big numbers */
  .t10item{--w:calc((100vw - 2 * var(--gut) - 1.8vw) / 5);width:var(--w);height:calc(var(--w) * .72);display:flex;align-items:stretch;
    position:relative;cursor:pointer;background:none;border:0;padding:0}
  .t10item .num{flex:1;position:relative;overflow:visible}
  .t10item .num svg{position:absolute;right:-6%;bottom:0;height:100%;width:auto;overflow:visible}
  .t10item .ps{height:100%;aspect-ratio:2/3;position:relative;border-radius:.3rem;overflow:hidden;background:#262626;flex:none}
  .t10item .ps .tl{--ts:1rem;position:absolute;left:.6rem;right:.6rem;bottom:.6rem;text-align:center}

  /* skeletons: the real loading state */
  .sk{background:#242424;position:relative;overflow:hidden;border-radius:.3rem}
  .sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);animation:shim 1.25s infinite}
  @keyframes shim{to{transform:translateX(100%)}}
  .sk-title{width:14rem;height:1.3rem;margin:0 var(--gut) .8rem}
  .sk-rail{display:flex;gap:.45vw;padding:0 var(--gut);overflow:hidden}
  .sk-rail .sk{flex:none;width:calc((100vw - 2 * var(--gut) - 2.25vw) / 6);aspect-ratio:16/9}

  /* title treatments */
  .tl{font-size:var(--ts,1.3rem);line-height:.95;text-shadow:0 .04em .3em rgba(0,0,0,.55);overflow-wrap:normal;hyphens:none}

  /* ---------- hover preview (mouse only) ---------- */
  .pv{position:fixed;z-index:60;background:var(--card);border-radius:.4rem;box-shadow:0 .8rem 2.4rem rgba(0,0,0,.8);overflow:hidden;
    animation:pvIn .28s var(--ease) both;cursor:pointer}
  @keyframes pvIn{from{transform:scale(.67);opacity:.4}to{transform:none;opacity:1}}
  .pv .top{position:relative;aspect-ratio:16/9}
  .pv .top .tl{--ts:1.9rem;position:absolute;left:.9rem;right:.9rem;bottom:.8rem}
  .pv .bot{padding:1rem 1.1rem 1.2rem}
  .cbtns{display:flex;gap:.55rem;align-items:center}
  .cbtn{width:2.5rem;height:2.5rem;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(42,42,42,.6);display:grid;place-items:center;
    cursor:pointer;color:#fff;padding:0;flex:none}
  .cbtn:hover{border-color:#fff}
  .cbtn svg.i{width:1.25rem;height:1.25rem}
  .cbtn.w{background:#fff;border-color:#fff;color:#000}
  .cbtn.w:hover{background:#d6d6d6}
  .cbtn.push{margin-left:auto}
  .meta{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;font-size:.95rem;margin:.85rem 0 .55rem;color:#bcbcbc}
  .match{color:var(--green);font-weight:700}
  .match.soon{color:#fff}
  .age{border:1px solid rgba(255,255,255,.45);padding:0 .4rem;font-size:.85rem;color:#fff}
  .hd{border:1px solid rgba(255,255,255,.45);border-radius:.18rem;padding:0 .3rem;font-size:.66rem;font-weight:700;color:#fff}
  .tags{display:flex;flex-wrap:wrap;gap:.2rem .45rem;font-size:.9rem;color:#fff}
  .tags span+span::before{content:"\2022";color:#646464;margin-right:.45rem}

  /* ---------- details modal ---------- */
  #modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);display:none;overflow-y:auto;padding:2.2rem 0}
  #modal.on{display:block;animation:fadeIn .25s ease}
  .mbox{position:relative;width:min(60rem,94vw);margin:0 auto;background:var(--card);border-radius:.55rem;overflow:hidden;
    box-shadow:0 0 3rem rgba(0,0,0,.85);animation:mIn .38s var(--ease) both}
  @keyframes mIn{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
  .mhero{position:relative;aspect-ratio:16/9;overflow:hidden}
  .mhero .art-img{animation:kb 30s ease-in-out infinite alternate}
  .mhero .g{position:absolute;inset:0;background:linear-gradient(0deg,var(--card),transparent 55%)}
  .mhero .in{position:absolute;left:3rem;right:3rem;bottom:2.6rem}
  .mhero .tl{--ts:3.7rem;max-width:72%;margin-bottom:1.5rem}
  .x{position:absolute;right:1rem;top:1rem;width:2.5rem;height:2.5rem;border-radius:50%;background:#181818;border:0;color:#fff;cursor:pointer;display:grid;place-items:center;z-index:3;padding:0}
  .x svg.i{width:1.4rem;height:1.4rem}
  .mbody{padding:0 3rem 2.8rem}
  .mcols{display:grid;grid-template-columns:2fr 1fr;gap:2.2rem}
  .mcols .meta{margin-top:0;font-size:1.05rem}
  .mcols p{font-size:1.15rem;line-height:1.55;margin:.5rem 0}
  .side-l{font-size:.95rem;color:#777;line-height:1.7}
  .side-l b{color:#ddd;font-weight:400}
  .why{margin:1.9rem 0 0;background:#232323;border-radius:.45rem;padding:1.2rem 1.4rem;border-left:.3rem solid var(--red)}
  .why h3{margin:0 0 .9rem;font-size:.82rem;letter-spacing:.2em;color:#a3a3a3;font-weight:700}
  .why .bar{display:grid;grid-template-columns:11rem 1fr 2.6rem;align-items:center;gap:1rem;font-size:1rem;margin:.5rem 0}
  .why .tr{height:.62rem;background:#3a3a3a;border-radius:1rem;overflow:hidden}
  .why .fl{display:block;height:100%;border-radius:1rem;width:0;transition:width 1s var(--ease)}
  .why .bar b{text-align:right}
  .why .sum{margin-top:.9rem;font-size:1rem;color:#cfcfcf;line-height:1.5}
  .mlt h3{font-size:1.6rem;margin:2.4rem 0 1.1rem;font-weight:700}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem}
  .mcard{background:#2f2f2f;border-radius:.3rem;overflow:hidden;cursor:pointer;border:0;padding:0;text-align:left;color:#fff}
  .mcard .top{position:relative;aspect-ratio:16/9}
  .mcard .top .tl{--ts:1.2rem;position:absolute;left:.6rem;right:.6rem;bottom:.5rem}
  .mcard .top .mins{position:absolute;right:.5rem;top:.4rem;font-size:.85rem;font-weight:600;text-shadow:0 0 .3rem #000}
  .mcard .bd{padding:.9rem}
  .mcard .r1{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
  .mcard .r1 .meta{margin:0}
  .mcard p{font-size:.9rem;color:#d2d2d2;line-height:1.45;margin:.6rem 0 0}

  /* ---------- search, grid pages ---------- */
  .gpage{padding:7.2rem 0 5rem}
  .gpage h1{margin:0 var(--gut) 1.6rem;font-size:2.4rem;font-weight:700}
  .try{display:flex;align-items:center;flex-wrap:wrap;gap:.6rem;margin:0 var(--gut) 1.5rem}
  .try>span{color:var(--dim);font-size:1.05rem;margin-right:.4rem}
  .chip{border:1px solid #4d4d4d;background:rgba(255,255,255,.06);color:#e5e5e5;border-radius:99rem;padding:.5rem 1.1rem;
    font-size:1.05rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;transition:all .15s}
  .chip svg.i{width:1rem;height:1rem;display:none}
  .chip.on{background:#fff;border-color:#fff;color:#000}
  .chip.on svg.i{display:block}
  .chip.f{border-style:dashed}
  .chip.f.on{border-style:solid}
  .rhead{margin:0 var(--gut) 1.1rem;color:var(--mute);font-size:1.15rem}
  .rhead b{color:#fff}
  .empty{margin:3rem var(--gut);font-size:1.3rem;line-height:1.6;color:#c9c9c9;max-width:40rem}

  /* ---------- player ---------- */
  #player{background:#000;cursor:none;overflow:hidden}
  #player.ui{cursor:default}
  #player .art{position:absolute;inset:0;opacity:0;transition:opacity 1.2s}
  #player.go .art{opacity:1}
  #player .art .art-img{animation:kb 34s linear infinite alternate}
  #player.paused .art .art-img{animation-play-state:paused}
  #player.paused .art{filter:brightness(.45);transition:filter .6s}
  .pload{position:absolute;inset:0;display:grid;place-items:center}
  #player.go .pload{display:none}
  .ring{width:5.8rem;height:5.8rem;position:relative}
  .ring svg{width:100%;height:100%;animation:spin 1s linear infinite}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.05rem;font-weight:600}
  .pctl{position:absolute;inset:0;opacity:0;transition:opacity .45s;pointer-events:none}
  #player.ui .pctl,#player.paused .pctl{opacity:1;pointer-events:auto}
  #player:not(.go) .pctl .pbottom{display:none}
  .pback{position:absolute;left:2.2rem;top:2rem}
  .pback svg.i{width:2.6rem;height:2.6rem}
  .pbottom{position:absolute;left:0;right:0;bottom:0;padding:2.5rem 2.4rem 1.6rem;background:linear-gradient(transparent,rgba(0,0,0,.85))}
  .ptrack{display:flex;align-items:center;gap:1.2rem;font-size:1.05rem;font-variant-numeric:tabular-nums}
  .pbar{flex:1;height:.3rem;background:#5b5b5b;position:relative;cursor:pointer;transition:height .15s}
  .pbar:hover{height:.5rem}
  .pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--red)}
  .pbar em{position:absolute;top:50%;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--red);transform:translate(-50%,-50%)}
  .pbtns{display:flex;align-items:center;gap:2.1rem;margin-top:1.2rem}
  .pbtns svg.i{width:2.6rem;height:2.6rem}
  .pbtns .ttl{flex:1;text-align:center;font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pbtns .ttl span{color:#bbb;margin-left:.6rem}
  .ppause{position:absolute;left:6rem;top:28%;max-width:44rem;opacity:0;transition:opacity .6s .9s;pointer-events:none}
  #player.paused .ppause{opacity:1}
  .ppause small{color:var(--mute);font-size:1.2rem}
  .ppause .tl{--ts:4rem;margin:.8rem 0 1rem}
  .ppause p{font-size:1.3rem;line-height:1.5;color:#ddd;margin:.6rem 0 0}
  .caption{position:absolute;left:0;right:0;bottom:17%;text-align:center;font-size:2rem;font-weight:600;
    text-shadow:0 0 .3rem #000,0 0 .6rem #000;opacity:0;transition:opacity .4s;pointer-events:none}
  .caption.on{opacity:1}

  /* ---------- Whiteflix HQ ---------- */
  #hq{background:#0b0d12;overflow-y:auto;overflow-x:hidden}
  .hqbar{display:flex;align-items:center;gap:1.2rem;padding:1rem 2.4rem;border-bottom:1px solid #1d2230;background:#0e1118;position:sticky;top:0;z-index:5}
  .hqbar .logo{font-size:2rem}
  .staff{font-size:.75rem;font-weight:800;letter-spacing:.22em;background:var(--red);padding:.3rem .65rem;border-radius:.12rem}
  .tabs{display:flex;gap:.5rem;margin-left:1.6rem}
  .tab{background:none;border:1px solid #2a3040;color:#9aa3b5;padding:.5rem 1.15rem;border-radius:2rem;cursor:pointer;font-size:1rem;font-weight:600}
  .tab.on{background:#fff;color:#000;border-color:#fff}
  .hqbar .sp{flex:1}
  .ghost{background:none;border:1px solid #3a4152;color:#cfd5e2;padding:.5rem 1.1rem;border-radius:.3rem;cursor:pointer;font-size:1rem;display:inline-flex;align-items:center;gap:.5rem}
  .ghost:hover{border-color:#8792a8}
  .ghost svg.i{width:1.2rem;height:1.2rem}
  .hqbody{padding:1.5rem 2.4rem 2rem;display:flex;flex-direction:column;gap:1.3rem}
  .chal{display:flex;align-items:center;gap:1.3rem;background:#141824;border:1px solid #232a3a;border-left:.3rem solid var(--red);padding:1rem 1.3rem;border-radius:.4rem;flex-wrap:wrap}
  .chal b{font-size:.82rem;letter-spacing:.22em;color:var(--red)}
  .chal .t{flex:1;min-width:20rem;font-size:1.35rem;font-weight:600}
  .chal .at{font-size:1.35rem;font-weight:800;transition:color .3s}
  .chal.won{border-left-color:var(--green);animation:won .8s ease}
  .chal.won b{color:var(--green)}
  @keyframes won{0%{box-shadow:0 0 0 0 rgba(70,211,105,.6)}100%{box-shadow:0 0 0 1.2rem rgba(70,211,105,0)}}
  .hqh{display:flex;align-items:baseline;gap:1rem}
  .hqh h2{margin:0;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:2.6rem;letter-spacing:.02em}
  .hqh span{color:#7d8699;font-size:1rem}
  .t10grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1.5rem 1rem;position:relative}
  .tt{display:flex;align-items:flex-end;height:min(13.5vw,25vh);position:relative;cursor:pointer;will-change:transform}
  .tt .n{flex:1;height:100%;position:relative}
  .tt .n svg{position:absolute;right:-8%;bottom:0;height:100%;width:auto;overflow:visible}
  .tt .ps{height:100%;aspect-ratio:2/3;position:relative;border-radius:.3rem;overflow:hidden;background:#1f2430;flex:none;box-shadow:0 .5rem 1.4rem rgba(0,0,0,.6)}
  .tt .ps .tl{--ts:.85rem;position:absolute;left:.5rem;right:.5rem;bottom:1rem;text-align:center}
  .tt .sb{position:absolute;left:0;right:0;bottom:0;height:.4rem;display:flex;background:#000}
  .tt .sb i{display:block;height:100%;transition:width .4s var(--ease)}
  .tt.me .ps{outline:.2rem solid var(--green);outline-offset:.15rem}
  .tt .strip{font-size:.58rem;bottom:.4rem}
  .sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;margin-top:.4rem;background:#111521;border:1px solid #1d2230;border-radius:.5rem;padding:1.2rem 1.5rem 1.3rem}
  .sl .hd2{display:flex;align-items:baseline;gap:.8rem}
  .sl label{flex:1;font-size:1.3rem;font-weight:700}
  .sl .v{font-family:"Bebas Neue",Impact,sans-serif;font-size:2.4rem;line-height:1}
  .sl input{width:100%;height:2.4rem;margin:.3rem 0 .2rem;cursor:pointer}
  .sl .hint{font-size:1rem;color:#8c95a8;line-height:1.35}
  .gate{position:absolute;inset:0;z-index:20;background:#05070b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem}
  .gate[hidden]{display:none}
  .badge{width:22rem;height:13.5rem;border-radius:.8rem;background:linear-gradient(135deg,#f4f4f4,#cfcfcf);color:#111;position:relative;overflow:hidden;
    display:flex;gap:1.2rem;padding:1.3rem;box-shadow:0 1.2rem 3rem rgba(0,0,0,.7)}
  .badge .ph{width:7rem;height:100%;border-radius:.4rem;overflow:hidden;flex:none}
  .badge .bd{display:flex;flex-direction:column;gap:.35rem}
  .badge .logo{font-size:1.9rem}
  .badge .nm{font-weight:800;font-size:1.3rem;margin-top:.6rem}
  .badge .rl{font-size:.95rem;color:#555}
  .badge .bc{margin-top:auto;height:2rem;background:repeating-linear-gradient(90deg,#111 0 .18rem,transparent .18rem .35rem,#111 .35rem .45rem,transparent .45rem .7rem)}
  .scan{position:absolute;left:0;right:0;height:.25rem;background:#3cf07a;box-shadow:0 0 1.2rem #3cf07a;top:0;animation:scan 1.1s ease-in-out infinite alternate}
  @keyframes scan{to{top:calc(100% - .25rem)}}
  .gate p{margin:0;font-size:1.4rem;letter-spacing:.2em;color:#8c95a8;text-transform:uppercase;font-weight:600}
  .gate.ok .scan{display:none}
  .gate.ok p{color:#3cf07a}

  /* two accounts */
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem}
  .tv{background:var(--bg);border-radius:.6rem;overflow:hidden;border:.35rem solid #1b1f2a;box-shadow:0 1rem 2.5rem rgba(0,0,0,.6)}
  .tv .mininav{display:flex;align-items:center;gap:1rem;padding:.8rem 1.2rem;background:#0c0c0c}
  .tv .mininav .logo{font-size:1.5rem}
  .tv .q{flex:1;display:flex;align-items:center;gap:.5rem;border:1px solid #666;padding:.35rem .7rem;font-size:1rem;color:#fff;background:#000}
  .tv .q svg.i{width:1.1rem;height:1.1rem;color:#aaa}
  .tv .who{display:flex;align-items:center;gap:.9rem;padding:1.1rem 1.2rem .3rem}
  .tv .who .av{width:3rem;height:3rem;border-radius:.3rem;overflow:hidden;flex:none}
  .tv .who input{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid #3d3d3d;border-radius:.3rem;padding:.5rem .8rem;color:#fff;
    font:inherit;font-size:1.5rem;font-weight:700}
  .tv .hist{padding:.2rem 1.2rem .9rem;color:#8c8c8c;font-size:1.05rem}
  .tv .hist b{color:#e5e5e5;font-weight:600}
  .tv h3{margin:0 1.2rem .8rem;font-size:1.3rem;font-weight:600;color:#e5e5e5}
  .tv .g2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;padding:0 1.2rem 1.3rem}
  .tv .g2 .card{width:auto}
  .tv .wb{display:none}
  .tv .g2 .rk{position:absolute;left:.6rem;top:.3rem;font-family:"Bebas Neue",Impact,sans-serif;font-size:3rem;line-height:1;text-shadow:0 .1rem .5rem rgba(0,0,0,.9);z-index:2}

  @media (max-width:1000px){
    .card,.sk-rail .sk{--w:calc((100vw - 2 * var(--gut) - 1.35vw) / 4);width:var(--w)}
    .grid{grid-template-columns:repeat(4,1fr)}
    .t10item{--w:calc((100vw - 2 * var(--gut) - 1.2vw) / 3)}
    .bill .info{width:62%}
    .nav a.opt{display:none}
    .mgrid{grid-template-columns:repeat(2,1fr)}
  }
  /* ---------- phones held upright ----------
     The board is the main target; this only stops a phone from getting
     a shrunken copy of the board layout. */
  @media (max-width:760px){
    html{font-size:14px}
    :root{--gut:1rem}
    .nav{height:auto;flex-wrap:wrap;gap:.35rem 1.1rem;padding:.7rem var(--gut) .5rem}
    .nav::after{content:"";order:5;flex-basis:100%}
    .nav .logo{order:1;font-size:1.8rem;margin-right:0}
    .nav .sp{order:2}
    .nav .sbox{order:3}
    .nav .mebox{order:4}
    .nav .bellbox,.nav .fsbtn{display:none}
    .nav a,.nav a.opt{order:6;display:inline;font-size:.95rem}
    .sbox.open{order:6;flex-basis:100%}
    .sbox.open input{width:auto;flex:1;min-width:0}
    .nav a,.nav a.opt{order:7}
    .gpage.spage{padding-top:10.4rem}
    .sbox{padding:.3rem .35rem;gap:.35rem}
    .bill{height:78vh;min-height:0}
    .bill .vl{background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,.1) 60%,rgba(0,0,0,.35))}
    .bill .info{left:var(--gut);right:var(--gut);width:auto;bottom:16%;text-align:center}
    .bill .tl{--ts:3rem;transform-origin:center bottom}
    .bill .rankline{justify-content:center;font-size:1.1rem}
    .bill .blurb{font-size:1rem}
    .bill .btns{justify-content:center}
    .bill .side{display:none}
    .btn{font-size:1.05rem;padding:.6rem 1.3rem .6rem 1rem}
    .btn svg.i{width:1.4rem;height:1.4rem}
    .rows{margin-top:-4rem}
    .row{margin-bottom:1.6rem}
    .row h2{font-size:1.15rem}
    .row h2 .pips,.arrow{display:none}
    .rail{gap:.5rem}
    .card,.sk-rail .sk{--w:calc((100vw - 2 * var(--gut) - 1rem) / 2.4);width:var(--w)}
    .card .tl{--ts:1.1rem}
    .t10item{--w:calc((100vw - 2 * var(--gut)) / 1.5)}
    .grid{grid-template-columns:repeat(2,1fr);gap:1rem .5rem}
    .gpage{padding-top:7.6rem}
    .gpage h1{font-size:1.8rem}
    #modal{padding:0}
    .mbox{width:100vw;border-radius:0;min-height:100%}
    .mhero .in{left:var(--gut);right:var(--gut);bottom:1.2rem}
    .mhero .tl{--ts:2.4rem;max-width:100%;margin-bottom:1rem}
    .mbody{padding:0 var(--gut) 2rem}
    .mcols{grid-template-columns:1fr;gap:.6rem}
    .why{padding:1rem}
    .why .bar{grid-template-columns:8.5rem 1fr 2rem;font-size:.9rem;gap:.6rem}
    .mgrid{grid-template-columns:repeat(2,1fr);gap:.7rem}
    #profiles h1{font-size:2.2rem}
    .pf-list{flex-wrap:wrap;justify-content:center;gap:1.4rem}
    .pf,.pf .av{width:7rem}
    .pf .av{height:7rem}
    #boot .word .logo{font-size:15vw}
    .skipintro{right:1rem;bottom:1.5rem;font-size:1rem}
    /* the player letterboxes, like any film on a phone held upright */
    #player .art{inset:auto 0;top:50%;height:auto;aspect-ratio:16/9;transform:translateY(-50%);overflow:hidden}
    .pbtns{gap:1.2rem}
    .pbtns svg.i{width:2rem;height:2rem}
    .pbtns .ttl,.pbtns .pvol,.pbtns .pnext{display:none}
    .pbtns .psubs{margin-left:auto}
    .pbottom{padding:2rem 1rem 1.2rem}
    .caption{font-size:1.15rem;bottom:calc(50% - 28vw - 3.2rem);padding:0 1rem}
    .ppause{left:1rem;right:1rem;top:auto;bottom:22%}
    .ppause .tl{--ts:2.4rem}
    .hqbar{flex-wrap:wrap;padding:.8rem var(--gut);gap:.6rem}
    .hqbar .logo{font-size:1.6rem}
    .hqbar .tabs{order:5;margin-left:0;flex-basis:100%}
    .hqbar .ghost span,.hqbar .fsbtn{display:none}
    .hqbody{padding:1rem var(--gut) 2rem}
    .chal{flex-direction:column;align-items:flex-start;gap:.5rem}
    .chal .t{min-width:0;font-size:1.1rem}
    .hqh{flex-direction:column;gap:.2rem}
    .hqh h2{font-size:2rem}
    .t10grid{grid-template-columns:repeat(2,1fr);gap:1rem .6rem}
    .tt{height:38vw}
    .tt .ps .tl{--ts:.8rem}
    .sliders{grid-template-columns:1fr;gap:1.2rem;padding:1rem}
    .cmp{grid-template-columns:1fr}
    .tv .g2 .card{width:auto}
  }
  @media (prefers-reduced-motion:reduce){
    .bill .art .art-img,.mhero .art-img,#player .art .art-img,.sk::after,.power{animation:none}
  }
</style>
</head>
<body>

<div id="standby" class="screen">
  <div class="inner">
    <button class="power" type="button" aria-label="Turn on Mr Whiteflix"><svg class="i" viewBox="0 0 256 256" aria-hidden="true"><path d="M120,128V48a8,8,0,0,1,16,0v80a8,8,0,0,1-16,0Zm60.37-78.7a8,8,0,0,0-8.74,13.4C194.74,77.77,208,101.57,208,128a80,80,0,0,1-160,0c0-26.43,13.26-50.23,36.37-65.3a8,8,0,0,0-8.74-13.4C47.9,67.38,32,96.06,32,128a96,96,0,0,0,192,0C224,96.06,208.1,67.38,180.37,49.3Z"/></svg></button>
    <p>Press to turn on</p>
  </div>
  <span class="led"></span>
</div>

<div id="boot" class="screen">
  <div class="streaks"></div>
  <svg class="w" viewBox="0 0 120 100" aria-hidden="true">
    <defs>
      <linearGradient id="wA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3b3f"/><stop offset="1" stop-color="#B20710"/></linearGradient>
      <linearGradient id="wB" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7a0409"/><stop offset="1" stop-color="#E11B22"/></linearGradient>
    </defs>
    <line x1="10" y1="8" x2="35" y2="92" stroke="url(#wA)" style="--l:88"/>
    <line x1="35" y1="92" x2="60" y2="30" stroke="url(#wB)" style="--l:67"/>
    <line x1="60" y1="30" x2="85" y2="92" stroke="url(#wA)" style="--l:67"/>
    <line x1="85" y1="92" x2="110" y2="8" stroke="url(#wB)" style="--l:88"/>
  </svg>
  <div class="word">
    <div class="logo">MR WHITEFLIX</div>
    <div class="loadbar"><i></i></div>
  </div>
  <button class="skipintro" type="button">Skip intro</button>
</div>

<div id="profiles" class="screen">
  <h1>Who&rsquo;s watching?</h1>
  <div class="pf-list"></div>
</div>

<div id="app" class="screen">
  <nav class="nav">
    <span class="logo" data-go="home">MR WHITEFLIX</span>
    <a data-go="home">Home</a>
    <a data-go="sport" class="opt">Sport</a>
    <a data-go="nature" class="opt">Nature</a>
    <a data-go="new">New and popular</a>
    <a data-go="list">My list</a>
    <span class="sp"></span>
    <div class="sbox">
      <button class="ic sgo" type="button" aria-label="Search"><svg class="i" viewBox="0 0 256 256" aria-hidden="true"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/></svg></button>
      <input type="text" placeholder="Titles, topics, anything" aria-label="Search Mr Whiteflix" autocomplete="off" spellcheck="false">
      <button class="ic clr" type="button" aria-label="Clear search"><svg class="i" viewBox="0 0 256 256" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg></button>
    </div>
    <div class="drop bellbox">
      <button class="ic bell" type="button" aria-label="Notifications"><svg class="i" viewBox="0 0 256 256" aria-hidden="true"><path d="M221.8,175.94C216.25,166.38,208,139.33,208,104a80,80,0,1,0-160,0c0,35.34-8.26,62.38-13.81,71.94A16,16,0,0,0,48,200H88.81a40,40,0,0,0,78.38,0H208a16,16,0,0,0,13.8-24.06ZM128,216a24,24,0,0,1-22.62-16h45.24A24,24,0,0,1,128,216ZM48,184c7.7-13.24,16-43.92,16-80a64,64,0,1,1,128,0c0,36.05,8.28,66.73,16,80Z"/></svg><b>3</b></button>

    list.forEach(function(p, i){
      var t = have[p.id];
      if(!t){
        t = document.createElement('div');
        t.className = 'tt'; t.setAttribute('data-id', p.id);
        t.innerHTML = '<span class="n"></span><span class="ps' + (strip(p) ? ' sp' : '') + '">' + art(p) + '<span class="shade"></span>' + tl(p) +
          (p.paid > 50 ? '<span class="strip">SPONSORED</span>' : '') + '<span class="sb"><i style="background:#A8D8FF"></i><i style="background:#5B8DEF"></i><i style="background:#E11B22"></i></span></span>';
        if(animate) t.style.opacity = '0';
      }
      $('.n', t).innerHTML = bigNum(i + 1);
      t.classList.toggle('me', p.id === 'mark');
      var segs = $$('.sb i', t);
      segs[0].style.width = (S.w.words * p.words / 100 / max * 100) + '%';
      segs[1].style.width = (S.w.pop * p.pop / 100 / max * 100) + '%';
      segs[2].style.width = (S.w.paid * p.paid / 100 / max * 100) + '%';
      grid.appendChild(t);
      keep[p.id] = true;
    });
    Object.keys(have).forEach(function(id){ if(!keep[id]) have[id].remove(); });
    // FLIP: slide each poster from where it was to where it now is
    if(animate){
      $$('.tt', grid).forEach(function(t){
        var id = t.getAttribute('data-id'), b = before[id], a = t.getBoundingClientRect();
        if(!b){ t.animate([{ opacity:0, transform:'scale(.85)' }, { opacity:1, transform:'none' }], { duration:350, easing:'ease-out' }); t.style.opacity = ''; return; }
        var dx = b.left - a.left, dy = b.top - a.top;
        if(dx || dy) t.animate([{ transform:'translate(' + dx + 'px,' + dy + 'px)' }, { transform:'none' }], { duration:450, easing:'cubic-bezier(.2,.8,.2,1)' });
      });
    }
    var pos = rankOf('mark'), at = $('#hq .chal .at'), chal = $('#hq .chal');
    at.textContent = pos === 1 ? 'Number 1. Still terrible.' : 'Currently ' + ord(pos);
    at.style.color = pos === 1 ? '#46d369' : '#e5e5e5';
    if(pos === 1 && !hqWon){ chal.classList.remove('won'); void chal.offsetWidth; chal.classList.add('won'); beep(988, .1); beep(1319, .25, .1); }
    hqWon = pos === 1;
  }
  // Same search, two accounts, two answers. No explanation on screen on
  // purpose: let them notice, then ask who decided.
  function compare(body){
    var PANES = [
      { P:PROFILES[0], hist:'basketball', rows:['slam','dunk','sport','deep'] },
      { P:PROFILES[1], hist:'nature films', rows:['deep','night','storm','slam'] }
    ];
    body.innerHTML = '<div class="cmp">' + PANES.map(function(x, n){
      return '<div class="tv fade-in" style="animation-delay:' + (n * .15) + 's"><div class="mininav"><span class="logo">MR WHITEFLIX</span><span class="q">' + ic('magnifying-glass') + 'something good to watch</span></div>' +
        '<div class="who"><span class="av">' + av(x.P) + '</span><input type="text" value="' + esc(x.P.name) + '" aria-label="Name of pupil ' + (n + 1) + '"></div>' +
        '<div class="hist">Last week they watched <b>' + x.hist + '</b></div>' +
        '<h3 class="ptitle">Top picks for ' + esc(x.P.name) + '</h3>' +
        '<div class="g2">' + x.rows.map(function(id, i){ return card(BY[id], { extra:'<span class="rk">' + (i + 1) + '</span>' }); }).join('') + '</div></div>';
    }).join('') + '</div>';
    // retitle live so the board says the pupils' real names
    $$('.who input', body).forEach(function(inp, i){
      inp.addEventListener('input', function(){ $$('.ptitle', body)[i].textContent = 'Top picks for ' + (inp.value || 'this pupil'); });
    });
  }

  /* =================== events =================== */
  function wire(){
    $('#standby').addEventListener('click', turnOn);
    $('.skipintro').addEventListener('click', function(e){ e.stopPropagation(); clearLater(); bootGen++; decodeAll(function(){}).then(afterBoot); });
    $('#profiles').addEventListener('click', function(e){ var b = e.target.closest('.pf'); if(b && !$('#profiles').classList.contains('leaving')) choose(b); });

    // one delegated handler for every card, button and link in the app,
    // the modal and HQ, so re-rendering never loses a listener
    document.addEventListener('click', function(e){
      var t = e.target, el;
      if((el = t.closest('[data-play]'))){ e.stopPropagation(); play(el.getAttribute('data-play')); return; }
      if((el = t.closest('[data-remind]'))){
        // does nothing, like the real one
        el.innerHTML = ic('check') + (el.classList.contains('btn') ? 'We’ll remind you' : '');
        el.setAttribute('aria-label', 'We’ll remind you'); return;
      }
      if((el = t.closest('[data-list]'))){ toggleList(el.getAttribute('data-list'), el); return; }
      if((el = t.closest('[data-more]'))){ openModal(el.getAttribute('data-more')); return; }
      if((el = t.closest('[data-word]'))){ toggleWord(el.getAttribute('data-word')); return; }
      if((el = t.closest('[data-go]'))){ go(el.getAttribute('data-go')); return; }
      if((el = t.closest('[data-switch]'))){
        var P = PROFILES.filter(function(x){ return x.k === el.getAttribute('data-switch'); })[0];
        closeMenus(); S.prof = P; S.page = 'home'; enterApp(true); return;
      }
      if(t.closest('[data-who]')){ profiles(); return; }
      if((el = t.closest('[data-hq]'))){ hq(el.getAttribute('data-hq')); return; }
      if(t.closest('[data-off]')){ standby(); return; }
      if(t.closest('.x') || t.id === 'modal'){ closeModal(); return; }
      if((el = t.closest('.card, .t10item, .mcard, .pv, .tt, .note'))){ if(el.getAttribute('data-id')) openModal(el.getAttribute('data-id')); return; }
      if((el = t.closest('.drop'))){
        if(t.closest('.menu')) return;
        var was = el.classList.contains('open'); closeMenus(); if(!was) el.classList.add('open'); return;
      }
      if(t.closest('.fsbtn')){ fullscreen(); return; }
      closeMenus();
    });

    // hover previews, only where there is a real mouse
    if(!coarse){
      $('#app').addEventListener('mouseover', function(e){
        var c = e.target.closest('.card');
        if(!c || c === pvFor || c.closest('.tv')) return;
        clearTimeout(pvT); pvFor = c;
        pvT = setTimeout(function(){ if(pvFor === c && c.matches(':hover')) showPv(c); }, 480);
      });
      $('#app').addEventListener('mouseout', function(e){
        var c = e.target.closest('.card');
        if(c && !c.contains(e.relatedTarget) && !(pvEl && pvEl.contains(e.relatedTarget))){ clearTimeout(pvT); if(!pvEl) pvFor = null; }
      });
    }

    var app = $('#app');
    app.addEventListener('scroll', function(){ $('.nav').classList.toggle('solid', app.scrollTop > 20); killPv(); }, { passive:true });

    var sb = $('.sbox'), inp = $('input', sb);
    $('.sgo').addEventListener('click', function(e){
      e.stopPropagation();
      if(!sb.classList.contains('open')){ sb.classList.add('open'); setQuery(S.query); if(!coarse) inp.focus(); }
      else if(!coarse) inp.focus();
    });
    inp.addEventListener('input', function(){ setQuery(inp.value, true); });
    $('.clr').addEventListener('click', function(e){ e.stopPropagation(); inp.value = ''; go('home'); });

    // player
    var pl = $('#player');
    // on a touch board the first tap on the picture only brings the
    // controls back, the way a real player behaves
    var uiAtDown = true;
    pl.addEventListener('pointerdown', function(e){ uiAtDown = pl.classList.contains('ui') || e.pointerType === 'mouse'; });
    pl.addEventListener('pointermove', function(e){ if(e.pointerType === 'mouse') poke(); });
    pl.addEventListener('click', function(e){
      var woke = uiAtDown;
      poke();
      if(!pl.classList.contains('go')) { if(e.target.closest('.pback')) leavePlayer(); return; }
      if(e.target.closest('.pback')){ leavePlayer(); return; }
      if(e.target.closest('.pplay')){ setPlaying(!PL.playing); return; }
      if(e.target.closest('.pb10')){ PL.t = Math.max(0, PL.t - 10); drawBar(); return; }
      if(e.target.closest('.pf10')){ PL.t = Math.min(PL.dur, PL.t + 10); drawBar(); return; }
      if(e.target.closest('.pnext')){ var r = ranked(), i = r.indexOf(PL.p); play(r[(i + 1) % r.length].id); return; }
      if(e.target.closest('.psubs')){
        if(PL.cart){ PL.subs = PL.subs === false; drawBar(); }
        else $('.caption', pl).classList.toggle('on');
        return;
      }
      var bar = e.target.closest('.pbar');
      if(bar){ var rr = bar.getBoundingClientRect(); PL.t = PL.dur * Math.max(0, Math.min(1, (e.clientX - rr.left) / rr.width)); drawBar(); return; }
      if(e.target.closest('.pbottom, .pvol, .fsbtn')) return;
      if(!woke) return;
      setPlaying(!PL.playing);
    });

    // HQ
    $$('#hq .tab').forEach(function(t){ t.addEventListener('click', function(){ HQ.tab = t.getAttribute('data-tab'); setHash(HQ.tab === 'compare' ? 'compare' : 'hq'); hqDraw(); }); });
    $('#hq .hqreset').addEventListener('click', function(){ S.w = { words:DEFAULT_W.words, pop:DEFAULT_W.pop, paid:DEFAULT_W.paid }; hqDraw(); });
    $('#hq .hqout').addEventListener('click', function(){ S.page = 'home'; enterApp(true); });
    $('#hq .gate').addEventListener('click', function(){ $('#hq .gate').hidden = true; });

    document.addEventListener('keydown', function(e){
      var tag = (e.target.tagName || '').toLowerCase();
      if(tag === 'input' || tag === 'textarea'){ if(e.key === 'Escape') e.target.blur(); return; }
      if(e.key === 'f' || e.key === 'F'){ fullscreen(); }
      else if(e.key === 'Escape'){
        if($('#modal').classList.contains('on')) closeModal();
        else if($('#player').classList.contains('on')) leavePlayer();
        else closeMenus();
      }
      else if(e.key === ' ' && $('#player').classList.contains('on') && $('#player').classList.contains('go')){ e.preventDefault(); setPlaying(!PL.playing); poke(); }
    });
    document.addEventListener('fullscreenchange', syncFs);
    document.addEventListener('webkitfullscreenchange', syncFs);
  }

  function start(){
    wire(); syncFs();
    var h = (location.hash || '').replace('#', '');
    if(h === 'profiles') profiles();
    else if(h === 'home'){ decodeAll(function(){}); enterApp(true); }
    else if(h === 'search'){ decodeAll(function(){}); S.page = 'search'; enterApp(false); $('.sbox').classList.add('open'); }
    else if(h === 'hq') hq('controls');
    else if(h === 'compare') hq('compare');
    else if(['new','list','sport','nature'].indexOf(h) > -1){ S.page = h; enterApp(false); }
    else if(h === 'photocopier'){ direct = 'photo'; standby(); $('#standby p').textContent = 'Press to watch'; }
    else standby();
  }

  return { start:start };
})();
</script>
