<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Answers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{--bg:#0b0c0f;--panel:#15171c;--panel2:#1c1f26;--edge:#2c303a;--tx:#f4f5f7;--mut:#b9bfcb;--yel:#ffd23f;--play:#ff5b4f;--ok:#46d98a;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  svg.i{width:1em;height:1em;fill:currentColor;flex:none}
  .top{position:sticky;top:0;z-index:5;height:56px;background:var(--panel);border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:12px;padding:0 16px}
  .top .rec{width:12px;height:12px;border-radius:50%;background:var(--play);box-shadow:0 0 10px var(--play);flex:none}
  .top .file{font-family:var(--mono);font-size:15px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .code{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:18px;color:var(--yel);letter-spacing:.08em}
  main{max-width:860px;margin:0 auto;padding:24px 16px 120px}
  h1{margin:0 0 20px;font-size:clamp(1.6rem,5vw,2.4rem);font-weight:800;line-height:1.15;letter-spacing:-.01em}
  .kick{font-family:var(--mono);font-size:14px;letter-spacing:.12em;color:var(--yel);margin:0 0 8px}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:18px}
  textarea,input{width:100%;font:inherit;font-size:20px;color:var(--tx);background:#0f1115;border:2px solid var(--edge);border-radius:12px;padding:14px;outline:none}
  textarea{min-height:140px;resize:vertical;line-height:1.35}
  textarea.small{min-height:84px;font-size:18px}
  textarea:focus,input:focus{border-color:var(--yel)}
  input.codein{font-family:var(--mono);font-size:34px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
  .lab{font-size:16px;font-weight:600;color:var(--mut);margin:18px 0 8px}
  .send{margin-top:16px;width:100%;min-height:64px;border:0;border-radius:14px;background:var(--yel);color:#141414;font:inherit;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}
  .send:disabled{opacity:.45;cursor:default}
  .status{min-height:28px;margin-top:12px;font-size:18px;font-weight:600;text-align:center}
  .status.err{color:#ffb4ad}
  .status.ok{color:var(--ok)}
  .ticks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (max-width:520px){ .ticks{grid-template-columns:1fr} }
  .tk{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 12px;border-radius:14px;border:2px solid var(--edge);background:var(--panel2);color:var(--tx);font:inherit;font-size:18px;font-weight:700;text-align:left;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
  .tk:active{transform:scale(.98)}
  .tk .pic{width:64px;height:40px;flex:none;border-radius:8px;background:#0c0e12;display:grid;place-items:center;color:var(--yel);font-size:26px;overflow:hidden}
  .tk .pic svg.fr{width:100%;height:100%}
  .tk .lb{flex:1;line-height:1.2}
  .tk .box{width:34px;height:34px;flex:none;border-radius:9px;border:2px solid #4a505c;display:grid;place-items:center;font-size:22px;color:transparent}
  .tk.on{border-color:var(--yel);background:#2a2614}
  .tk.on .box{background:var(--yel);border-color:var(--yel);color:#141414}
  .tk.wait{opacity:.6}
  .note-row{display:flex;gap:10px;align-items:stretch}
  .note-row textarea{flex:1}
  .note-row .send{width:auto;margin:0;padding:0 22px;min-height:0;font-size:19px}
  .hint{font-size:16px;color:var(--mut);margin:-8px 0 16px}
  .done{text-align:center;padding:36px 18px}
  .done .big{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;background:var(--ok);color:#0b0c0f;display:grid;place-items:center;font-size:48px}
  .done h2{margin:0 0 8px;font-size:28px}
  .done p{margin:0;color:var(--mut);font-size:18px;line-height:1.4}
  .wait{color:var(--mut);font-size:18px;text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="top"><span class="rec"></span><span class="file">video-production / live</span><span class="code" id="code"></span></div>
<main id="app"><p class="wait">Loading&hellip;</p></main>
<script>
(function(){
  // same Supabase project as video-l1.html and HB_LIVE in index.html
  var SB_URL = 'https://jpbehlvbrbalrrvmxsnn.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwYmVobHZicmJhbHJydm14c25uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0ODUxNjAsImV4cCI6MjA5NzA2MTE2MH0.g5feQT5m9sQcKMK_R98nHxIpwMc5w27PdvCkx8PzvMg';
  var PH = {"check":"<path d=\"M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z\"/>","paper-plane-right":"<path d=\"M231.87,114l-168-95.89A16,16,0,0,0,40.92,37.34L71.55,128,40.92,218.67A16,16,0,0,0,56,240a16.15,16.15,0,0,0,7.93-2.1l167.92-96.05a16,16,0,0,0,.05-27.89ZM56,224a.56.56,0,0,0,0-.12L85.74,136H144a8,8,0,0,0,0-16H85.74L56.06,32.16A.46.46,0,0,0,56,32l168,95.83Z\"/>","timer":"<path d=\"M128,40a96,96,0,1,0,96,96A96.11,96.11,0,0,0,128,40Zm0,176a80,80,0,1,1,80-80A80.09,80.09,0,0,1,128,216ZM173.66,90.34a8,8,0,0,1,0,11.32l-40,40a8,8,0,0,1-11.32-11.32l40-40A8,8,0,0,1,173.66,90.34ZM96,16a8,8,0,0,1,8-8h48a8,8,0,0,1,0,16H104A8,8,0,0,1,96,16Z\"/>","arrows-out-cardinal":"<path d=\"M90.34,61.66a8,8,0,0,1,0-11.32l32-32a8,8,0,0,1,11.32,0l32,32a8,8,0,0,1-11.32,11.32L136,43.31V96a8,8,0,0,1-16,0V43.31L101.66,61.66A8,8,0,0,1,90.34,61.66Zm64,132.68L136,212.69V160a8,8,0,0,0-16,0v52.69l-18.34-18.35a8,8,0,0,0-11.32,11.32l32,32a8,8,0,0,0,11.32,0l32-32a8,8,0,0,0-11.32-11.32Zm83.32-72-32-32a8,8,0,0,0-11.32,11.32L212.69,120H160a8,8,0,0,0,0,16h52.69l-18.35,18.34a8,8,0,0,0,11.32,11.32l32-32A8,8,0,0,0,237.66,122.34ZM43.31,136H96a8,8,0,0,0,0-16H43.31l18.35-18.34A8,8,0,0,0,50.34,90.34l-32,32a8,8,0,0,0,0,11.32l32,32a8,8,0,0,0,11.32-11.32Z\"/>","video-camera":"<path d=\"M251.77,73a8,8,0,0,0-8.21.39L208,97.05V72a16,16,0,0,0-16-16H32A16,16,0,0,0,16,72V184a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V159l35.56,23.71A8,8,0,0,0,248,184a8,8,0,0,0,8-8V80A8,8,0,0,0,251.77,73ZM192,184H32V72H192V184Zm48-22.95-32-21.33V116.28L240,95Z\"/>","scissors":"<path d=\"M157.73,113.13A8,8,0,0,1,159.82,102L227.48,55.7a8,8,0,0,1,9,13.21l-67.67,46.3a7.92,7.92,0,0,1-4.51,1.4A8,8,0,0,1,157.73,113.13Zm80.87,85.09a8,8,0,0,1-11.12,2.08L136,137.7,93.49,166.78a36,36,0,1,1-9-13.19L121.83,128,84.44,102.41a35.86,35.86,0,1,1,9-13.19l143,97.87A8,8,0,0,1,238.6,198.22ZM80,180a20,20,0,1,0-5.86,14.14A19.85,19.85,0,0,0,80,180ZM74.14,90.13a20,20,0,1,0-28.28,0A19.85,19.85,0,0,0,74.14,90.13Z\"/>","music-notes":"<path d=\"M212.92,17.69a8,8,0,0,0-6.86-1.45l-128,32A8,8,0,0,0,72,56V166.08A36,36,0,1,0,88,196V110.25l112-28v51.83A36,36,0,1,0,216,164V24A8,8,0,0,0,212.92,17.69ZM52,216a20,20,0,1,1,20-20A20,20,0,0,1,52,216ZM88,93.75V62.25l112-28v31.5ZM180,184a20,20,0,1,1,20-20A20,20,0,0,1,180,184Z\"/>","speaker-high":"<path d=\"M155.51,24.81a8,8,0,0,0-8.42.88L77.25,80H32A16,16,0,0,0,16,96v64a16,16,0,0,0,16,16H77.25l69.84,54.31A8,8,0,0,0,160,224V32A8,8,0,0,0,155.51,24.81ZM32,96H72v64H32ZM144,207.64,88,164.09V91.91l56-43.55Zm54-106.08a40,40,0,0,1,0,52.88,8,8,0,0,1-12-10.58,24,24,0,0,0,0-31.72,8,8,0,0,1,12-10.58ZM248,128a79.9,79.9,0,0,1-20.37,53.34,8,8,0,0,1-11.92-10.67,64,64,0,0,0,0-85.33,8,8,0,1,1,11.92-10.67A79.83,79.83,0,0,1,248,128Z\"/>","microphone":"<path d=\"M128,176a48.05,48.05,0,0,0,48-48V64a48,48,0,0,0-96,0v64A48.05,48.05,0,0,0,128,176ZM96,64a32,32,0,0,1,64,0v64a32,32,0,0,1-64,0Zm40,143.6V240a8,8,0,0,1-16,0V207.6A80.11,80.11,0,0,1,48,128a8,8,0,0,1,16,0,64,64,0,0,0,128,0,8,8,0,0,1,16,0A80.11,80.11,0,0,1,136,207.6Z\"/>"};
  function ph(n){ return '<svg class="i" viewBox="0 0 256 256" aria-hidden="true">' + (PH[n] || '') + '</svg>'; }
  function rpc(name, args){
    return fetch(SB_URL + '/rest/v1/rpc/' + name, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY }, body:JSON.stringify(args) })
      .then(function(r){ if(!r.ok) throw new Error('status ' + r.status); return r.json(); });
  }
  function ss(k, v){ try{ if(v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); }catch(e){ return null; } }

  // the same ten things, in the same order, as the lesson's "Things to spot" slide
  var INK = '#ffd23f';
  function person(x, feet, s){
    return '<g transform="translate(' + x + ' ' + feet + ') scale(' + s + ')" fill="none" stroke="' + INK + '" stroke-width="' + (7 / s) + '" stroke-linecap="round">' +
      '<circle cx="0" cy="-150" r="22"/><path d="M0 -128 V-60 M0 -112 L-34 -78 M0 -112 L34 -78 M0 -60 L-26 0 M0 -60 L26 0"/></g>';
  }
  var SHOTS = {
    wide:'<path d="M0 104 Q60 92 120 100 T240 98 V146 H0Z" fill="#2a3a2c"/><circle cx="196" cy="34" r="14" fill="' + INK + '"/>' + person(120, 98, .28),
    mid:person(120, 212, 1.02),
    close:'<circle cx="120" cy="74" r="56" fill="none" stroke="' + INK + '" stroke-width="7"/><circle cx="100" cy="64" r="7" fill="' + INK + '"/><circle cx="140" cy="64" r="7" fill="' + INK + '"/><path d="M98 92 Q120 108 142 92" fill="none" stroke="' + INK + '" stroke-width="7" stroke-linecap="round"/>'
  };
  var SPOT = [['Wide shot','shot:wide'],['Mid shot','shot:mid'],['Close-up','shot:close'],['Slow motion','timer'],['Camera moves with the action','arrows-out-cardinal'],
    ['Camera stays still','video-camera'],['Quick cuts','scissors'],['Music','music-notes'],['Sound effects','speaker-high'],['A voice talking or singing','microphone']];
  function pic(it){
    if(it[1].indexOf('shot:') === 0){ var k = it[1].slice(5); return '<svg class="fr" viewBox="0 0 240 146" preserveAspectRatio="xMidYMid ' + (k === 'wide' ? 'slice' : 'meet') + '">' + SHOTS[k] + '</svg>'; }
    return ph(it[1]);
  }

  var app = document.getElementById('app');
  var code = (location.hash.replace(/^#\/?/, '').split('/')[0] || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  var round = 0, question = '', timer = null;

  function joinForm(err){
    document.getElementById('code').textContent = '';
    app.innerHTML = '<p class="kick">LIVE ANSWERS</p><h1>Type the room code</h1><div class="card">' +
      '<input class="codein" maxlength="5" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDE">' +
      '<button class="send" type="button">Join</button><div class="status' + (err ? ' err' : '') + '">' + (err || '') + '</div></div>';
    var inp = app.querySelector('input'), go = function(){
      var c = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if(c){ location.hash = c; location.reload(); }
    };
    app.querySelector('.send').addEventListener('click', go);
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') go(); });
    inp.focus();
  }
  if(!code){ joinForm(); return; }
  document.getElementById('code').textContent = code;

  function getRoom(cb){
    rpc('live_get_room', { p_code:code }).then(function(rows){
      cb(null, rows && rows.length ? { question:rows[0].question || '', round:rows[0].round || 1 } : null);
    }).catch(function(e){ cb(e); });
  }
  function tickKey(){ return 'vlive_ticks_' + code + '_' + round; }

  function render(){
    var spot = /^\[spot\]\s*/.test(question), q = question.replace(/^\[spot\]\s*/, '');
    if(spot){ renderTicks(q); return; }
    app.innerHTML = '<p class="kick">WRITE YOUR ANSWER</p><h1></h1><div class="card">' +
      '<textarea maxlength="300" placeholder="Type here&hellip;"></textarea>' +
      '<button class="send" type="button">' + ph('paper-plane-right') + 'Send</button><div class="status"></div></div>';
    app.querySelector('h1').textContent = q;
    wireSend(app.querySelector('.send'), app.querySelector('textarea'), app.querySelector('.status'), function(t){ return t; });
  }

  // a written answer can be followed by another one if they think of more
  function wireSend(send, ta, st, wrap){
    send.addEventListener('click', function(){
      var note = ta.value.trim();
      if(!note){ st.className = 'status err'; st.textContent = 'Write something first.'; return; }
      send.disabled = true; st.className = 'status'; st.textContent = 'Sending\u2026';
      rpc('live_submit_answer', { p_code:code, p_kind:'text', p_content:wrap(note) }).then(function(id){
        if(!id) throw new Error('rejected');
        ta.value = ''; st.className = 'status ok'; st.textContent = 'Sent. Look at the board.';
        setTimeout(function(){ send.disabled = false; }, 1500);
      }).catch(function(){ send.disabled = false; st.className = 'status err'; st.textContent = "That didn't send. Try again."; });
    });
  }

  // every tap goes to the board straight away. Each one is a small event (which pupil, which
  // item, on or off, and a counter), so the board can work out each pupil's latest state even
  // if two taps arrive out of order
  function renderTicks(q){
    var state = { on:[], s:0 };
    try{ var saved = JSON.parse(ss(tickKey())); if(saved && Array.isArray(saved.on)) state = saved; }catch(e){}
    app.innerHTML = '<p class="kick">TAP WHAT YOU SPOTTED</p><h1></h1><p class="hint">Each tap goes straight to the board. Tap again to take it back.</p>' +
      '<div class="ticks">' + SPOT.map(function(it, i){
        var on = state.on.indexOf(i) > -1;
        return '<button type="button" class="tk' + (on ? ' on' : '') + '" data-i="' + i + '" aria-pressed="' + on + '"><span class="pic">' + pic(it) + '</span><span class="lb">' + it[0] + '</span><span class="box">' + ph('check') + '</span></button>';
      }).join('') + '</div>' +
      '<div class="status" id="tst"></div>' +
      '<div class="lab">Spotted something else? (you don&rsquo;t have to)</div>' +
      '<div class="note-row"><textarea class="small" maxlength="200" placeholder="Type here&hellip;"></textarea><button class="send" type="button">' + ph('paper-plane-right') + 'Send</button></div><div class="status" id="nst"></div>';
    app.querySelector('h1').textContent = q;
    var tst = document.getElementById('tst');
    [].forEach.call(app.querySelectorAll('.tk'), function(b){
      b.addEventListener('click', function(){
        var i = +b.getAttribute('data-i'), on = !b.classList.contains('on');
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.classList.add('wait');
        state.s++;
        state.on = state.on.filter(function(x){ return x !== i; }); if(on) state.on.push(i);
        ss(tickKey(), JSON.stringify(state));
        tst.className = 'status'; tst.textContent = '';
        rpc('live_submit_answer', { p_code:code, p_kind:'text', p_content:JSON.stringify({ p:pid, i:i, on:on, s:state.s }) }).then(function(id){
          if(!id) throw new Error('rejected');
          b.classList.remove('wait');
        }).catch(function(){
          // undo on screen so what they see matches the board
          b.classList.remove('wait'); b.classList.toggle('on', !on); b.setAttribute('aria-pressed', !on);
          state.on = state.on.filter(function(x){ return x !== i; }); if(!on) state.on.push(i);
          ss(tickKey(), JSON.stringify(state));
          tst.className = 'status err'; tst.textContent = "That didn't reach the board. Tap it again.";
        });
      });
    });
    wireSend(app.querySelector('.note-row .send'), app.querySelector('.note-row textarea'), document.getElementById('nst'), function(t){ return JSON.stringify({ p:pid, n:t }); });
  }

  function check(first){
    getRoom(function(err, r){
      if(err){ if(first) app.innerHTML = '<p class="wait">Can&rsquo;t reach the board. Check the Wi-Fi; this page keeps trying.</p>'; return; }
      if(!r || !r.question){ if(first){ clearInterval(timer); joinForm("That room isn't running. Check the code on the board."); } return; }
      if(r.round !== round || r.question !== question){ round = r.round; question = r.question; render(); }
    });
  }
  // once per device per room, so the board's "joined" count is a headcount, not a refresh count
  var pid = ss('vlive_pid');
  if(!pid){ pid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2); ss('vlive_pid', pid); }
  rpc('live_mark_joined', { p_code:code, p_pupil_id:pid }).catch(function(){});
  check(true);
  timer = setInterval(function(){ check(false); }, 2500);
})();
</script>
</body>
</html>
