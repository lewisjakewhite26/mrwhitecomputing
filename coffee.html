<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send Me a Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root{
    --paper:#F2EADB; --paper2:#E8DDC8; --ink:#1E1B18; --mu:#5F574D; --coffee:#D9622B; --cream:#FFF9EE;
    --hi:#FFD84D; --blue:#2C6FB7; --sea:#9CC7DE; --land:#D9CDA8; --red:#C8402B; --green:#2E8A57;
    --hd:'Archivo Black','Arial Black',sans-serif; --bd:'Atkinson Hyperlegible','Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#2a2622;color:var(--ink);font-family:var(--bd)}
  button{font:inherit}
  #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1600px;height:900px;flex:none;transform-origin:center center;outline:none;background:var(--paper);overflow:hidden}
  /* paper grain that shifts at 12 frames a second */
  #grain{position:absolute;inset:-40px;pointer-events:none;opacity:.55;mix-blend-mode:multiply;z-index:1}
  #host{position:absolute;left:0;top:0;width:1600px;height:804px;z-index:2}
  .scene{position:absolute;inset:0}
  .scene.enter{animation:pull .5s steps(6) both}
  @keyframes pull{from{opacity:0;transform:scale(1.06);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

  .nav{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:16px;z-index:5;background:linear-gradient(transparent,rgba(30,27,24,.06))}
  .btn{font-family:var(--hd);font-size:26px;min-height:64px;padding:0 34px;border-radius:14px;border:4px solid var(--ink);background:var(--cream);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--ink)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .btn.primary{background:var(--coffee);color:#fff}
  .btn:disabled{opacity:.3;cursor:default}
  .mid{display:flex;align-items:center;gap:18px}
  .parts{display:flex;gap:7px;flex-wrap:wrap;max-width:820px;justify-content:center}
  .part{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--mu);background:transparent;padding:0;cursor:pointer}
  .part.done{background:var(--mu)}
  .part.on{background:var(--coffee);border-color:var(--coffee)}
  .tool{font-family:var(--bd);font-weight:700;font-size:16px;color:var(--ink);background:transparent;border:2.5px solid var(--mu);border-radius:999px;padding:6px 14px;cursor:pointer}
  .home{position:absolute;right:30px;top:20px;z-index:6;font-weight:700;font-size:17px;color:var(--mu);text-decoration:none;border:2.5px solid var(--mu);border-radius:999px;padding:6px 16px}
  #notes{position:absolute;left:36px;right:36px;bottom:104px;background:var(--cream);border:4px solid var(--ink);border-radius:14px;padding:16px 22px;font-size:21px;line-height:1.4;display:none;z-index:7}
  #notes.on{display:block}
  #notes b{font-family:var(--hd);font-weight:400;margin-right:10px}

  .pp{transition:opacity .35s steps(4),transform .35s steps(4)}
  .pp.hide{opacity:0;transform:translateY(16px);pointer-events:none}
  .abs{position:absolute}

  .kick{font-family:var(--bd);font-weight:700;font-size:24px;letter-spacing:.16em;text-transform:uppercase;color:var(--coffee)}
  .h1{font-family:var(--hd);font-weight:400;font-size:100px;line-height:.98;margin:0;letter-spacing:-.01em}
  .h2{font-family:var(--hd);font-weight:400;font-size:62px;line-height:1.02;margin:0}
  .big{font-size:38px;line-height:1.3}
  .body{font-size:30px;line-height:1.38}
  .small{font-size:22px;line-height:1.35}
  .hl{background:linear-gradient(transparent 55%,var(--hi) 55%);padding:0 4px}

  /* torn-edge label box that builds itself in steps */
  .tear{display:inline-block;background:var(--ink);color:var(--cream);font-family:var(--hd);font-weight:400;padding:12px 22px 14px;clip-path:polygon(0 6%,4% 0,12% 5%,22% 1%,33% 6%,45% 0,57% 5%,68% 1%,80% 6%,92% 0,100% 4%,98% 50%,100% 96%,90% 100%,78% 95%,66% 100%,54% 94%,42% 100%,30% 95%,18% 100%,7% 94%,0 100%,2% 50%)}
  .tear.or{background:var(--coffee);color:#fff}
  .tear.hi{background:var(--hi);color:var(--ink)}
  .tear.build{animation:tearin .5s steps(5) both}
  @keyframes tearin{from{clip-path:polygon(0 0,0 0,0 100%,0 100%)}to{}}
  .card{background:var(--cream);border:4px solid var(--ink);border-radius:16px;box-shadow:6px 7px 0 rgba(30,27,24,.85)}

  /* map */
  .map{position:absolute;left:0;top:0}
  .face{position:absolute;width:210px;height:280px;border-radius:50% 50% 46% 46%;overflow:hidden}
  .face img{width:100%;height:100%;object-fit:contain}
  .pop{animation:pop .45s steps(5) both}
  @keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}70%{transform:scale(1.12) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0)}}

  /* ranking */
  .tabs{display:flex;gap:12px}
  .tabbtn{font-family:var(--hd);font-size:26px;padding:12px 24px;border-radius:12px;border:4px solid var(--ink);background:var(--cream);cursor:pointer}
  .tabbtn[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
  .slot{position:absolute;left:150px;width:560px;height:84px;border:4px dashed rgba(30,27,24,.35);border-radius:14px;display:flex;align-items:center;padding-left:18px;font-family:var(--hd);font-size:30px;color:rgba(30,27,24,.35)}
  .rk{position:absolute;width:540px;height:78px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--cream);border:4px solid var(--ink);border-radius:14px;box-shadow:4px 5px 0 rgba(30,27,24,.85);cursor:grab;touch-action:none;user-select:none;transition:left .28s cubic-bezier(.3,1.4,.5,1),top .28s cubic-bezier(.3,1.4,.5,1),transform .2s}
  .rk.drag{transition:none;cursor:grabbing;transform:scale(1.07) rotate(-2deg);box-shadow:10px 16px 0 rgba(30,27,24,.55);z-index:20}
  .rk .ic{width:60px;height:60px;flex:none}
  .rk b{font-family:var(--hd);font-weight:400;font-size:28px}
  .rk .ev{margin-left:auto;font-size:18px;font-weight:700;color:var(--mu);text-align:right;line-height:1.15}
  .rk.wob{animation:wob .5s steps(6) 2}
  @keyframes wob{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}

  /* cable chaos */
  .ipad{position:absolute;width:64px;height:84px;margin:-42px 0 0 -32px;border-radius:10px;background:#2f3440;border:4px solid var(--ink);cursor:pointer;touch-action:none}
  .ipad::after{content:"";position:absolute;inset:6px 5px 12px;border-radius:4px;background:#7fb6ff}
  .ipad.sel{outline:6px solid var(--coffee);outline-offset:3px}
  .ipad span{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);font-weight:700;font-size:18px;white-space:nowrap}
  .ipad.small{width:40px;height:52px;margin:-26px 0 0 -20px;border-width:3px;border-radius:7px}
  .ipad.small::after{inset:4px 3px 8px}
  .ipad.small span{font-size:13px;bottom:-20px}
  .counter{font-family:var(--hd);font-size:64px;line-height:1}

  /* signal bars */
  .sig{position:absolute;width:440px;height:520px}
  .lvl{font-family:var(--bd);font-weight:700;font-size:19px;padding:10px 8px;border-radius:12px;border:3px solid var(--ink);background:var(--cream);cursor:pointer;width:100px;line-height:1.1}
  .lvl:active{transform:translateY(3px)}

  @media (prefers-reduced-motion: reduce){ .scene.enter,.pop,.tear.build,.rk.wob{animation:none} .pp{transition:none} }
</style>
</head>

</div>

<script>
(function(){

  var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

  function tone(type, f, at, dur, vol, f2){
    var c = ac(); if(!c) return;
    var t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();

    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);

  function noise(at, dur, vol, type, f1, f2, q){
    var c = ac(); if(!c) return;

  var SFX = {

    baa: function(){ var c = ac(); if(!c) return; var t = c.currentTime, o = c.createOscillator(), g = c.createGain(), l = c.createOscillator(), lg = c.createGain(); o.type = 'sawtooth'; o.frequency.value = 330; l.frequency.value = 18; lg.gain.value = 30; l.connect(lg); lg.connect(o.frequency); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.15, t + .05); g.gain.exponentialRampToValueAtTime(.0001, t + .9); o.connect(g); g.connect(c.destination); o.start(t); l.start(t); o.stop(t + 1); l.stop(t + 1); },

    sad: function(){ [392, 349.2, 311.1].forEach(function(f, i){ tone('triangle', f, i * .4, .38, .14); }); },

  };
  function sfx(k){ try{ SFX[k] && SFX[k](); }catch(e){} }
  var sndBtn = document.getElementById('snd');
  function sndPaint(){ sndBtn.textContent = soundOn ? 'Sound on' : 'Sound off'; }
  sndBtn.addEventListener('click', function(e){ e.stopPropagation(); soundOn = !soundOn; store('cf_sound', soundOn ? 'on' : 'off'); sndPaint(); stage.focus({ preventScroll:true }); });

  var timers = [], raf = null;

    coffee:'<svg viewBox="0 0 80 80"><path d="M16 26 L64 26 L58 70 L22 70 Z" fill="#FFF9EE" stroke="#1E1B18" stroke-width="4"/><path d="M12 20 L68 20 L66 28 L14 28 Z" fill="#D9622B" stroke="#1E1B18" stroke-width="4"/><path d="M26 44 C32 36 46 36 52 44 C46 54 32 54 26 44 Z" fill="#C8402B"/><path d="M34 12 C30 6 38 4 34 0 M46 12 C42 6 50 4 46 0" stroke="#5F574D" stroke-width="3" fill="none"/></svg>'

  var HI = [1150, 200], BAM = [1090, 640], SORT = [840, 440];

  }
  function lerp(a, b, t){ return a + (b - a) * t; }
  function along(pts, t){
    var L = [], tot = 0, i;
    for(i = 1; i < pts.length; i++){ var d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(d); tot += d; }

  function polyD(pts, t){
    var out = [pts[0]], L = [], tot = 0, i;

    host.innerHTML = '';
    var r = document.createElement('div'); r.className = 'scene' + (RM ? '' : ' enter'); host.appendChild(r);
    p.build(r);
    [].forEach.call(r.querySelectorAll('.pp'), function(el){ el.classList.add('hide'); });
    r.getBoundingClientRect();
    paint(r, step, false);
    document.getElementById('back').disabled = part === 0 && step === 0;
    document.getElementById('next').disabled = part === PARTS.length - 1 && step === p.steps;
    setTimeout(function(){ stage.focus({ preventScroll:true }); }, 30);
  }
  function next(){
    var p = PARTS[part];
    if(step < p.steps){ step++; paint(host.firstChild, step, true); document.getElementById('back').disabled = false; document.getElementById('next').disabled = part === PARTS.length - 1 && step === p.steps; return; }
    if(part < PARTS.length - 1) show(part + 1, 0);
  }
  function back(){
    var p = PARTS[part];
    if(step > 0){ stopAll(); step--; paint(host.firstChild, step, false); document.getElementById('back').disabled = part === 0 && step === 0; document.getElementById('next').disabled = false; return; }
    if(part > 0) show(part - 1, 'end');
  }
  document.getElementById('next').addEventListener('click', function(e){ e.stopPropagation(); next(); });
  document.getElementById('back').addEventListener('click', function(e){ e.stopPropagation(); back(); });
  document.getElementById('home').addEventListener('click', function(e){ e.stopPropagation(); });
  host.addEventListener('click', function(e){ if(e.target.closest('a,button,.rk,.ipad,svg#wires,.card')) return; next(); });
  addEventListener('keydown', function(e){
    if(['ArrowRight','PageDown',' ','Enter'].indexOf(e.key) > -1){ e.preventDefault(); next(); }
    else if(['ArrowLeft','PageUp'].indexOf(e.key) > -1){ e.preventDefault(); back(); }
    else if(e.key === 'n' || e.key === 'N'){ notesOn = !notesOn; paintNotes(); }
  });
  function fromHash(){ var m = /^#part(\d+)$/.exec(location.hash); return m ? +m[1] - 1 : 0; }
  addEventListener('hashchange', function(){ show(fromHash(), 0); });
  show(fromHash(), 0);
})();
</script>
</body>
</html>
