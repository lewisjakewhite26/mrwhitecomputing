<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mr White-bot &middot; Fixing mistakes &middot; the disco!</title>
<style>
  :root{ --ink:#1b1d22; --paper:#eef1f8; }
  html,body{margin:0;padding:0;background:#eef1f8;height:100%;overflow:hidden;
    font-family:ui-rounded,'SF Pro Rounded',Verdana,sans-serif}
  .stage{position:relative;width:100vw;height:100vh;display:flex;
    align-items:center;justify-content:center}
  .scene{position:relative;width:1000px;height:640px;max-width:96vw;max-height:82vh;
    background:#eef1f8;transition:background 1s ease}
  .scene.party{background:linear-gradient(180deg,#1a1440,#2a1250 60%,#180f30)}

  .partyglow{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;pointer-events:none}
  .scene.party .partyglow{opacity:1}

  .beam{position:absolute;top:-30px;left:50%;width:260px;height:600px;
    clip-path:polygon(47% 0%,53% 0%,100% 100%,0% 100%);opacity:0;mix-blend-mode:screen;
    transition:opacity 1s ease}
  .scene.party .beam{opacity:.55}
  .beam.b1{background:linear-gradient(180deg,rgba(255,80,120,.95),rgba(255,80,120,0));
    margin-left:-360px;transform-origin:50% 0;animation:sweep1 3.4s ease-in-out infinite}
  .beam.b2{background:linear-gradient(180deg,rgba(80,180,255,.95),rgba(80,180,255,0));
    margin-left:-130px;transform-origin:50% 0;animation:sweep2 2.8s ease-in-out infinite}
  .beam.b3{background:linear-gradient(180deg,rgba(255,220,80,.95),rgba(255,220,80,0));
    margin-left:100px;transform-origin:50% 0;animation:sweep3 3.1s ease-in-out infinite}
  .beam.b4{background:linear-gradient(180deg,rgba(140,255,170,.95),rgba(140,255,170,0));
    margin-left:330px;transform-origin:50% 0;animation:sweep4 2.6s ease-in-out infinite}
  @keyframes sweep1{ 0%,100%{transform:rotate(-24deg)} 50%{transform:rotate(8deg)} }
  @keyframes sweep2{ 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(24deg)} }
  @keyframes sweep3{ 0%,100%{transform:rotate(-20deg)} 50%{transform:rotate(12deg)} }
  @keyframes sweep4{ 0%,100%{transform:rotate(-12deg)} 50%{transform:rotate(20deg)} }

  .discoball{position:absolute;left:24%;top:26px;transform:translateX(-50%);width:64px;height:64px;
    opacity:0;transition:opacity 1s ease}
  .scene.party .discoball{opacity:1}
  .discoball .rod{position:absolute;left:50%;top:-36px;transform:translateX(-50%);width:3px;height:36px;background:#8c919e}
  .discoball .ball{position:absolute;inset:0;border-radius:50%;
    background:repeating-conic-gradient(#e3e6ed 0deg 11deg,#9aa3b5 11deg 22deg);
    box-shadow:0 6px 14px rgba(0,0,0,.35), inset -8px -8px 16px rgba(0,0,0,.35), inset 5px 5px 12px rgba(255,255,255,.7)}
  .discoball.spin .ball{animation:discospin 2.6s linear infinite}
  @keyframes discospin{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  .sparkle{position:absolute;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 6px 2px #fff}
  .scene.party .sparkle{animation:twinkle 1.4s ease-in-out infinite}
  .sp1{left:44%;top:8%;width:5px;height:5px;animation-delay:.1s!important}
  .sp2{left:58%;top:6%;width:4px;height:4px;animation-delay:.5s!important}
  .sp3{left:36%;top:14%;width:4px;height:4px;animation-delay:.9s!important}
  .sp4{left:64%;top:15%;width:6px;height:6px;animation-delay:.3s!important}
  @keyframes twinkle{ 0%,100%{opacity:0} 50%{opacity:1} }

  .floor{position:absolute;left:0;right:0;bottom:78px;height:2px;background:#d4d8e2;transition:opacity .6s ease}
  .scene.party .floor{opacity:0}

  .tiles{position:absolute;left:0;right:0;bottom:60px;height:20px;display:flex;justify-content:center;
    gap:8px;opacity:0;transition:opacity 1s ease}
  .scene.party .tiles{opacity:1}
  .tile{width:34px;height:16px;border-radius:4px;background:#ff5d8f;animation:tileflash 1.2s ease-in-out infinite}
  .tile:nth-child(1){animation-delay:0s;background:#ff5d8f}
  .tile:nth-child(2){animation-delay:.15s;background:#ffd166}
  .tile:nth-child(3){animation-delay:.3s;background:#5dc9ff}
  .tile:nth-child(4){animation-delay:.45s;background:#7CFFB2}
  .tile:nth-child(5){animation-delay:.6s;background:#c792ff}
  .tile:nth-child(6){animation-delay:.75s;background:#ff5d8f}
  .tile:nth-child(7){animation-delay:.9s;background:#ffd166}
  .tile:nth-child(8){animation-delay:1.05s;background:#5dc9ff}
  @keyframes tileflash{ 0%,100%{opacity:.35;transform:scaleY(1)} 50%{opacity:1;transform:scaleY(1.6)} }

  .botWrap{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);width:340px;height:490px}
  .bot{position:relative;width:340px;height:490px}
  .bot.bob{animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }

  .bot.dance{animation:dance .55s ease-in-out infinite}
  @keyframes dance{
    0%{transform:translateY(0) rotate(-5deg)}
    25%{transform:translateY(-16px) rotate(5deg)}
    50%{transform:translateY(0) rotate(-5deg)}
    75%{transform:translateY(-16px) rotate(5deg)}
    100%{transform:translateY(0) rotate(-5deg)}
  }

  .leg{position:absolute;bottom:0;width:64px;height:110px;background:linear-gradient(180deg,#e7e9ef,#c3c7d1);
    border:3px solid #9297a4;border-radius:16px 16px 22px 22px;box-shadow:inset 0 -8px 14px rgba(0,0,0,.12)}
  .leg.l{left:70px} .leg.r{right:70px}
  .bot.dance .leg.l{animation:stepL .55s ease-in-out infinite}
  .bot.dance .leg.r{animation:stepR .55s ease-in-out infinite}
  @keyframes stepL{ 0%,100%{transform:translateX(0) rotate(0)} 50%{transform:translateX(-16px) rotate(-12deg)} }
  @keyframes stepR{ 0%,100%{transform:translateX(0) rotate(0)} 50%{transform:translateX(16px) rotate(12deg)} }
  .foot{position:absolute;bottom:-14px;width:84px;height:34px;background:linear-gradient(180deg,#d3d7e0,#a7acb9);
    border:3px solid #8c919e;border-radius:16px}
  .foot.l{left:60px} .foot.r{right:60px}

  .torso{position:absolute;left:38px;bottom:96px;width:264px;height:220px;
    background:linear-gradient(160deg,#f4f6fb,#c9cdd8);
    border:4px solid #8c919e;border-radius:38px;
    box-shadow:inset 0 10px 18px rgba(255,255,255,.6), inset 0 -18px 26px rgba(0,0,0,.14)}
  .chest{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,#8be0ff,#1f7fc4 70%,#0d5794);
    border:5px solid #3b4250;box-shadow:0 0 18px 4px rgba(70,190,255,.55)}
  .chest::after{content:"";position:absolute;inset:14px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
  .bot.dance .chest{animation:chestpulse .55s ease-in-out infinite}
  @keyframes chestpulse{ 0%,100%{box-shadow:0 0 18px 4px rgba(70,190,255,.55)} 50%{box-shadow:0 0 26px 10px rgba(255,120,220,.75)} }
  .vent{position:absolute;width:38px;height:6px;background:#9297a4;border-radius:3px;bottom:34px}
  .vent.a{left:44px} .vent.b{left:44px;bottom:22px} .vent.c{right:44px} .vent.d{right:44px;bottom:22px}

  .arm{position:absolute;top:250px;width:34px;height:150px;background:linear-gradient(180deg,#eef0f5,#c3c7d1);
    border:3px solid #9297a4;border-radius:17px;box-shadow:inset -6px 0 10px rgba(0,0,0,.10);
    transform-origin:50% 0}
  .arm.l{left:6px;transform:rotate(8deg)} .arm.r{right:6px;transform:rotate(-8deg)}
  .bot.dance .arm.l{animation:armL .55s ease-in-out infinite}
  .bot.dance .arm.r{animation:armR .55s ease-in-out infinite}
  @keyframes armL{ 0%,100%{transform:rotate(10deg)} 50%{transform:rotate(-70deg)} }
  @keyframes armR{ 0%,100%{transform:rotate(-10deg)} 50%{transform:rotate(70deg)} }
  .hand{position:absolute;top:382px;width:46px;height:46px;border-radius:50%;
    background:linear-gradient(160deg,#e3e6ed,#b7bbc7);border:3px solid #8c919e}
  .hand.l{left:-3px} .hand.r{right:-3px}
  .bot.dance .hand.l{animation:handL .55s ease-in-out infinite}
  .bot.dance .hand.r{animation:handR .55s ease-in-out infinite}
  @keyframes handL{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,-58px)} }
  @keyframes handR{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,-58px)} }

  .neck{position:absolute;left:50%;bottom:308px;transform:translateX(-50%);width:52px;height:34px;
    background:linear-gradient(180deg,#d3d7e0,#9297a4);border:3px solid #8c919e;border-radius:8px}

  .ant-stem{position:absolute;left:50%;bottom:558px;transform:translateX(-50%);width:5px;height:46px;
    background:#8c919e;border-radius:3px}
  .ant-dot{position:absolute;left:50%;bottom:598px;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe07a,#e0a300);box-shadow:0 0 10px 3px rgba(255,200,60,.7)}
  .bot.blink .ant-dot{animation:antblink 1s steps(2) infinite}
  @keyframes antblink{ 50%{opacity:.25} }
  .bot.dance .ant-dot{animation:rainbow 1.1s linear infinite}
  @keyframes rainbow{
    0%{background:radial-gradient(circle at 35% 30%,#ff8a8a,#e63946);box-shadow:0 0 14px 5px rgba(255,110,110,.85)}
    20%{background:radial-gradient(circle at 35% 30%,#ffe08a,#f4a300);box-shadow:0 0 14px 5px rgba(255,209,102,.85)}
    40%{background:radial-gradient(circle at 35% 30%,#9fe8ff,#1f7fc4);box-shadow:0 0 14px 5px rgba(139,224,255,.85)}
    60%{background:radial-gradient(circle at 35% 30%,#c7aaff,#7b2ff7);box-shadow:0 0 14px 5px rgba(184,146,255,.85)}
    80%{background:radial-gradient(circle at 35% 30%,#9dffc0,#22c55e);box-shadow:0 0 14px 5px rgba(124,255,178,.85)}
    100%{background:radial-gradient(circle at 35% 30%,#ff8a8a,#e63946);box-shadow:0 0 14px 5px rgba(255,110,110,.85)}
  }

  .head{position:absolute;left:50%;bottom:332px;transform:translateX(-50%);width:222px;height:196px;
    background:linear-gradient(160deg,#f2f4f9,#c9cdd8);border:5px solid #7d838f;border-radius:26px;
    box-shadow:inset 0 8px 14px rgba(255,255,255,.6), inset 0 -14px 20px rgba(0,0,0,.14), 0 10px 20px rgba(0,0,0,.18)}
  .bot.dance .head{animation:headbob .55s ease-in-out infinite}
  @keyframes headbob{ 0%,100%{transform:translateX(-50%) rotate(-7deg)} 50%{transform:translateX(-50%) rotate(7deg)} }
  .bolt{position:absolute;width:10px;height:10px;border-radius:50%;background:#7d838f;box-shadow:inset 0 1px 1px rgba(0,0,0,.4)}
  .bolt.tl{left:14px;top:14px} .bolt.tr{right:14px;top:14px} .bolt.bl{left:14px;bottom:14px} .bolt.br{right:14px;bottom:14px}

  .screen{position:absolute;left:24px;top:24px;width:174px;height:148px;border-radius:12px;overflow:hidden;
    background:#03150a;border:4px solid #1b1e24;box-shadow:inset 0 0 24px 6px rgba(0,0,0,.85)}
  .screen .face{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:150%;height:150%;
    filter:grayscale(1) brightness(1.15) contrast(1.5) sepia(1) hue-rotate(78deg) saturate(4.5);
    mix-blend-mode:screen;opacity:0;transition:opacity .3s ease}
  .screen .face.show{opacity:.95}
  .screen .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(70,255,140,.35),rgba(0,20,8,0) 68%)}
  .screen .scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,rgba(0,0,0,0) 1px 3px)}
  .screen .vignette{position:absolute;inset:0;box-shadow:inset 0 0 30px 14px rgba(0,0,0,.75);border-radius:8px}

  .cap{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);min-height:1.6em;
    font-size:clamp(1.1rem,2.4vw,1.6rem);font-weight:700;color:var(--ink);
    text-align:center;max-width:80vw;opacity:0;transition:opacity .3s ease,color .6s ease}
  .cap.show{opacity:1}
  .scene.party .cap{color:#fff}
  .cap .caret{display:none;width:.08em}
  .cap .caret.on{display:inline-block;animation:care 1s steps(2) infinite}
  @keyframes care{ 50%{opacity:0} }

  .standby{position:absolute;inset:0;background:rgba(238,241,248,.96);display:flex;
    align-items:center;justify-content:center;z-index:5;cursor:pointer}
  .standby.hidden{display:none}
  .playbtn{display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:800;
    font-size:1.3rem;color:var(--ink)}
  .playbtn .ring{width:88px;height:88px;border-radius:50%;background:#1b1d22;display:grid;place-items:center}
  .playbtn svg{width:34px;height:34px;fill:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="scene" id="scene">
    <div class="partyglow"></div>
    <div class="beam b1"></div>
    <div class="beam b2"></div>
    <div class="beam b3"></div>
    <div class="beam b4"></div>
    <div class="sparkle sp1"></div>
    <div class="sparkle sp2"></div>
    <div class="sparkle sp3"></div>
    <div class="sparkle sp4"></div>
    <div class="discoball" id="discoball">
      <div class="rod"></div>
      <div class="ball"></div>
    </div>

    <div class="floor"></div>
    <div class="tiles">
      <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
      <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
    </div>

    <div class="botWrap" id="botWrap">
      <div class="bot bob blink" id="bot">
        <div class="leg l"></div><div class="leg r"></div>
        <div class="foot l"></div><div class="foot r"></div>
        <div class="torso">
          <div class="chest"></div>
          <div class="vent a"></div><div class="vent b"></div><div class="vent c"></div><div class="vent d"></div>
        </div>
        <div class="arm l"></div><div class="arm r"></div>
        <div class="hand l"></div><div class="hand r"></div>
        <div class="neck"></div>
        <div class="ant-stem"></div><div class="ant-dot"></div>
        <div class="head">
          <div class="bolt tl"></div><div class="bolt tr"></div><div class="bolt bl"></div><div class="bolt br"></div>
          <div class="screen">
            <img class="face smile show" src="../whiteflix/img/face_smile.webp">
            <div class="glow"></div>
            <div class="scan"></div>
            <div class="vignette"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="cap" id="cap"><span id="capTxt"></span><span class="caret" id="capCaret">|</span></div>
  </div>
</div>
<div class="standby" id="standby">
  <div class="playbtn">
    <div class="ring"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    <span>Press to play</span>
  </div>
</div>
<script>
  var scene = document.getElementById('scene'),
      bot = document.getElementById('bot'),
      discoball = document.getElementById('discoball'),
      cap = document.getElementById('cap'), capTxt = document.getElementById('capTxt'),
      capCaret = document.getElementById('capCaret'),
      standby = document.getElementById('standby');

  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  var AC = window.AudioContext || window.webkitAudioContext;
  var ac = null;
  function ctx(){ if(!ac && AC) ac = new AC(); return ac; }
  function tone(type, f, dur, vol, f2){
    var c = ctx(); if(!c) return;
    var t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .05);
  }
  function sndClack(){ tone('square', 340 + Math.random() * 90, .04, .05); }
  function sndCheer(){
    [523, 659, 784, 1047].forEach(function(f, i){
      setTimeout(function(){ tone('triangle', f, .28, .14); }, i * 90);
    });
  }
  function sndBass(){ tone('sine', 95, .16, .22, 60); }
  function sndTick(){ tone('square', 2600, .02, .035); }

  var beatTimer = null;
  function startBeat(){
    var beat = 0;
    beatTimer = setInterval(function(){
      if(beat % 2 === 0) sndBass(); else sndTick();
      beat++;
    }, 300);
  }
  function stopBeat(){ if(beatTimer){ clearInterval(beatTimer); beatTimer = null; } }

  function showCap(t){ capCaret.classList.remove('on'); capTxt.textContent = t; cap.classList.add('show'); }
  function hideCap(){ cap.classList.remove('show'); capTxt.textContent = ''; capCaret.classList.remove('on'); }
  async function typeCap(text){
    capTxt.textContent = '';
    cap.classList.add('show');
    capCaret.classList.add('on');
    for(var i = 0; i < text.length; i++){
      capTxt.textContent += text[i];
      if(text[i] !== ' ') sndClack();
      await wait(60 + Math.random() * 45);
    }
  }

  async function run(){
    await wait(600);
    showCap('Every mistake is fixed - the invite is perfect!');
    await wait(2600);
    hideCap();
    await wait(500);

    showCap("Time for Mr White-bot's disco!");
    await wait(2000);
    hideCap();
    await wait(300);

    sndCheer();
    scene.classList.add('party');
    discoball.classList.add('spin');
    startBeat();
    await wait(700);

    bot.classList.remove('bob');
    bot.classList.add('dance');
    await wait(1400);

    showCap('Mr White-bot is having the best time!');
    await wait(3200);
    hideCap();
    await wait(1200);

    await typeCap('Great job fixing every mistake today!');
  }

  standby.addEventListener('click', function(){
    standby.classList.add('hidden');
    ctx();
    run();
  });
</script>
</body>
</html>
